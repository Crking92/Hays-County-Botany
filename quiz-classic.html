<script>
try{localStorage.setItem("hays-botany-quiz","true")}catch(e){}
</script>
<script src="assets/js/app.js?v=51"></script>
<script>
(function(){
  let launched=false;
  const root=document.getElementById("app");
  if(!root)return;
  const activate=()=>{
    if(launched)return;
    const start=root.querySelector("[data-random-quiz]");
    if(!start)return;
    launched=true;observer.disconnect();start.click();
  };
  const observer=new MutationObserver(activate);
  observer.observe(root,{childList:true,subtree:true});
  activate();
  setTimeout(()=>observer.disconnect(),20000);
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      const localDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if (localDev) {
        navigator.serviceWorker.getRegistrations().then(function(registrations){
          return Promise.all(registrations.map(function(registration){ return registration.unregister(); }));
        }).then(function(){
          if ("caches" in window) {
            return caches.keys().then(function(keys){
              return Promise.all(keys.filter(function(key){ return key.indexOf("hays-botany-") === 0; }).map(function(key){ return caches.delete(key); }));
            });
          }
        }).catch(function(err){
          console.warn("Hays Botany local cache cleanup failed:", err);
        });
      } else if (location.protocol === "https:") {
        navigator.serviceWorker.register("sw.js").catch(function(err){
          console.warn("Hays Botany service worker registration failed:", err);
        });
      }
    });
  }
</script>
