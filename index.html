<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101512">
  <title>Hays Botany Visual Learner</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=5">
</head>
<body>
<header class="topbar">
  <button id="brandHome" class="brand" type="button" aria-label="Hays Botany home">
    <span class="brand-mark" aria-hidden="true">✣</span>
    <span><strong>Hays Botany</strong><small>visual field learner</small></span>
  </button>
  <nav class="main-nav" aria-label="Main navigation">
    <button type="button" data-nav="home">Home</button>
    <button type="button" data-nav="browse">Browse</button>
    <button type="button" data-nav="glossary">Terms</button>
  </nav>
  <div class="header-tools">
    <div class="difficulty" role="group" aria-label="Learning difficulty">
      <button type="button" data-difficulty="simple">Simple</button>
      <button type="button" data-difficulty="terms">Learn terms</button>
      <button type="button" data-difficulty="field">Field botany</button>
    </div>
    <button id="quizToggle" class="quiz-toggle" type="button">Quiz: off</button>
  </div>
</header>

<section class="search-dock" aria-label="Plant search">
  <div class="search-wrap">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input id="globalSearch" autocomplete="off" placeholder="Search a plant, genus, common name, or family…" aria-label="Search plants">
    <button id="clearSearch" class="search-clear" type="button" aria-label="Clear search">×</button>
    <div id="searchResults" class="search-results" hidden></div>
  </div>
</section>

<main id="app" class="app-shell" tabindex="-1">
  <section class="loading-card">
    <strong>Loading the visual learner…</strong>
    <span>Building your local plant library.</span>
  </section>
</main>

<div id="modalRoot"></div>
<script src="assets/js/app.js?v=5"></script>
</body>
</html>
