<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Annular stipule scar on a Platanus twig</title>
<desc id="desc">Teaching diagram showing a sycamore twig with a ring-like stipule scar encircling the twig at a node.</desc>
<rect width="900" height="540" fill="#101713"/>
<path d="M90 300 C260 282 480 294 810 260" fill="none" stroke="#9a7659" stroke-width="86" stroke-linecap="round"/>
<path d="M405 272 C407 313 410 335 414 353" fill="none" stroke="#c7a47f" stroke-width="12"/>
<ellipse cx="409" cy="286" rx="47" ry="18" fill="none" stroke="#e9d29d" stroke-width="9"/>
<path d="M445 250 C470 216 489 200 512 189" fill="none" stroke="#8d6045" stroke-width="28" stroke-linecap="round"/>
<path d="M506 192 l25 -22 l-7 33 z" fill="#6f402d"/>
<line x1="409" y1="285" x2="620" y2="110" stroke="#dceecf" stroke-width="6"/>
<polygon points="620,110 596,116 609,132" fill="#dceecf"/>
<rect x="595" y="62" width="250" height="70" rx="14" fill="#1c2a22" stroke="#78977d" stroke-width="3"/>
<text x="720" y="91" text-anchor="middle" fill="#f3f7f1" font-family="sans-serif" font-size="26" font-weight="700">ANNULAR STIPULE SCAR</text>
<text x="720" y="117" text-anchor="middle" fill="#c8d6ca" font-family="sans-serif" font-size="19">ring encircles the twig</text>
<text x="100" y="430" fill="#c8d6ca" font-family="sans-serif" font-size="22">Platanus / sycamore twig — simplified learner diagram</text>
</svg>