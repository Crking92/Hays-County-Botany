<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Enantiostyly left-styled and right-styled flowers</title>
<desc id="desc">Teaching diagram comparing mirror-image flowers with the style deflected to opposite sides and pollinating stamens reciprocally positioned.</desc>
<rect width="900" height="560" fill="#101713"/>
<text x="450" y="48" text-anchor="middle" fill="#f3f7f1" font-family="sans-serif" font-size="30" font-weight="700">ENANTIOSTYLY = MIRROR-IMAGE FLOWERS</text>
<g transform="translate(225 285)">
  <circle r="125" fill="#ddd3ea" opacity=".92"/>
  <circle r="50" fill="#7a5b8e" opacity=".45"/>
  <path d="M0 20 C-28 36 -66 72 -97 128" fill="none" stroke="#e7d56d" stroke-width="12" stroke-linecap="round"/>
  <circle cx="-98" cy="130" r="12" fill="#e7d56d"/>
  <path d="M5 12 C40 30 69 68 91 120" fill="none" stroke="#e88a91" stroke-width="13" stroke-linecap="round"/>
  <path d="M91 120 l-15 -4 l11 15 l12 -12 z" fill="#e88a91"/>
  <path d="M-15 15 C10 38 30 68 37 98" fill="none" stroke="#7fb2d4" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="38" cy="103" rx="19" ry="9" fill="#7fb2d4"/>
</g>
<g transform="translate(675 285)">
  <circle r="125" fill="#ddd3ea" opacity=".92"/>
  <circle r="50" fill="#7a5b8e" opacity=".45"/>
  <path d="M0 20 C28 36 66 72 97 128" fill="none" stroke="#e7d56d" stroke-width="12" stroke-linecap="round"/>
  <circle cx="98" cy="130" r="12" fill="#e7d56d"/>
  <path d="M-5 12 C-40 30 -69 68 -91 120" fill="none" stroke="#e88a91" stroke-width="13" stroke-linecap="round"/>
  <path d="M-91 120 l15 -4 l-11 15 l-12 -12 z" fill="#e88a91"/>
  <path d="M15 15 C-10 38 -30 68 -37 98" fill="none" stroke="#7fb2d4" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="-38" cy="103" rx="19" ry="9" fill="#7fb2d4"/>
</g>
<text x="225" y="475" text-anchor="middle" fill="#f3f7f1" font-family="sans-serif" font-size="25" font-weight="700">STYLE DEFLECTED RIGHT</text>
<text x="675" y="475" text-anchor="middle" fill="#f3f7f1" font-family="sans-serif" font-size="25" font-weight="700">STYLE DEFLECTED LEFT</text>
<text x="450" y="525" text-anchor="middle" fill="#c8d6ca" font-family="sans-serif" font-size="21">pink = style · blue/yellow = stamens · positions switch sides</text>
</svg>