name: Ammannia Species-Photo First Fill

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ammannia-species-first-photo.yml

permissions:
  contents: write

concurrency:
  group: ammannia-species-first-photo
  cancel-in-progress: false

jobs:
  first-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Verify exact species image license and species-only scope
        run: |
          python scripts/gbif_exact_zero_photo_recovery.py \
            --focus ammannia-auriculata \
            --permit-genus-lesson-only-claim \
            --report reports/ammannia-species-first-photo.json
      - name: Confirm image and full source provenance
        run: |
          python - <<'PY'
          import json,pathlib
          from PIL import Image
          p=pathlib.Path("reports/ammannia-species-first-photo.json")
          r=json.loads(p.read_text())
          for row in r["installed"]:
              assert row["id"]=="ammannia-auriculata"
              fp=pathlib.Path(row["photo_file"])
              assert fp.exists()
              with Image.open(fp) as i:i.verify()
              sp=json.loads((fp.parent.parent/"species.json").read_text())
              assert sp["id"]=="ammannia-auriculata"
              assert any(x.get("source_determination")==row["source_taxon"] for x in sp["images"])
              assert row["license"].startswith("CC")
              print("VERIFIED",row["id"],row["license"],row["source_page"])
          print("Installed",len(r["installed"]))
          PY
      - name: Commit only species photos, leave active genus lesson unchanged
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Lythraceae/Ammannia/ammannia-auriculata/ reports/ammannia-species-first-photo.json reports/photo-fast-fill-zero-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install licensed Ammannia species photo without touching genus lesson [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
