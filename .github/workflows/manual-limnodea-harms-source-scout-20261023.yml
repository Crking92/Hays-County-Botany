name: Scout original Central Texas Ozarkgrass source photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-limnodea-harms-source-scout-20261023.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'requests>=2.31,<3'
          python -m py_compile scripts/scout_limnodea_harms_sources_20261023.py
          python scripts/scout_limnodea_harms_sources_20261023.py
      - name: Commit verified source links and original filename evidence only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/limnodea-harms-original-source-discovery-20261023.json
          git commit -m 'Record original Bob Harms Ozarkgrass source page and JPEG mapping [skip ci]'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
