name: Archive two pixel-reviewed CC BY Ozarkgrass anatomy originals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-limnodea-two-licensed-detail-photos-20261023.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-limnodea-two-licensed-detail-20261023
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify code and image reader
        run: |
          python -m pip install 'Pillow>=10,<12' 'requests>=2.31,<3'
          python -m py_compile scripts/archive_limnodea_two_licensed_detail_photos_20261023.py
      - name: Download actual source photo originals, check legal metadata
        run: python scripts/archive_limnodea_two_licensed_detail_photos_20261023.py
      - name: Verify exact science, original license, bytes and website rights gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys,hashlib,json
          from PIL import Image
          sys.path.insert(0,'scripts')
          from build_public_pages_snapshot import rights
          from public_photo_rights_preflight import photo_rights
          s=json.loads(Path('content/taxa/Poaceae/Limnodea/limnodea-arkansana/species.json').read_text())
          g=json.loads(Path('content/taxa/Poaceae/Limnodea/genus.json').read_text())
          r=json.loads(Path('reports/limnodea-two-ccby-collar-spikelet-originals-20261023.json').read_text())
          assert r['installed_new']==2
          assert s['id']=='limnodea-arkansana'
          assert s['curation_status']['photo_files_present']==9
          assert len(s['images'])==9
          assert len(s['visual_comparison']['items'])==12 and len(g['visual_comparison']['items'])==12
          assert s['curation_status']['taxonomy_reviewed']==False
          assert 'FIELD_READY_PHOTO_GAPS' in s['field_id_finish_pass']['stage']
          for q in r['photos']:
              file=Path(q['physical_path'])
              assert file.is_file() and file.stat().st_size>10000
              assert hashlib.sha256(file.read_bytes()).hexdigest()==q['archived_sha256']
              with Image.open(file) as i:
                  assert i.format=='JPEG' and i.mode=='RGB' and min(i.size)>=650 and not i.getexif().get(34853)
                  i.verify()
              record=next(x for x in s['images'] if x.get('file')=='images/'+file.name)
              assert record['license']=='CC BY 4.0'
              assert rights(record,True)[0] and photo_rights(record,True) is None
              assert len([x for x in s['visual_comparison']['items'] if x.get('image_url')==str(file)])==1
          print('PASS 2 actual CC BY details, source photo ID/creator, pixels, public licenses and accurate photo gaps',flush=True)
          PY
      - name: Commit canonical species and genus records plus two actual verified original JPEGs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Limnodea/
          git add reports/limnodea-two-ccby-collar-spikelet-originals-20261023.json
          git add workflow/field-id-publication/2026-10-23-limnodea-two-ccby-closeups.json
          if git diff --cached --quiet; then echo "Already installed, no duplicate"; exit 0; fi
          git commit -m 'Archive two true licensed CC BY Ozarkgrass detail photos without falsely certifying 0.5mm lemma teeth [skip ci]'
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
