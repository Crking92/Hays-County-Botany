name: Archive cane bluestem true bearded Texas nodes with mm ruler and anatomy
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-cane-brushycreek-nodes-real-anatomy-20261027.yml
      - scripts/archive_cane_bluestem_brushy_anatomy_20261027.py
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: cane-brushy-real-node-anatomy-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            content/taxa/Poaceae/Bothriochloa
            reports
            workflow/field-id-publication
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Download actual research-grade cane node and sheath photos and store rights metadata
        run: |
          python -m py_compile scripts/archive_cane_bluestem_brushy_anatomy_20261027.py
          python scripts/archive_cane_bluestem_brushy_anatomy_20261027.py
      - name: Validate real photo file integrity, anatomical arrows and public rights
        run: |
          python - <<'PY'
          import sys,hashlib,json
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,'scripts')
          from build_public_pages_snapshot import rights
          from public_photo_rights_preflight import photo_rights
          root=Path('content/taxa/Poaceae/Bothriochloa/bothriochloa-barbinodis')
          d=json.loads((root/'species.json').read_text())
          rep=json.loads(Path('reports/cane-brushycreek-real-anatomy-20261027.json').read_text())
          assert len(rep['items'])==6 and all(z['status']=='PHYSICALLY_ARCHIVED' for z in rep['items'])
          assert d['lane5_six_role_assessment_20261027']['after']['roles_total']==3.5
          assert d['curation_status']['visual_finish'].startswith('FIELD_READY_PHOTO_GAPS')
          assert not d['cane_brushycreek_anatomy_20261027']['opened_inner_ligule']
          for entry in rep['items']:
            f=Path(entry['file'])
            assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==entry['sha256']
            with Image.open(f) as im:
              assert im.format=='JPEG' and min(im.size)>=750 and not im.getexif()
              im.verify()
            rec=next(x for x in d['images'] if x.get('source_photo_id')==entry['pid'])
            panel=next(x for x in d['visual_comparison']['items'] if x.get('source_photo_id')==entry['pid'])
            assert 'Arnan Pawawongsak'==rec['creator']
            assert len(panel['markers'])==entry['arrows']
            assert 'CC BY-NC' in panel['license'] and '/photos/' in panel['source_page']
            for obj in (rec,panel):
              assert rights(obj,True)[0],(entry['pid'],rights(obj,True))
              assert photo_rights(obj,True) is None,(entry['pid'],photo_rights(obj,True))
            for m in panel['markers']:
              assert m['label'] and all(0<=m[k]<=100 for k in ('label_x','label_y','target_x','target_y'))
          print('CANE ORIGINAL PHOTO RIGHTS + IMAGE INTEGRITY + REAL ANATOMY QA PASS')
          PY
      - name: Commit verified authentic Texas cane photos and one publication marker
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Bothriochloa/bothriochloa-barbinodis/
          git add reports/cane-brushycreek-real-anatomy-20261027.json
          git add workflow/field-id-publication/2026-10-27-cane-brushy-creek-anatomy.json
          if git diff --cached --quiet;then echo 'NO_CHANGE';exit 0;fi
          git commit -m 'Archive 6 authentic cane bluestem TX anatomy photos with measured true bearded nodes'
          for n in 1 2 3 4 5 6;do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            sleep 4
          done
          exit 1
