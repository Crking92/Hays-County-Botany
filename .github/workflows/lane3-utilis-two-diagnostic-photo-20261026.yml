name: Lane 3 publish exact CC0 aparejo collar and flowering photographs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lane3-utilis-two-diagnostic-photo-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-utilis-two-diagnostics-20261026
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refresh latest main state before one-species write
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Independently verify source hashes and physically install exact-source CC0 JPEGs
        run: python scripts/lane3_install_utilis_two_diagnostics_20261026.py
      - name: Confirm byte integrity, metadata, rights and gallery
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          r=json.loads(pathlib.Path('reports/lane3-utilis-two-diagnostics-installed-20261026.json').read_text())
          card=json.loads(pathlib.Path('content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/species.json').read_text())
          assert r['status']=='PHYSICALLY_ARCHIVED_TWO_CC0_DIAGNOSTIC_IMAGES'
          assert len(r['files'])==2
          assert card['id']=='muhlenbergia-utilis' and len(card['images'])==8
          assert len(card['visual_comparison']['items'])==8
          assert card['visual_comparison']['items'][-1]['scientific_name']=='Muhlenbergia schreberi'
          for item in r['files']:
            p=pathlib.Path(item['path'])
            assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==item['saved_sha256']
            with Image.open(p) as i:
              assert i.format=='JPEG' and not i.getexif().get(34853)
              i.verify()
            assert item['license']=='CC0 1.0'
            assert any(x.get('image_url')==str(p) and isinstance(x.get('markers', []),list) for x in card['visual_comparison']['items'])
          assert card['curation_status']['visual_finish'].startswith('FIELD_READY_PHOTO_GAPS')
          print('PASS original exact-photo CC0, local bytes, EXIF/GPS, gallery links, preserved prior pixel-reviewed arrows, existing comparison and science holds')
          PY
      - name: Commit only the source-backed species and new images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-utilis-two-diagnostics-installed-20261026.json content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Lane 3 archive two CC0 aparejo collar and flowering image originals"
          succeeded=0
          for attempt in 1 2 3 4 5 6 7; do
            git pull --rebase origin main
            if git push origin HEAD:main; then succeeded=1; break; fi
            sleep 4
          done
          test "$succeeded" = "1"
