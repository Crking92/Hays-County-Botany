name: Lane 1 kleingrass varietal collar ligule spikelet archive
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lane1-kleingrass-anatomy-archive.yml'
      - 'scripts/archive_lane1_kleingrass_anatomy.py'
permissions:
  contents: write
concurrency:
  group: lane1-kleingrass-source-variety
  cancel-in-progress: false
jobs:
  archive-makarikariense-morphology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - title: 'File:Panicum coloratum var makarikariense collar1 NWP - Flickr - Macleay Grass Man.jpg'
            slug: 'collar'
          - title: 'File:Panicum coloratum var makarikariense ligule2 NWP - Flickr - Macleay Grass Man.jpg'
            slug: 'ligule'
          - title: 'File:Panicum coloratum var makarikariense spikelets1 NWP - Flickr - Macleay Grass Man.jpg'
            slug: 'spikelets'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Verify Commons license and produce metadata-stripped JPEG
        env:
          TITLE: ${{ matrix.title }}
        run: |
          python scripts/commons_photo_review_import.py --file-title "$TITLE" \
            --taxon 'Panicum coloratum' --output review_photo --max-edge 2400
      - name: Archive exact licensed variety-specific image and add species gallery panel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TITLE: ${{ matrix.title }}
        run: python scripts/archive_lane1_kleingrass_anatomy.py
      - name: Save source license and checksum evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane1-kleingrass-${{ matrix.slug }}-evidence
          path: review_photo/evidence.json
          if-no-files-found: ignore
          retention-days: 30
