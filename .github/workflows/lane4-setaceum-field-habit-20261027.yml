name: Lane4 real thin paspalum field habit photograph
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_setaceum_field_habit_20261027.py
      - .github/workflows/lane4-setaceum-field-habit-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-setaceum-habit-photo-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Download, EXIF strip and verify one licensed species-specific field-growing plant
        run: python scripts/lane4_archive_setaceum_field_habit_20261027.py
      - name: Commit single source-validated photo and correct gallery panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Paspalum/paspalum-setaceum/
          if ! git diff --cached --quiet; then
            git commit -m "Archive exact CC BY thin paspalum field-growing complete plant photograph"
            pushed=0
            for try in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then pushed=1; break; fi
              echo "Another photo lane pushed; safe rebase retry $try"
              sleep 3
            done
            test "$pushed" = 1
          fi
