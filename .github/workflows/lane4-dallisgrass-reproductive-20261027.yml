name: Lane 4 dallisgrass licensed reproductive photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_dallisgrass_reproductive_20261027.py
      - .github/workflows/lane4-dallisgrass-reproductive-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-dallisgrass-reproductive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Archive individually licensed exact-species photographs
        run: python scripts/lane4_archive_dallisgrass_reproductive_20261027.py
      - name: Commit new image files and real gallery records only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Paspalum/paspalum-dilatatum/
          if ! git diff --cached --quiet; then
            git commit -m "Archive licensed actual dallisgrass spikelet/glume macro photographs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
