name: Lane 2 finish both Aristida using older licensed Texas anatomical photos
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane2-aristida-historic-cc-original-root-collar-scout-20261027.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-two-threeawns-historical-diagnostic-scout-20261027
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane2_aristida_deep_licensed_collar_roots_scout_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Audit CC-only actual roots and ligules before publishing anything
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lane2_aristida_deep_licensed_collar_roots_scout_20261027.py
