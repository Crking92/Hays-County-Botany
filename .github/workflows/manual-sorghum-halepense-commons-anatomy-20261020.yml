name: Install Johnsongrass Commons Rhizome and Ligule Photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-sorghum-halepense-commons-anatomy-20261020.yml"
      - "scripts/manual_sorghum_halepense_commons_anatomy_20261020.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: one-johnsongrass-commons-anatomy-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests
      - name: Read latest repository state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Install source-licensed, visually reviewed Johnsongrass structure photos
        run: python scripts/manual_sorghum_halepense_commons_anatomy_20261020.py
      - name: Validate source, rights, files and historical exclusions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base=Path("content/taxa/Poaceae/Sorghum/sorghum-halepense")
          j=json.loads((base/"species.json").read_text())
          assert j["scientific_name"]=="Sorghum halepense"
          assert j["project_inclusion"]["target_zone_status"]=="INTRODUCED_NOT_NATIVE"
          assert j["project_inclusion"]["native_metrics_excluded"] is True
          assert len(j["images"])==10
          assert j["field_id_finalization"]["stage"]=="PROVISIONAL"
          assert j["curation_status"]["finished_field_id_pass"]=="PASS_IN_PROGRESS"
          assert "inat-154485533.jpg" not in [x["file"] for x in j["images"]]
          for f in j["images"]:
            path=base/f["file"]
            assert f["license"] in ("CC BY","CC BY-SA","CC0")
            assert f["creator"] and f["source_page"]
            assert path.is_file() and path.stat().st_size>19000
            with Image.open(path) as photo:
              photo.verify()
          byfile={x["file"]:x for x in j["images"]}
          for name,version in (
            ("commons-moadeeb-johnsongrass-rhizome.jpg","4.0"),
            ("commons-matt-lavin-johnsongrass-ligule.jpg","2.0")
          ):
            f=byfile["images/"+name]
            assert f["license"]=="CC BY-SA" and version in f["license_url"]
            assert f["original_image_sha256"] and "none" in f["anatomy_arrows"]
          assert len(j["unresolved_photo_references"])>=1
          print("PASS: 10 physical CC reusable credited images; real anatomy cautions; rejected image still excluded")
          PY
      - name: Commit the two pictures, citation metadata and report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Sorghum/sorghum-halepense/ reports/sorghum-halepense-commons-anatomy-20261020.json
          if git diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          fi
          git commit -m "Publish two credited Commons Johnsongrass rhizome and ligule teaching photos"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Published new 10-photo Johnsongrass gallery"
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Dispatch GitHub Pages publication for newly verified images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Requested GitHub Pages publish of the verified 10-photo Johnsongrass gallery."

# One-time 2026-10-20 release retry after repairing staged WebP metadata handling.

# One-time final 2026-10-20 release retry: hide unreadable staged Ipomoea plate only.
