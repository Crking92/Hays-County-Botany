name: Install Eastern Black Nightshade Source-Verified First Card
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-solanum-emulans-firstcard-install-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solanum-emulans-firstcard-canonical-20261020
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Install human-reviewed exact-species source photographs and anatomy fields
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json,csv,hashlib
          from pathlib import Path
          from PIL import Image,ImageOps
          root=Path("content/taxa/Solanaceae/Solanum/solanum-emulans")
          src=Path("workflow/photo-library/candidates/solanum-emulans-20261020")
          manifest_path=Path("data/manifest.json")
          genus_path=Path("content/taxa/Solanaceae/Solanum/genus.json")
          report=json.loads(Path("reports/solanum-emulans-photo-staging-20261020.json").read_text())
          staged={x["name"]:x for x in report["images"]}
          assert set(["mason-heberling","alex-abair"]).issubset(staged)
          if (root/"species.json").exists():
            print("SKIP existing canonical species rather than overwrite concurrent worker")
            raise SystemExit(0)
          m=json.loads(manifest_path.read_text())
          assert not any(x["id"]=="solanum-emulans" for x in m["species"])
          g=json.loads(genus_path.read_text())
          cc="https://creativecommons.org/licenses/by/4.0/"
          records=[];panels=[]
          # Photo 1: source pixels reviewed: habit/ovate leaves, several tiny white flowers.
          views=[
           dict(name="alex-abair",dest="01-plant-habit.jpg",role="Whole unarmed green plant with simple ovate alternate leaves and several tiny white flowers",
             markers=[dict(label="Ovate green leaf",label_x=5,label_y=47,target_x=36,target_y=36),
                      dict(label="Tiny white flower",label_x=6,label_y=70,target_x=32,target_y=60)],
             caption="Alex Abair's documented Virginia field photograph shows the size of this branching herb among grasses. The visibly perforated leaves have herbivore damage; holes are not a botanical identification character."),
           dict(name="mason-heberling",dest="02-flower-immature-fruit.jpg",role="Tiny whitish flower, yellow anthers, two green buds and a GREEN immature berry",
             markers=[dict(label="White corolla lobe",label_x=1,label_y=31,target_x=40,target_y=40),
                      dict(label="Yellow anthers",label_x=1,label_y=73,target_x=39,target_y=49),
                      dict(label="Immature GREEN berry",label_x=69,label_y=13,target_x=53,target_y=18),
                      dict(label="Unopened flower bud",label_x=70,label_y=53,target_x=61,target_y=35)],
             caption="Mason Heberling's Pennsylvania photo. The yellow structure hanging below the drooping pale corolla is an ANTHER. The round fruit at upper center is still GREEN and IMMATURE, so do NOT use its calyx to confirm the ripe-fruit split from American black nightshade."),
           dict(name="mason-heberling",dest="03-flower-closeup-crop.jpg",role="Enlarged same-source flower macro: white corolla lobes and short yellow anthers",
             crop=(500,320,1200,1000),
             markers=[dict(label="White corolla lobe",label_x=61,label_y=9,target_x=35,target_y=33),
                      dict(label="Yellow anther cluster",label_x=7,label_y=88,target_x=29,target_y=51)],
             caption="Cropped from the SAME Mason Heberling photo as previous panel—this is a teaching close-up, NOT an independently documented plant. Anther LENGTH (~1–1.5 mm) is from the published species treatment and cannot be measured from this photo without a scale.")
          ]
          for i,v in enumerate(views):
            srcmeta=staged[v["name"]]
            assert srcmeta["license"]=="CC BY 4.0" and srcmeta["creator"]
            with Image.open(Path(srcmeta["file"])) as original:
              pic=original.convert("RGB")
              if "crop" in v:pic=pic.crop(v["crop"])
              dst=root/"images"/v["dest"];dst.parent.mkdir(parents=True,exist_ok=True)
              pic.save(dst,"JPEG",quality=87,optimize=True,exif=b"")
            with Image.open(dst) as check:check.verify()
            digest=hashlib.sha256(dst.read_bytes()).hexdigest()
            rec=dict(file="images/"+v["dest"],role=v["role"],creator=srcmeta["creator"],
              license="CC BY 4.0",license_url=cc,source_page=srcmeta["source_page"],
              source_observation=srcmeta["observation"],media_source_url=srcmeta["source_image_url"],
              source_geography=srcmeta["source_geography"],source_taxon="Solanum emulans",
              image_dimensions=[pic.width,pic.height],sha256=digest,visual_role_reviewed=True,
              public_reuse="yes",study_use="yes",
              modifications="Published derivative crops are noted and originals source-linked. EXIF removed; arrow SVG non-destructive." if "crop" in v else "Resized/JPEG converted and stripped EXIF; SVG arrows separate.")
            records.append(rec)
            panels.append(dict(label=str(i+1)+" — "+v["role"],
              scientific_name="Solanum emulans",
              image_url="content/taxa/Solanaceae/Solanum/solanum-emulans/"+rec["file"],
              image_fit="contain",image_role=v["role"],creator=rec["creator"],
              license="CC BY 4.0",license_url=cc,source_page=rec["source_page"],
              caption=v["caption"]+" Source "+rec["creator"]+"; CC BY 4.0; original source linked.",
              why_it_matters="Photograph only supports named visibly marked structures. Green fruit and white petals alone do not settle the look-alike ID.",
              markers=v["markers"]))
          j=dict(
            id="solanum-emulans",entry_type="provisional_species",family="Solanaceae",genus="Solanum",species="emulans",
            scientific_name="Solanum emulans",authority="Raf.",common_name="Eastern black nightshade",
            look_here_first="LOOK HERE FIRST · Small UNARMED black-nightshade herb with alternate ovate leaves, tiny white 5-lobed flowers and SHORT yellow anthers. The truly decisive field comparison is with MATURE fruit: S. emulans has GREEN CALYX LOBES APPRESSED/SPREADING against berry base and a fruiting PEDICEL that commonly drops with the berry; S. americanum has strongly REFLEXED calyx lobes and its fruit pedicel generally remains on plant. Photo 2 shows only an IMMATURE GREEN berry—do not overidentify from that.",
            county_occurrences_target_zone=[],target_zone_count=0,native_target_zone_calculated=False,native_metrics_excluded=True,
            project_inclusion=dict(target_zone_status="PROVISIONAL",range_basis="Accepted species is documented from Texas by FNA/POWO; county verification paused; user explicitly requested encounter-based look-alike learner.",range_guardrail="Not a verified Hays County native/occurrence, do not feed county-specific scores."),
            learner_role="PROVISIONAL_LEARNER",
            morphology_keys=dict(
              family_pattern="Solanaceae: fused 5-lobed corolla, five anthers, berry fruit; this unarmed black-nightshade complex has simple alternate leaves, unlike prickly buffalobur.",
              best_field_traits=[
                 "Unarmed green annual or short-lived perennial; simple alternate ovate leaves, entire to shallowly toothed or wavy.",
                 "Tiny white five-lobed rotate/star corollas, usually small unbranched flower clusters.",
                 "Yellow short anthers typically ~1.0–1.5 mm in FNA, with relatively LONGER free filaments ~0.6–1.0 mm than S. americanum.",
                 "Mature berries globose, ca. 5–10 mm, dull or only slightly glossy purplish-black; immature berries green are NOT diagnostic.",
                 "Fruiting calyx has small lobes APPRESSED or SPREADING against berry rather than strongly curling back.",
                 "Fruit-bearing pedicels often reflexed/recurved, thickened at the apex; the mature berry normally falls WITH its stalk.",
                 "Often 6–9 sclerotic granules (hard stone cells) within berry; specialist character requiring safe specimen handling, NOT tasting."
              ],
              habit="Small unarmed green branching herb common in disturbed places. Absence of prickles alone rules out buffalobur but not similar Morelloid black nightshades.",
              leaf="Simple alternate ovate to elliptic blades, edges entire, wavy or shallowly toothed. Leaf undersides may be purple tinged but color is variable and not reliable alone.",
              flower="Small white five-part star corollas, five little yellow anthers (~1.0–1.5 mm according to Flora of North America) with free filaments about 0.6–1.0 mm. Visible anther and filament measurements need macro scale; non-diagnostic wilted flower photos only show shape and placement.",
              fruit="Dark purple-black, commonly dull or only slightly glossy when ripe, globose, ~5–10 mm. GREEN lobes of fruiting calyx remain APPRESSED/SPREADING, not strongly reflexed. Fruit stalk often reflexed/curved and may fall WITH mature berry; pedicel apex thickens.",
              habitat="Moist woods, stream banks, gardens, roadsides and disturbed areas. Texas reported by Flora of North America, but Hays county range/occurrence has NOT been audited.",
              management="Treat as a field ID subject only; do not recommend eating leaves or fruits based on photographs because black-nightshade confusion and glycoalkaloids present risk.",
              field_terms=dict(
                anther="Pollen-producing yellow tip of a stamen; look at free filament length below it, not corolla size alone.",
                filament="Slender stalk of a stamen below the anther. S. emulans filaments are relatively longer than those of S. americanum.",
                calyx="Five green sepals under the flower or fruit; APPRESSED means held against berry; REFLEXED means bent back away from it.",
                pedicel="Single flower/fruit stalk; dropping with the berry differs from fruit detaching alone.",
                stone_cells="Hard internal non-seed sclerotic granules, often 6–9 in S. emulans; advanced taxonomic character, not an eating recommendation."),
              crew_field_sequence=[
                "1 · Find UNARMED leafy plant with simple alternate ovate leaves; rule out prickly Solanum.",
                "2 · Look at tiny white flowers: photograph the YELLOW ANTHERS and especially their free filaments with a millimeter scale.",
                "3 · IMMATURE GREEN fruit cannot confirm species; return later for a mature berry and its green base.",
                "4 · MATURE FRUIT: side macro showing the five small green calyx lobes APPRESSED/SPREADING on berry base, not bent backwards.",
                "5 · PEDICEL: photograph intact ripe clusters and fallen berry WITH/without attached pedicel. S. emulans typically drops WITH stalk, S. americanum leaves stalk behind.",
                "6 · Compare: longer flower anthers (>~2 mm) point toward S. nigrescens/interius; short anthers plus strongly BACKWARD ripe calyx point toward S. americanum.",
                "7 · Without measured flower and mature fruit calyx, record Solanum morelloid group instead of guessing exact species."
              ],
              comparison_training="Never split S. emulans and S. americanum from black berry or small white flower alone; inspect short anthers/filaments + mature calyx orientation + fruiting pedicels."
            ),
            comparisons=dict(field_matrix=[
              dict(taxon="Solanum emulans · EASTERN BLACK NIGHTSHADE",flower="Small white star; short anthers ~1–1.5 mm, relatively longer free filaments ~0.6–1 mm",berries="Dull or somewhat shiny purple-black, about 5–10 mm",calyx="APPRESSED to SPREADING under ripe fruit",pedicels="Typically reflexed/recurved, thickened apex; drops WITH ripe berry",quick_rule="SHORT anthers + appressed fruit calyx + fruit drops with stalk."),
              dict(taxon="Solanum americanum · AMERICAN BLACK NIGHTSHADE",flower="Very short plump yellow anthers; free filaments shorter",berries="Typically SHINY glossy purple-black",calyx="STRONGLY REFLEXED away from ripe berry",pedicels="Generally erect/spreading, often remain AFTER ripe fruit falls",quick_rule="Shiny black + calyx turned back + fruit leaves stalk."),
              dict(taxon="Solanum nigrescens · DIVINE NIGHTSHADE",flower="LONGER yellow anthers commonly ~1.8–2.5 mm",berries="Often dull purplish black",calyx="APPRESSED/spreading (shared with emulans)",pedicels="Usually spreading/deflexed",quick_rule="Anther length distinguishes when calyx overlaps."),
              dict(taxon="Solanum interius · CENTRAL PLAINS BLACK NIGHTSHADE",flower="Medium-long anthers ~1.8–2.5 mm",berries="Usually LARGER than emulans, often ~10–14 mm",calyx="Longer, often rounded-tip lobes",pedicels="Compare berry and cluster structure",quick_rule="Longer anthers and larger berries; possibly closer Great Plains overlap."),
              dict(taxon="Solanum nigrum · EUROPEAN BLACK NIGHTSHADE",flower="Often somewhat longer anthers",berries="Dark, often dull",calyx="Variable",pedicels="Compare internal fruits, seed and stone cells",quick_rule="Introduced comparison; avoid ID from black berry alone.")
             ],not_reliable_alone=[
                 "White star flower and alternate leaves: all close black nightshades share them.",
                 "Small anthers: S. americanum also has small anthers.",
                 "One GREEN IMMATURE fruit or its calyx: does not prove mature calyx pattern.",
                 "Dull versus glossy berry without lighting control: imperfect; combine with calyx, pedicels and flower.",
                 "Historical name S. ptychanthum was applied to S. emulans by older regional literature, but its type now belongs to S. americanum; do not silently transfer photos by that name without vouchers."
              ]),
            images=records,
            visual_comparison=dict(instance_id="solanum-emulans-20261020-fieldid",title="Eastern black nightshade — short ANTHERS, longer FILAMENTS, fruit CALYX stays CLOSE",
              subtitle="Three exact-species study views from two photographers (one close-up is a crop of another photo). Separate comparison photos are NOT S. emulans. Ripe fruit macro remains missing and must not be fabricated.",
              memory_rule="SHORT anthers + calyx APPRESSED on fully ripe berry + ripe fruit may fall with its pedicel. Do not call it from a green berry.",
              items=panels+[
                dict(label="LOOK-ALIKE — American black nightshade ripe berry",scientific_name="Solanum americanum",image_url="https://upload.wikimedia.org/wikipedia/commons/5/55/Solanum_americanum_fruit6_%2815119198229%29.jpg?utm_campaign=index&utm_content=original&utm_source=commons.wikimedia.org",
                 image_fit="contain",image_role="DIFFERENT SPECIES: small green calyx lobes turned back from mature black berry",
                 creator="Harry Rose",license="CC BY 2.0",license_url="https://creativecommons.org/licenses/by/2.0/",source_page="https://commons.wikimedia.org/wiki/File:Solanum_americanum_fruit6_(15119198229).jpg",
                 caption="THIS IS AMERICAN BLACK NIGHTSHADE, NOT S. emulans. Here calyx lobes under ripe berry curl BACK; for emulans see actual fruit photo before confirming an ID.",
                 why_it_matters="The difference is mature calyx position, not merely black fruit color.",
                 markers=[dict(label="American: lobes bend BACK",label_x=64,label_y=88,target_x=62,target_y=70)]),
                dict(label="LOOK-ALIKE — Divine nightshade with close fruiting calyx",scientific_name="Solanum nigrescens",
                 image_url="content/taxa/Solanaceae/Solanum/solanum-nigrescens/images/06-single-fruit-calyx-fig03c.jpg",
                 image_fit="contain",image_role="DIFFERENT SPECIES: calyx close to ripe berry, like emulans; longer anthers needed to separate",
                 creator="Jorge Manuel Valdez-Carrasco",license="CC BY 4.0",license_url=cc,source_page="https://www.mdpi.com/2223-7747/12/8/1645",
                 caption="THIS IS DIVINE NIGHTSHADE, NOT S. emulans. The calyx can also sit against the fruit, so calyx alone does NOT separate divine from eastern black nightshade. Look at flower anthers.",
                 why_it_matters="Teach that a single close calyx is insufficient when S. nigrescens is possible.",
                 markers=[])
               ],
              overlay_note="Only verified visible structures annotated. Mason field photo has IMMATURE green fruit. Alex field photo shows habit, not fruit confirmation. Future researcher figure 16 needs review before install. Original photographer credits and licenses retained."
            ),
            field_photo_quickcheck=dict(
              recognition="Unarmed green plant, simple ovate alternate leaves, very small white flowers with short anthers; final S. emulans requires ripe berry calyx and pedicel evidence.",
              what_to_photograph=["Whole plant and leaf arrangement", "Open flower macro with millimeter ruler: anther + short/long free filament", "RIPE fruit lateral close-up showing APPRESSED calyx", "Pedicel base and whether fruit falls with stalk", "Leaf underside as optional supporting trait"],
              missing=["Exact-species photographed mature purple-black S. emulans berry with appressed fruit calyx (research Figure 16D blocked in source retrieval).",
                       "True scale-macro comparing anther/filament with S. americanum.",
                       "User iPhone review of newly installed arrows.",
                       "Hays County provenance/range audit remains on HOLD."]),
            curation_status=dict(version="1.0-manual-20261020",taxonomy_reviewed=True,range_reviewed=False,morphology_reviewed=True,lookalikes_reviewed=True,
               user_approved=True,provisional=True,photo_metadata_count=3,photo_files_present=3,field_id_finish_status="PASS_IN_PROGRESS",
               last_field_id_reviewed="2026-10-20",photo_hold="RIPE FRUIT CALYX NOT PHOTOGRAPHED OR INSTALLED"),
            learner_visual_status=dict(status="provisional_learner_ready",mode="manual_one_species_first_pass",image_count=3,
               note="Two genuine CC BY field sources, three presentation views including one documented crop. No fake ripe fruit images; compare-only photos clearly separate species."),
            photo_note="Mason Heberling CC BY 4.0 iNaturalist photo 96687123 and Alex Abair CC BY 4.0 iNaturalist photo 555742252. One macro cropped from Mason image; source and adaptations disclosed. Figure 16 by Michael Nee still only a source candidate.",
            field_id_reference_sources=["https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:819111-1",
               "https://www.efloras.org/florataxon.aspx?flora_id=1&taxon_id=250131502",
               "https://pmc.ncbi.nlm.nih.gov/articles/PMC6554266/"]
           )
          root.mkdir(parents=True,exist_ok=True)
          (root/"species.json").write_text(json.dumps(j,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (root/"SOURCES.txt").write_text("Accepted name S. emulans Raf., Knapp et al. (2019) and FNA.\nActual photos: Mason Heberling CC BY 4.0 (iNat 96687123), Alex Abair CC BY 4.0 (iNat 555742252). One crop is derivative of Mason photograph. Photos NOT from Hays County. All EXIF/GPS stripped.\nHold: no mature emulans berry macro with demonstrably appressed calyx yet. Source Figure 16 M Nee photographic plate, doi:10.3897/phytokeys.123.31738.figure16 awaiting successful authorized retrieval and anatomy/pixel review.\n",encoding="utf-8")
          with (root/"image-sources.csv").open("w",encoding="utf-8",newline="") as out:
            keys=["file","role","creator","license","license_url","source_page","source_observation","media_source_url","sha256","modifications"]
            w=csv.DictWriter(out,fieldnames=keys);w.writeheader()
            for record in records:w.writerow({k:record.get(k,"") for k in keys})
          m["species"].append(dict(id="solanum-emulans",path=str(root/"species.json")))
          m["species"].sort(key=lambda x:x["id"])
          manifest_path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n")
          g["project_scope"]["species_ids"]=sorted(set(g["project_scope"]["species_ids"]+["solanum-emulans"]))
          g["project_scope"]["species_count"]=len(g["project_scope"]["species_ids"])
          g["project_scope"]["admission"]=g["project_scope"].get("admission","")+" Added S. emulans on 2026-10-20 as PROVISIONAL user-directed field look-alike learner; no county-native claim."
          genus_path.write_text(json.dumps(g,ensure_ascii=False,indent=2)+"\n")
          audit=dict(species_id="solanum-emulans",date="2026-10-20",manifest_count=len(m["species"]),photo_views=len(records),independent_source_photos=2,
              photo_files=[dict(path=r["file"],sha256=r["sha256"],source=r["source_page"],creator=r["creator"],license=r["license"]) for r in records],
              arrows=sum(len(x["markers"]) for x in panels),status="PASS_IN_PROGRESS",hold="MATURE_FRUIT_CALYX_MACRO_MISSING",
              native_count_excluded=True,phone_arrow_approval_pending=True)
          p=Path("reports/solanum-emulans-firstcard-20261020.json");p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps(audit,indent=2)+"\n")
          print("INSTALLED",len(records),"views from 2 original photos; manifest",len(m["species"]),"fruit HOLD")
          PY
      - name: Verify physical image bytes and hold integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          base=Path("content/taxa/Solanaceae/Solanum/solanum-emulans")
          j=json.loads((base/"species.json").read_text())
          m=json.loads(Path("data/manifest.json").read_text())
          assert j["id"]=="solanum-emulans" and j["native_metrics_excluded"] is True
          assert j["project_inclusion"]["target_zone_status"]=="PROVISIONAL"
          assert len(j["images"])==3 and len(j["visual_comparison"]["items"])==5
          assert len([x for x in m["species"] if x["id"]=="solanum-emulans"])==1
          assert j["curation_status"]["photo_hold"]=="RIPE FRUIT CALYX NOT PHOTOGRAPHED OR INSTALLED"
          for x in j["images"]:
            f=base/x["file"]
            assert f.stat().st_size>18000 and x["license"]=="CC BY 4.0" and x["creator"]
            with Image.open(f) as im:im.verify()
          print("PASS: 3 rights-cleared JPEGs, no fabricated ripe fruit or county-native label")
          PY
      - name: Commit verified species record and photo manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Solanaceae/Solanum/solanum-emulans/ content/taxa/Solanaceae/Solanum/genus.json data/manifest.json reports/solanum-emulans-firstcard-20261020.json
          git diff --cached --quiet && exit 0
          git commit -m "Install CC BY Solanum emulans crew visual ID with verified arrows and fruit-science HOLD [skip ci]"
          for k in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true;sleep 4
          done
          exit 1
