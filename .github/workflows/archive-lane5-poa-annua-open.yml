name: Lane 5 Poa annua open anatomy photos
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane5_poa_annua_open.py
      - .github/workflows/archive-lane5-poa-annua-open.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane5-poa-annua
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_lane5_poa_annua_open.py
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Poa/poa-annua/ reports/lane5-poa-annua-open-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Poa annua actual leaf tip and ligule photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
