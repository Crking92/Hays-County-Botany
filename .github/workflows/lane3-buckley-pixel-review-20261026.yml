name: Lane 3 Buckley Tridentopsis Rights Verified Full Photo Review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-buckley-pixel-review-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-buckley-fullpixel-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Fetch exact-licensed species original photographs for pixel examination
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python scripts/lane3_buckley_fullpixel_review_20261026.py
      - name: Verify all acquired original pixels and rights declarations
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          from PIL import Image
          p=pathlib.Path('reports/lane3-buckley-fullpixel-review-20261026/report.json')
          report=json.loads(p.read_text())
          assert report['status']=='PHYSICAL_SOURCE_PIXELS_STAGED_IN_REPORTS_ONLY_NO_CANONICAL_GALLERY_CHANGES'
          good=[r for r in report['results'] if r['status']=='PHOTO_SOURCE_RIGHTS_VERIFIED_PIXEL_REVIEW_REQUIRED']
          assert len(good)>=2
          for r in good:
              f=pathlib.Path(r['file'])
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r['sha256']
              assert r['license'] in {'cc0','cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa'}
              assert r['attribution'] and r['photo_page'] and not r['published']
              with Image.open(f) as im:
                  assert im.format=='JPEG' and min(im.size)>=450 and not im.getexif().get(34853)
                  im.verify()
          print('Source verified, downloaded, JPEG/EXIF validated; canonical gallery not yet changed.')
          PY
      - name: Commit non-canonical review sources only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/lane3-buckley-fullpixel-review-20261026/
          git diff --cached --quiet && exit 0
          git commit -m "Lane 3 stage seven exact-licensed Buckley lower-culm and crown originals for pixel review"
          for attempt in 1 2 3 4 5 6 7; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
