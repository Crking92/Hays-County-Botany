name: Publish Hays Botany on GitHub Pages (manual)

# One-repository public GitHub Pages path. All repo source/history become public when owner changes visibility; website snapshot still filters media.
# GitHub Pages must first be enabled at Settings > Pages > GitHub Actions.
# Never rebuild on generic research/photo commits. A narrowly scoped
# manual finished-field-ID marker can publish the current rights-filtered site.
on:
  push:
    branches: [main]
    paths:
      - 'workflow/field-id-publication/*.json'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish publicly now? Unchecked = build and QA report only."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: hays-botany-pages-publication
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify owner has made repository public for publishing
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)"
          test "$visibility" = false || {
            echo "::error::For a free GitHub Pages site, make the repository public in Settings before publishing"
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install published-image conversion tools
        run: python -m pip install 'Pillow>=10,<12'
      - name: Validate beginner reed photos, licenses, scientific cautions and JS syntax
        run: |
          python -m unittest discover -s tests -p 'test_reed_beginner_learner.py' -v
          python -m unittest discover -s tests -p 'test_reed_final_closeout_20261027.py' -v
          python -m unittest discover -s tests -p 'test_kr_source_only_microscopy_20261027.py' -v
          python -m unittest discover -s tests -p 'test_silver_bluestem_photo_finish_20261027.py' -v
          node --check assets/js/app.js
          node --check assets/js/field-id-tiles.js
          node --check assets/js/quiz-tiles.js
          node --check assets/js/reed-quiz.js
          node tests/test_reed_quiz.cjs
      - name: Build rights-filtered educational public learner
        run: python scripts/build_public_pages_snapshot.py --noncommercial
      - name: Optimize website-only JPEG copies
        run: |
          mkdir -p page-quality-audit
          python scripts/optimize_public_photo_copies.py --root dist \
            --threshold-kb 450 --max-edge 2400 --quality 80 \
            --report page-quality-audit/size-report.json
      - name: Check anatomical image pixel quality
        run: |
          python scripts/audit_public_photo_quality.py --source . --site dist \
            --out page-quality-audit --max-preview 16
      - name: Verify size budget and exclude private project records
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- content/ data/ assets/ photo-review.html
          test -s dist/index.html
          test -s dist/field-id.html
          test -s dist/field-id-classic.html
          test -s dist/assets/js/field-id-tiles.js
          test -s dist/assets/css/field-id-tiles.css
          test -s dist/quiz.html
          test -s dist/assets/js/reed-quiz.js
          test -s dist/data/learner-search-index.json
          test -s dist/data/field-id-index.json
          test ! -e dist/photo-review.html
          test -s dist/data/manifest.json
          test -s dist/manifest.webmanifest
          for restricted in workflow reports research-drafts research-queue.json curation-inbox curation-archive .github photo-review.html photo-review-batch-003.html photo-review-batch-005.html; do
            test ! -e "dist/$restricted" || { echo "::error::Private project content in site: $restricted"; exit 1; }
          done
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("dist")
          files=[p for p in root.rglob("*") if p.is_file()]
          size=sum(p.stat().st_size for p in files)
          report=json.loads(Path("page-quality-audit/quality-report.json").read_text())
          assert not report["hard_errors"], "Photo QA detected errors"
          print(f"Site: {len(files)} files, {size/1e6:.1f} MB")
          print(f"Optimized photo QA coverage: {report['changed_photo_count']}")
          if size>850_000_000:
            raise SystemExit("850 MB site safety budget exceeded")
          PY
      - name: Save private visual quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-image-quality-report
          path: page-quality-audit/
          retention-days: 14
          if-no-files-found: warn
      - name: Validate final image-rights filtered website before publication
        run: python scripts/public_photo_rights_preflight.py --site dist --noncommercial
      - name: Configure GitHub Pages
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: actions/configure-pages@v5
      - name: Package only public assets
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy-public-pages:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy public static learner
        id: deployment
        uses: actions/deploy-pages@v4
