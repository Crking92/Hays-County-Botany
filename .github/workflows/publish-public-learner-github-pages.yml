name: Publish Hays Botany on GitHub Pages (manual)

# PRIVATE source repository, PUBLIC whitelisted web assets.
# GitHub Pages must first be enabled at Settings > Pages > GitHub Actions.
# Never rebuild on research/photo commits. Manual only.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish publicly now? Unchecked = build and QA report only."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: hays-botany-pages-publication
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check repository is still private
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)"
          test "$visibility" = true || {
            echo "::error::Source repository is not private"
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install published-image conversion tools
        run: python -m pip install 'Pillow>=10,<12'
      - name: Stage only public learner assets
        run: bash scripts/build_cloudflare_site.sh
      - name: Optimize website-only JPEG copies
        run: |
          mkdir -p page-quality-audit
          python scripts/optimize_public_photo_copies.py --root dist \
            --threshold-kb 750 --max-edge 2800 --quality 86 \
            --report page-quality-audit/size-report.json
      - name: Check anatomical image pixel quality
        run: |
          python scripts/audit_public_photo_quality.py --source . --site dist \
            --out page-quality-audit --max-preview 16
      - name: Verify size budget and exclude private project records
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- content/ data/ assets/ photo-review.html
          test -s dist/index.html
          test -s dist/photo-review.html
          test -s dist/data/manifest.json
          test -s dist/manifest.webmanifest
          for restricted in workflow reports research-drafts research-queue.json curation-inbox curation-archive .github photo-review-batch-003.html photo-review-batch-005.html; do
            test ! -e "dist/$restricted" || { echo "::error::Private project content in site: $restricted"; exit 1; }
          done
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("dist")
          files=[p for p in root.rglob("*") if p.is_file()]
          size=sum(p.stat().st_size for p in files)
          report=json.loads(Path("page-quality-audit/quality-report.json").read_text())
          assert not report["hard_errors"], "Photo QA detected errors"
          print(f"Site: {len(files)} files, {size/1e6:.1f} MB")
          print(f"Optimized photo QA coverage: {report['changed_photo_count']}")
          if size>850_000_000:
            raise SystemExit("850 MB site safety budget exceeded")
          PY
      - name: Save private visual quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-image-quality-report
          path: page-quality-audit/
          retention-days: 14
          if-no-files-found: warn
      - name: Configure GitHub Pages
        if: ${{ inputs.publish }}
        uses: actions/configure-pages@v5
      - name: Package only public assets
        if: ${{ inputs.publish }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy-public-pages:
    if: ${{ inputs.publish }}
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy public static learner
        id: deployment
        uses: actions/deploy-pages@v4
