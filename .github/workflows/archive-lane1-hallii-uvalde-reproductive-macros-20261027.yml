name: Lane1 Hall panicgrass actual Uvalde reproductive macros
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane1_hallii_uvalde_spikelet_macro_20261027.py
      - .github/workflows/archive-lane1-hallii-uvalde-reproductive-macros-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-hallii-real-uvalde-reproductive-macros
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/archive_lane1_hallii_uvalde_spikelet_macro_20261027.py
            content/taxa/Poaceae/Panicum/panicum-hallii/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify public photo rights and archive genuine Uvalde reproductive images
        run: python scripts/archive_lane1_hallii_uvalde_spikelet_macro_20261027.py
      - name: Publish archived images and real structure teaching arrows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Panicum/panicum-hallii/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: add actual Hall panicgrass Uvalde attached and detached spikelet macros"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
