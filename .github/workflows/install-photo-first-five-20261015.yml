name: Install photo-first five learner cards
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-photo-first-five-20261015.yml'
permissions:
  contents: write
concurrency:
  group: botany-curation-main
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Install and verify five cards and existing downloaded photos
        run: python scripts/install_photo_first_five_20261015.py
      - name: Commit verified canonical cards, media and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa data/manifest.json data/project.json reports curation-archive workflow research-drafts/photo-imports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install photo-first five learner cards with owner-owned photos"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
