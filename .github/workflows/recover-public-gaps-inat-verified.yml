name: Verify and recover exact iNaturalist public gallery gaps

# User-requested one-time species gap recovery. Not a sixth recurring automation.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_public_gaps_inat_verified.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hays-public-inat-gaps-verified
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout live manifest, canonical species, and claims
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare JPEG integrity checks
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Check current iNaturalist photo-level rights and image bytes
        run: python scripts/recover_public_gaps_inat_verified.py
      - name: Verify only public-safe canonical results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('reports/public-gap-inat-verified-20261020.json')
          j=json.loads(p.read_text())
          print('Installed/recovered:', [x['taxon'] for x in j['installed']])
          print('Held:', j['held'])
          for x in j['installed']:
            doc=json.loads(Path(x['species_json']).read_text())
            assert any(y.get('file')==x['relative_photo_path'] and y.get('license') in ('CC BY 4.0','CC BY-NC 4.0','CC BY-NC') for y in doc.get('images',[]))
            local=Path(x['physical_file'])
            assert local.is_file() and local.stat().st_size>5000
            with Image.open(local) as im:im.verify()
          PY
          git status --short
      - name: Publish only verified species/photo records and report to GitHub main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hays Botany iNaturalist photo recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          path='reports/public-gap-inat-verified-20261020.json'
          j=json.loads(Path(path).read_text())
          paths=[path]
          for x in j['installed']:
            paths.extend([x['species_json'],x['physical_file']])
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Photos: verify live iNaturalist licenses and recover public photo gaps [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
