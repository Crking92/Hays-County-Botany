name: Botany curation pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - botany-automation-test
    paths:
      - "curation-inbox/**/READY"

permissions:
  contents: write

concurrency:
  group: botany-curation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run Hays Botany curation pipeline
        run: python scripts/curation_pipeline.py --apply

      - name: Commit automated changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "hays-botany-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "botany(auto): process curation inbox [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push raced with another writer; rebasing on latest ${{ github.ref_name }} (attempt ${attempt}/3)."
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              git rebase --abort || true
              echo "Automatic rebase failed; leaving the inbox intact for safe retry."
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "Push still failed after 3 attempts."
          exit 1
