name: Night Botany Scout

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum queued taxa to scout in this run"
        required: false
        default: "2"
      force_id:
        description: "Optional queue item ID to re-scout"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: hays-botany-night-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contact-sheet dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run research scout
        env:
          BOTANY_SCOUT_MAX: ${{ github.event.inputs.max_items || '2' }}
          BOTANY_SCOUT_FORCE_ID: ${{ github.event.inputs.force_id || '' }}
        run: python scripts/botany_scout.py

      - name: Commit scout drafts and queue state
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No scout changes to commit."
            exit 0
          fi
          git config user.name "hays-botany-scout"
          git config user.email "actions@users.noreply.github.com"
          git add research-queue.json research-drafts reports/last-scout-run.json
          git commit -m "botany(scout): gather nightly research candidates [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
