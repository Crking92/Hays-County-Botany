name: Lane 3 Seep Muhly CC Photo Contact Scout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lane3-seep-observation-scout-20261026.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-seep-observation-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'Pillow>=10,<12'
      - name: Fetch only CC photo-source thumbnails, never publish direct as identification evidence
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python scripts/lane3_seep_observation_scout_20261026.py
      - name: Validate contact and provenance without touching canonical species
        run: |
          python - <<'PY'
          import json,pathlib
          from PIL import Image
          root=pathlib.Path('reports/lane3-seep-observation-scout-20261026')
          report=json.loads((root/'report.json').read_text())
          assert report['status']=='SCREENING_ONLY_NOT_SPECIES_GALLERY'
          assert report['downloaded_thumbnails']>0
          assert all(p['license'] in {'cc0','cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa'} for p in report['photos'])
          with Image.open(root/'contact.jpg') as im:
              assert im.format=='JPEG' and im.width>=1000
              assert not im.getexif().get(34853)
              im.verify()
          print('PASS — reference-only contact; species gallery unchanged; rights labels kept.')
          PY
      - name: Save photo research contact sheet and candidate metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-seep-observation-scout-20261026/
          git diff --cached --quiet && exit 0
          git commit -m "Lane 3 archive per-photo licensed seep muhly diagnostic scout contact sheet"
          for i in 1 2 3 4 5 6 7; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
