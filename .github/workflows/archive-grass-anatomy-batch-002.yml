name: Archive grass anatomy batch 002
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_grass_anatomy_batch_002.py
      - .github/workflows/archive-grass-anatomy-batch-002.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-grass-anatomy-batch-002
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive independently licensed source photos
        run: python scripts/archive_grass_anatomy_batch_002.py
      - name: Commit JPEGs gallery records and holds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Digitaria/digitaria-ciliaris/ content/taxa/Poaceae/Bromus/bromus-pubescens/ reports/grass-anatomy-archive-002-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Store credited licensed ciliaris and pubescens diagnostic photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
