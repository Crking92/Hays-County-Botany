name: Lane1 Tobosa actual veined flowering fan macro CC BY 4
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane1_tobosa_alex_abair_flared_glumes_20261027.py
      - .github/workflows/archive-lane1-tobosa-abair-veined-fans-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-tobosa-abair-ccby4
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive real licensed exact-species high resolution flowering photograph
        run: python scripts/archive_lane1_tobosa_alex_abair_flared_glumes_20261027.py
      - name: Commit locally stored photo and teaching metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Hilaria/hilaria-mutica/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: install licensed Alex Abair tobosa flowering-fan macro"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
