name: Photo-first final shortlist batch 006
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/photo-first-final-batch-006.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python scripts/install_photo_first_poison_ivy_b006.py
      - name: Commit validated photo-first learner card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa data/manifest.json data/project.json reports curation-archive research-drafts/photo-imports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install photo-first poison ivy learner card"
          git pull --rebase origin main
          git push origin HEAD:main
