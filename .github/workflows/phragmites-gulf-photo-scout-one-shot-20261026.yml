name: One-shot Gulf Phragmites photo-rights scout (2026-10-26)
on:
  push:
    branches: [main]
    paths:
      - "workflow/phragmites-photo-review/20261026-gulf-request.json"
permissions:
  contents: write
concurrency:
  group: phragmites-gulf-photo-scout-20261026
  cancel-in-progress: false
jobs:
  scout-individual-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install photo verifier
        run: python -m pip install "Pillow>=10,<12"
      - name: Check current observation IDs and individual photo permissions
        run: python scripts/scout_phragmites_gulf_photos_20261026.py
      - name: Save permitted photo candidates for anatomical review only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phragmites-gulf-photo-scout-20261026.json
          if test -d reports/phragmites-gulf-photo-scout-20261026; then
            git add reports/phragmites-gulf-photo-scout-20261026
          fi
          if git diff --cached --quiet; then
            echo "No licensed photo candidates or report changes"
            exit 0
          fi
          git commit -m "Archive rights-checked Gulf Phragmites candidates for anatomical screening"
          git pull --rebase origin main
          git push origin HEAD:main
