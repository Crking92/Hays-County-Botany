name: Publish Hays Botany learner with GitHub Pages (manual)

# Publish only an optimized public website assembled from the private repo.
# Does NOT use Cloudflare, modify canonical photographs or expose research files.
# GitHub Pages from private repositories requires an eligible GitHub plan.
# Owner must enable Pages -> Source: GitHub Actions before first manual run.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hays-botany-github-pages-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install public-copy image tools
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build public-only visual learner
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_cloudflare_site.sh
          test -s dist/index.html
          test -s dist/photo-review.html
          test -s dist/data/manifest.json
          for restricted in .git .github workflow reports research-drafts research-queue.json curation-inbox curation-archive; do
            if [[ -e "dist/$restricted" ]]; then
              echo "::error::Private source would be public: $restricted"
              exit 1
            fi
          done

      - name: Withhold restricted dentata microscope photos from public copy only
        run: python scripts/stage_public_euphorbia_dentata_20261020.py --site-dir dist

      - name: Withhold restricted David's spurge microscope photographs from public website
        run: python scripts/stage_public_euphorbia_davidii_20261020.py --site-dir dist

      - name: Withhold heterophylla taxon-ID review photo from public copy
        run: python scripts/stage_public_euphorbia_heterophylla_20261020.py --site-dir dist

      - name: Shrink only staged website JPEGs and enforce size budget
        run: |
          python scripts/optimize_public_site_photos.py \
            --site-dir dist --report "${{ runner.temp }}/pages-photo-budget.json" \
            --warn-mib 750 --stop-mib 920

      - name: Strip WebP metadata and withhold one known unreadable comparison illustration
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageOps
          base=Path("dist")
          broken_plate="content/taxa/Convolvulaceae/Ipomoea/images/ipomoea-calyx-corolla-comparison.webp"
          cleaned=0
          excluded=0
          for p in (base/"content").rglob("*.webp"):
            rel=p.relative_to(base).as_posix()
            try:
              with Image.open(p) as im:
                needs_clean=bool(im.info.get("exif")) or bool(im.getexif())
                if not needs_clean:
                  continue
                if getattr(im,"is_animated",False):
                  raise RuntimeError("Animated image needs review: "+rel)
                clean=ImageOps.exif_transpose(im)
                clean.load()
                if clean.mode not in ("RGB","RGBA"):
                  clean=clean.convert("RGBA" if "A" in clean.getbands() else "RGB")
                target=p.with_name(p.name+".clean")
                clean.save(target,format="WEBP",lossless=True,method=6)
              with Image.open(target) as check:
                check.verify()
              target.replace(p)
              cleaned+=1
              print("Staged metadata cleaned:",rel)
            except Exception as exc:
              if rel != broken_plate:
                raise RuntimeError("Unexpected unreadable WebP requires review: "+rel) from exc
              # Do not publish a corrupt illustration or invent its contents.
              # The canonical image and genus JSON in the source tree remain unchanged.
              genus=base/"content/taxa/Convolvulaceae/Ipomoea/genus.json"
              obj=json.loads(genus.read_text(encoding="utf-8"))
              visual=obj["visual_comparison"]
              if visual.get("plate_image_url") != broken_plate:
                raise RuntimeError("Unexpected reference to corrupt comparison plate") from exc
              visual["plate_image_url"]=""
              visual["plate_caption"] = (
                "The diagnostic comparison illustration is temporarily withheld while "
                "the source image is repaired. Use the verified written comparison and "
                "the individual species photographs instead."
              )
              genus.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
              p.unlink()
              excluded+=1
              print("Staged corrupt plate withheld; genus lesson retained:",rel,repr(exc))
          print(f"Staged WebP source metadata cleaned: {cleaned}; unreadable known plate withheld: {excluded}. Original repository files untouched.")
          PY

      - name: Reject unsafe embedded EXIF GPS metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ExifTags
          sensitive=[]
          for photo in Path('dist/content').rglob('*'):
            if not photo.is_file() or photo.suffix.lower() not in {'.jpg','.jpeg','.png','.webp'}:
              continue
            try:
              with Image.open(photo) as im:
                e=im.getexif()
                if e and (34853 in e or any(ExifTags.TAGS.get(k) == 'GPSInfo' for k in e.keys())):
                  sensitive.append(str(photo))
                if im.info.get('exif'):
                  sensitive.append(str(photo))
            except Exception:
              sensitive.append(str(photo))
          if sensitive:
            print('::error::Embedded source metadata or unreadable images remain in public assets; abort deploy')
            for p in sensitive[:20]: print('::error::'+p)
            raise SystemExit(1)
          print('Public image metadata gate passed')
          PY

      - name: Show saved space in workflow summary
        shell: bash
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'pages-photo-budget.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
            out.write(
              f"### Public Hays Botany learner size\n"
              f"- Before: **{d['site_before_mib']} MiB**\n"
              f"- After: **{d['site_after_mib']} MiB**\n"
              f"- Optimized images: **{d['jpeg_files_reencoded']}**\n"
              f"- Originals: **unchanged in private GitHub repository**\n")
          PY

      - name: Upload only staged public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy with GitHub Pages (no Cloudflare)
        id: deployment
        uses: actions/deploy-pages@v4
