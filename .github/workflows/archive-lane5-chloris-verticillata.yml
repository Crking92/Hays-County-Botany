name: Lane 5 archive tumble windmillgrass photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane5_chloris_verticillata.py
      - .github/workflows/archive-lane5-chloris-verticillata.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane5-chloris-verticillata
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_lane5_chloris_verticillata.py
      - name: Commit checked photo files and learner gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Chloris/chloris-verticillata/ reports/lane5-chloris-verticillata-commons-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 5 archive licensed tumble windmillgrass photographs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
