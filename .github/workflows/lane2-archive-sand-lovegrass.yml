name: Lane 2 archive sand lovegrass USDA photo
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_archive_sand_lovegrass.py
      - .github/workflows/lane2-archive-sand-lovegrass.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-sand-lovegrass
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/lane2_archive_sand_lovegrass.py
      - name: Save physical photo and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-trichodes/ reports/lane2-sand-lovegrass-usda-photo-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive public-domain Texas sand lovegrass photograph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
