name: Archive Polypogon public Commons panels
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_polypogon_commons_panels.py
      - .github/workflows/archive-polypogon-commons-panels.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grass-polypogon-commons-photo-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_polypogon_commons_panels.py
      - name: Commit images and updated gallery only after verified downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Polypogon/polypogon-monspeliensis/ reports/polypogon-commons-photo-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified Polypogon Commons photos into species gallery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
