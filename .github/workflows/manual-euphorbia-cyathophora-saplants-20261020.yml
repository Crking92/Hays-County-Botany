name: Install verified-synonym cyathophora macro
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-cyathophora-saplants-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-cyathophora-saplants
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow requests
      - run: |
          git fetch origin main
          git checkout -B main origin/main
      - run: python scripts/manual_euphorbia_cyathophora_saplants_20261020.py
      - name: Confirm exact synonym basis, source CC rights, and image file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          b=Path("content/taxa/Euphorbiaceae/Euphorbia/euphorbia-cyathophora")
          j=json.loads((b/"species.json").read_text())
          assert j["scientific_name"]=="Euphorbia cyathophora"
          assert j["project_inclusion"]["target_zone_status"]=="PASS"
          assert len(j["images"])==4
          item=j["images"][3]
          assert item["license"]=="CC BY-SA 4.0"
          assert item["source_name_as_uploaded"]=="Euphorbia heterophylla var. cyathophora"
          assert item["accepted_name_basis"].startswith("https://powo.science.kew.org")
          f=b/item["file"]
          with Image.open(f) as im:
            assert im.width>=700 and im.height>=700
            im.verify()
          print("PASS: Kew accepted synonym and licensed original verified")
          PY
      - name: Commit local photo and citation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Euphorbiaceae/Euphorbia/euphorbia-cyathophora/ reports/euphorbia-cyathophora-saplants-install-20261020.json
          if git diff --cached --quiet; then echo "already installed"; exit 0; fi
          git commit -m "Install synonym-authenticated cyathophora macro"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
