name: Lane 2 finalize photographed trichodes and Scheele reproductive anatomy
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane2-trichodes-scheelei-real-macro-install-20261027.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-trichodes-scheelei-exact-reproductive-photos-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane2_trichodes_scheelei_reproductive_upgrade_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Archive three source-original anatomy images, cards, arrows and six-role scores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lane2_trichodes_scheelei_reproductive_upgrade_20261027.py
