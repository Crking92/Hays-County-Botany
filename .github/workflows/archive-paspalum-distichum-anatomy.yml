name: Archive Paspalum distichum anatomy
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_paspalum_distichum_anatomy.py
      - .github/workflows/archive-paspalum-distichum-anatomy.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-paspalum-distichum-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Download licensed ligule and spikelets
        run: python scripts/archive_paspalum_distichum_anatomy.py
      - name: Save photo binaries and species gallery on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Paspalum/paspalum-distichum/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Paspalum distichum collar and spikelet macro photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
