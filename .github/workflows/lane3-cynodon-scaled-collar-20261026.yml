name: Lane 3 Cynodon true-scale collar image archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-cynodon-scaled-collar-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-cynodon-scaled-collar-20261026
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refresh main and install only if source bytes truly downloaded
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python scripts/lane3_cynodon_scaled_collar_20261026.py
      - name: Rights, data and JPEG integrity check
        run: |
          python - <<'PY'
          import hashlib,io,json,pathlib
          from PIL import Image
          r=json.loads(pathlib.Path('reports/lane3-cynodon-scaled-collar-20261026.json').read_text())
          assert r['status']=='ONE_SCALED_COLLAR_PHOTO_ARCHIVED'
          assert r['license']=='CC BY-SA 4.0'
          p=pathlib.Path(r['path'])
          assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==r['sha256']
          with Image.open(p) as im:
              assert im.format=='JPEG' and im.width>=950 and im.height>=550
              assert not im.getexif().get(34853)
              im.verify()
          s=json.loads(pathlib.Path('content/taxa/Poaceae/Cynodon/cynodon-dactylon/species.json').read_text())
          panels=[x for x in s['visual_comparison']['items'] if x['image_url']==str(p)]
          assert len(panels)==1 and len(panels[0]['markers'])==2
          assert panels[0]['license']=='CC BY-SA 4.0'
          assert s['id']=='cynodon-dactylon'
          assert 'field_ready_photo_gaps' in s['learner_visual_status']['status']
          print('PASS: exact-taxon licensed image, scale, source, no GPS, 2 hair arrows; growth structure gap preserved.')
          PY
      - name: Commit verified photo and card to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Cynodon/cynodon-dactylon/ reports/lane3-cynodon-scaled-collar-20261026.json
          if git diff --cached --quiet; then echo 'Nothing to commit'; exit 0; fi
          git commit -m "Lane 3 archive exact-species Cynodon scaled collar with licensed credit and verified arrows"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
