name: Lane 3 Cynodon surface-stolon public photo archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-cynodon-runner-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-cynodon-runner-20261026
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refresh latest canonical species
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Download specific independently Commons-licensed real runner photographs
        run: python scripts/lane3_cynodon_runner_20261026.py
      - name: Verify all newly referenced JPEGs and exact license
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          root=pathlib.Path("content/taxa/Poaceae/Cynodon/cynodon-dactylon")
          report=json.loads(pathlib.Path("reports/lane3-cynodon-stolon-pass-20261026.json").read_text())
          assert report["status"]=="ARCHIVED" and report["added"],"No photograph installed; leave report/hold for review"
          s=json.loads((root/"species.json").read_text())
          assert s["id"]=="cynodon-dactylon"
          for a in report["added"]:
              p=pathlib.Path(a["path"])
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==a["sha256"]
              with Image.open(p) as im:
                  assert im.format=="JPEG" and min(im.size)>=750
                  assert not im.getexif().get(34853)
                  im.verify()
              matches=[x for x in s["visual_comparison"]["items"] if x["image_url"]==str(p)]
              assert len(matches)==1
              assert matches[0]["license"] in ("CC BY 2.0","CC BY-SA 4.0")
              assert len(matches[0]["markers"])==2
              assert all("rhizome" not in x["label"].lower() and "root" not in x["label"].lower() for x in matches[0]["markers"])
          assert s["curation_status"]["visual_finish"].startswith("FIELD_READY_PHOTO_GAPS")
          print("PASS licensed, visibly annotated stolon photos, preserved rhizome hold")
          PY
      - name: Commit one-species photo upgrade
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Cynodon/cynodon-dactylon/ reports/lane3-cynodon-stolon-pass-20261026.json
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -m "Lane 3 archive licensed Cynodon surface runners and verified identification arrows"
          for attempt in 1 2 3 4 5 6 7; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
