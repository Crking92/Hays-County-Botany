name: Lane 3 Buckley True Inner Ligule Final Source Review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-buckley-final-ligule-scout-20261027.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-buckley-final-ligule-20261027
  cancel-in-progress: false
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Verify source-identified Texas originals and photo-level rights
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python scripts/lane3_buckley_final_ligule_review_20261027.py
      - name: Retain photos only as research pending original-pixel proof
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          root=pathlib.Path('reports/lane3-buckley-final-ligule-review-20261027')
          r=json.loads((root/'report.json').read_text())
          assert r['status']=='PHYSICAL_SOURCE_PIXELS_STAGED_IN_REPORTS_ONLY_NO_CANONICAL_GALLERY_CHANGES'
          assert r['validated_downloads']>=2
          assert 'Eragrostis superba' in r['source_caution']
          for p in r['results']:
            if p['status']!='PHOTO_SOURCE_RIGHTS_VERIFIED_PIXEL_REVIEW_REQUIRED':continue
            assert p['attribution'] and p['license'] in {'cc0','cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa'}
            path=pathlib.Path(p['file'])
            assert hashlib.sha256(path.read_bytes()).hexdigest()==p['sha256']
            with Image.open(path) as im:
              assert im.format=='JPEG' and min(im.size)>=450 and not im.getexif().get(34853)
              im.verify()
          print('PASS: exact-source photos retained for anatomy review; no automatic gallery promotion')
          PY
      - name: Commit diagnostic inspection sources without species gallery changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/lane3-buckley-final-ligule-review-20261027/
          git diff --cached --quiet && exit 0
          git commit -m "Lane 3 archive remaining licensed Buckley inner-collar candidate originals for final review"
          for attempt in 1 2 3 4 5 6 7; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
