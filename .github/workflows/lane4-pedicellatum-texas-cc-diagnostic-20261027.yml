name: Lane4 pedicellatum real Texas collar and spikelet CC photo archive
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_pedicellatum_texas_cc_diagnostic_20261027.py
      - .github/workflows/lane4-pedicellatum-texas-cc-diagnostic-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-pedicellatum-texas-cc-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/lane4_archive_pedicellatum_texas_cc_diagnostic_20261027.py
            content/taxa/Poaceae/Dichanthelium/dichanthelium-pedicellatum
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify exact taxon research grade and original individual photo CC rights
        run: python scripts/lane4_archive_pedicellatum_texas_cc_diagnostic_20261027.py
      - name: Commit actual licensed JPEG originals and provisional gallery without invented arrows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse content/taxa/Poaceae/Dichanthelium/dichanthelium-pedicellatum/ reports/lane4-pedicellatum-texas-cc-photo-archive-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane4 physically archive research grade pedicellatum CC Texas anatomy photos"
            pushed=0
            for i in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Conflict in concurrent species file, no unsafe overwrite"
                exit 1
              fi
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 3
            done
            test "$pushed" = 1
          fi
