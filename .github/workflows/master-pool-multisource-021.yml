name: Master Pool multisource first-card batch 021
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/master-pool-multisource-021.yml"
permissions:
  contents: write
concurrency:
  group: botany-curation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python -m py_compile scripts/master_pool_multisource_first_card_021.py
      - run: python scripts/master_pool_multisource_first_card_021.py
      - name: Commit physically stored attributed provisional learner cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa data/manifest.json data/project.json reports curation-archive research-drafts/photo-imports/master-pool-multisource-021
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install Phase3 Master Pool provisional cards 021"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
