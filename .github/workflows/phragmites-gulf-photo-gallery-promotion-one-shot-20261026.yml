name: Phragmites one-time verified Gulf sheath/gallery install (2026-10-26)
on:
  push:
    branches: [main]
    paths:
      - "workflow/phragmites-photo-review/20261026-gulf-promote-request.json"
permissions:
  contents: write
concurrency:
  group: phragmites-gulf-gallery-promotion
  cancel-in-progress: false
jobs:
  install-reviewed-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image checker
        run: python -m pip install "Pillow>=10,<12"
      - name: Verify exact source photo bytes/license and install
        run: python scripts/promote_phragmites_gulf_reference_photos_20261026.py
      - name: Commit photo/gallery upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Phragmites/phragmites-australis/species.json
          git add content/taxa/Poaceae/Phragmites/phragmites-australis/images/gulf-*
          git add reports/phragmites-gulf-verified-gallery-additions-20261026.json
          if git diff --cached --quiet; then
            echo "No photo changes to commit"
            exit 0
          fi
          git commit -m "Phragmites: install licensed Gulf sheath and flowering reference panels"
          git pull --rebase origin main
          git push origin HEAD:main
