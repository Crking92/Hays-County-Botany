name: Archive Urochloa fusca vegetative photo
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_urochloa_fusca_vegetative.py
      - .github/workflows/archive-urochloa-fusca-vegetative.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-urochloa-fusca
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_urochloa_fusca_vegetative.py
      - name: Commit licensed image if verified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Urochloa/urochloa-fusca/ reports/urochloa-fusca-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Urochloa fusca verified vegetative photograph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
