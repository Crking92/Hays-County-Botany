name: Lane 3 prepare Buckley crown photo pixel audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-buckley-basal-preview-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-buckley-basal-preview-20261026
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install "Pillow>=10,<12"
      - run: |
          git fetch origin main
          git checkout -B main origin/main
      - run: python scripts/lane3_buckley_basal_review_preview_20261026.py
      - name: Commit audit preview only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-buckley-basal-pixel-review-20261026.jpg reports/lane3-buckley-basal-preview-audit-20261026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lane 3 archive Buckley basal photo audit preview without anatomy assumptions"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
