name: Archive eight real credited poverty-dropseed images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-sporobolus-vaginiflorus-harms-eight-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-onetime-spva-8-original-images-20261022
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real JPEG decode and HTTP tools
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Refresh canonical main and compile installer
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/archive_sporobolus_vaginiflorus_harms_20261022.py
      - name: Individually download and verify all eight exact Harms original JPEGs
        run: python scripts/archive_sporobolus_vaginiflorus_harms_20261022.py
      - name: Verify archived source hashes, copyright and canopy-grass counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          from PIL import Image
          base=Path("content/taxa/Poaceae/Sporobolus")
          sp=json.loads((base/"sporobolus-vaginiflorus/species.json").read_text())
          gn=json.loads((base/"genus.json").read_text())
          r=json.loads(Path("reports/sporobolus-vaginiflorus-physical-harms-eight-20261022.json").read_text())
          audit=json.loads(Path("reports/grass-diagnostic-progress-live-20261022.json").read_text())
          assert r["result"]=="EIGHT_REAL_HARMS_POVERTY_DROPSEED_IMAGES_PHYSICALLY_ARCHIVED"
          assert len(r["files"])==8 and sp["curation_status"]["photo_files_present"]==10
          assert len(sp["images"])==11 and len(sp["visual_comparison"]["items"])==12 and len(gn["visual_comparison"]["items"])==14
          assert gn["project_scope"]["canonical_species_count"]==3
          assert sp["field_id_finish_pass"]["stage"].startswith("FIELD_READY_PHOTO_GAPS")
          assert audit["species_cards"]==112 and audit["genus_modules"]==53
          for f in r["files"]:
              p=Path(f["image_path"])
              assert p.is_file() and p.stat().st_size>7000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==f["archived_sha256"]
              with Image.open(p) as im:
                  assert im.format=="JPEG" and not im.getexif().get(34853)
                  im.verify()
              meta=next(i for i in sp["images"] if i["file"]=="images/"+p.name)
              assert meta["creator"]=="Bob Harms"
              assert meta["source_taxon_name"]=="Sporobolus vaginiflorus"
              assert meta["site_specific_public_permission"]=="BOB_HARMS_SELECTED_MONOCOTS_EDU_WITH_CREDIT_20261022"
              assert meta["license"]=="© Bob Harms — scientific/educational use permitted with photographer credit ONLY (NOT Creative Commons)"
              assert sum(i["image_url"]==str(p) for i in sp["visual_comparison"]["items"])==1
              assert sum(i["image_url"]==str(p) for i in gn["visual_comparison"]["items"])==1
          print("PASS 8 real source photos 2 old local photos, 112 species across 53 genera, all scientific holds retained")
          PY
      - name: Commit only target images/cards and canonical grass census
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Sporobolus/sporobolus-vaginiflorus/
          git add content/taxa/Poaceae/Sporobolus/genus.json
          git add reports/sporobolus-vaginiflorus-physical-harms-eight-20261022.json
          git add reports/grass-diagnostic-progress-live-20261022.json
          git add workflow/field-id-publication/2026-10-22-sporobolus-vaginiflorus-eight-archived-harms.json
          if git diff --cached --quiet; then echo 'ALREADY_ARCHIVED_NOOP'; exit 0; fi
          git commit -m 'Archive eight credited original poverty-dropseed diagnostic JPEGs; census 112 grass cards [skip ci]'
          for retry in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
