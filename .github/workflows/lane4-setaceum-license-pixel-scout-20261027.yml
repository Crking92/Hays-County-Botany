name: Lane4 thin paspalum licensed anatomy candidate gallery
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_scout_setaceum_commons_series_20261027.py
      - .github/workflows/lane4-setaceum-license-pixel-scout-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-setaceum-license-pixel-scout-20261027
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Retrieve individually Commons-licensed candidate previews and exact descriptions
        run: python scripts/lane4_scout_setaceum_commons_series_20261027.py
      - name: Save only attributable review sheet (do not count as species media)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane4-setaceum-photo-scout-20261027/
          if ! git diff --cached --quiet; then
            git commit -m "Lane4: audit Commons thin paspalum photo series and exact photo-level licenses"
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 4
            done
            test "$pushed" = 1
          fi
