name: Lane1 curlymesquite real purple flowering head CC0
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane1_curlymesquite_purple_head_20261027.py
      - .github/workflows/archive-lane1-curlymesquite-purple-head-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-curlymesquite-purple-reproductive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive inspected original CC0 head with photo metadata
        run: python scripts/archive_lane1_curlymesquite_purple_head_20261027.py
      - name: Publish archived JPEG and specific lesson panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Hilaria/hilaria-belangeri/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: add actual CC0 curlymesquite purple attached flowering units"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
