name: Lane 2 archive four real plains lovegrass Bob Harms anatomy photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane2-harms-plains-lovegrass-20261027.yml'
      - 'scripts/lane2_install_eragrostis_intermedia_harms_20261027.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-harms-plains-lovegrass-20261027
  cancel-in-progress: false
jobs:
  verify-and-publish-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Get true licensed original images and write species learner galleries
        run: python scripts/lane2_install_eragrostis_intermedia_harms_20261027.py
      - name: Confirm four real images, rights, count, non-misleading scores and GPS removed
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          s=json.loads(Path("content/taxa/Poaceae/Eragrostis/eragrostis-intermedia/species.json").read_text())
          r=json.loads(Path("reports/lane2-eragrostis-intermedia-harms-anatomy-20261027.json").read_text())
          score=json.loads(Path("reports/lane2-six-role-photo-score-20261027.json").read_text())
          assert s["scientific_name"]=="Eragrostis intermedia"
          assert len(r["photo_details"])==4 and r["new_arrows"]==6
          for d in r["photo_details"]:
              path=Path(d["file"])
              assert path.exists() and path.stat().st_size>9000
              assert hashlib.sha256(path.read_bytes()).hexdigest()==d["local_sha256"]
              with Image.open(path) as im:
                  assert im.format=="JPEG" and min(im.size)>=350
                  assert not im.getexif().get(34853)
                  im.verify()
              rec=next(x for x in s["images"] if x["file"]=="images/"+path.name)
              assert rec["creator"]=="Bob Harms" and "NOT Creative Commons" in rec["license"]
              assert rec["source_taxon_name"]=="Eragrostis intermedia"
              assert rec["image_sha256"]==d["local_sha256"]
              panel=next(x for x in s["visual_comparison"]["items"] if x.get("image_url")==str(path))
              assert len(panel["markers"])==d["arrows"]
          score_row=next(x for x in score["records"] if x["canonical_id"]=="eragrostis-intermedia")
          assert score_row["after_total"]==5.5 and score_row["after_percentage"]==92
          assert score_row["roles"]["true_collar_ligule_sheath"]==0.5
          assert score_row["roles"]["reproductive_closeup"]==1
          print("PASS: four actual source-checked photos, six honest arrows, no false isolated microscopic ligule")
          PY
      - name: Commit only Lane 2 canonical species, photo data and public marker
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-intermedia/ \
            reports/lane2-six-role-photo-score-20261027.json \
            reports/lane2-eragrostis-intermedia-harms-anatomy-20261027.json \
            workflow/field-id-publication/lane2-eragrostis-intermedia-harms-anatomy-20261027.json
          if git diff --cached --quiet; then
            echo 'Previously installed'; exit 0
          fi
          git commit -m "Lane 2: archive four photographed plains lovegrass anatomy details and 6 markers [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
