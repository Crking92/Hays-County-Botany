name: Archive Munroa pulchella photo candidates
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_munroa_pulchella_photos.py
      - .github/workflows/archive-munroa-pulchella-photos.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-munroa-pulchella
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_munroa_pulchella_photos.py
      - name: Commit eligible credited image binaries and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Munroa/munroa-pulchella/ reports/grass-fluffgrass-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive licensed fluffgrass photographs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
