name: Stage future learner photos batch 001
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage-future-photo-batch-001.yml"
permissions:
  contents: write
jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python scripts/stage_future_photo_batch_001.py
      - name: Commit staged review-only photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-drafts/photo-imports/future-batch-001
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage Joey photo candidates for future learner batch 001"
          git pull --rebase origin main
          git push origin HEAD:main
