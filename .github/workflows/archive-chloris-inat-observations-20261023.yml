name: Search licensed Chloris observation photographs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-chloris-inat-observations-20261023.yml
      - scripts/archive_chloris_open_inat_observation_20261023.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chloris-open-observation-photos
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Search taxon-specific iNaturalist research observations and archive openly licensed file
        run: python scripts/archive_chloris_open_inat_observation_20261023.py
      - name: Commit only archived JPEGs and source report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Chloris/chloris-andropogonoides/ reports/chloris-inat-open-search-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Record original-license Chloris exact-taxon photo search result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
