name: Lane1 blue grama real mature comb CC0 plus public rights
on:
  push:
    branches: [main]
    paths:
      - scripts/lane1_archive_blue_grama_patrick_close_cc0_20261027.py
      - .github/workflows/lane1-blue-grama-cc0-mature-comb-rights-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-blue-grama-genuine-cc0-comb
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane1_archive_blue_grama_patrick_close_cc0_20261027.py
            content/taxa/Poaceae/Bouteloua/bouteloua-gracilis/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive genuine clear CC0 grama reproductive detail and keep research photo rights
        run: python scripts/lane1_archive_blue_grama_patrick_close_cc0_20261027.py
      - name: Commit photo and teaching panels without interrupting concurrent grass lanes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Bouteloua/bouteloua-gracilis/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: add genuine CC0 blue grama flowering comb and hold NC originals"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
