name: Glass Root Garden Fast Photo Review Batch 005

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/glass-root-inat-photo-batch005-fast.yml

permissions:
  contents: write

concurrency:
  group: glass-root-inat-photo-review-batch005-fast
  cancel-in-progress: false

jobs:
  stage-fast-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install pillow
      - name: Fetch owner-photo inventory and current eligible-card priorities
        run: |
          python3 scripts/glass_root_inat_photo_metadata.py \
            --user calvinking --place-id 18 --taxon-id 47126 \
            --manifest data/manifest.json \
            --out workflow/glass-root-inat/batch-005-fast/metadata
          python3 scripts/glass_root_inat_backlog_plan.py \
            --photos workflow/glass-root-inat/batch-005-fast/metadata/photo-candidates.csv \
            --manifest data/manifest.json \
            --out workflow/glass-root-inat/batch-005-fast/plan --batch-size 4
      - name: Download only six useful preview candidates per selected species
        run: |
          python3 scripts/glass_root_inat_review_previews_batch005.py \
            --input workflow/glass-root-inat/batch-005-fast/metadata/photo-candidates.csv \
            --queue workflow/glass-root-inat/batch-005-fast/plan/priority-queue.csv \
            --out workflow/glass-root-inat/batch-005-fast/previews \
            --taxa-count 4 --per-species 6
      - name: Persist private review pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/glass-root-inat/batch-005-fast/previews/ workflow/glass-root-inat/batch-005-fast/plan/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage compact Glass Root Garden batch 005 photo contact sheets"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-root-inat-batch-005-fast-previews
          path: workflow/glass-root-inat/batch-005-fast/
          retention-days: 30
