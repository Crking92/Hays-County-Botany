name: Archive one actual mucronata mm-scaled spikelet (public domain)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-dinebra-one-conrad-scaled-mucronata-20261023.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-dinebra-one-exact-mucronata-mm-source-20261023
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original photo binary verification
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Refresh and precompile exact one-photo installer
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/archive_dinebra_mucronata_conrad_scaled_spikelet_20261023.py
      - name: Archive one true subspecies image with photographed millimeter ruler
        run: python scripts/archive_dinebra_mucronata_conrad_scaled_spikelet_20261023.py
      - name: Verify source identity, actual image bytes, precise arrow bounds and rights
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          from PIL import Image
          sys.path.insert(0,"scripts")
          from build_public_pages_snapshot import rights
          from public_photo_rights_preflight import photo_rights
          base=Path("content/taxa/Poaceae/Dinebra")
          s=json.loads((base/"dinebra-panicea-subsp-mucronata/species.json").read_text())
          g=json.loads((base/"genus.json").read_text())
          report=json.loads(Path("reports/dinebra-mucronata-one-jim-conrad-mm-spikelet-20261023.json").read_text())
          assert report["status"]=="ONE_AUTHENTIC_MUCRONATA_MM_SPIKELET_PHOTO_ARCHIVED"
          assert report["new_real_true_subspecies_photos"]==1
          assert report["new_visible_ruler_and_spikelet_arrows"]==2
          assert report["fine_glume_mucro_not_claimed"] is True
          assert s["scientific_name"]=="Dinebra panicea subsp. mucronata"
          assert len(s["images"])==6 and s["curation_status"]["photo_files_present"]==6
          assert len(s["visual_comparison"]["items"])==10 and len(g["visual_comparison"]["items"])==10
          assert s["field_id_finish_pass"]["stage"].startswith("FIELD_READY_PHOTO_GAPS")
          file=Path(report["physical_file"])
          assert file.is_file() and hashlib.sha256(file.read_bytes()).hexdigest()==report["archived_sha256"]
          with Image.open(file) as image:
              assert image.format=="JPEG" and 650<=image.width<=720 and 560<=image.height<=630
              assert not image.getexif().get(34853)
              image.verify()
          original=next(x for x in s["images"] if x.get("source_image")=="https://www.backyardnature.net/n/19/190322ld.jpg")
          assert original["source_taxon_name"]=="Dinebra panicea subsp. mucronata"
          assert original["creator"]=="Jim Conrad" and "Public domain" in original["license"]
          assert original["license_url"]=="https://www.backyardnature.net/j/copyrite.htm"
          assert rights(original,True)[0] and photo_rights(original,True) is None
          panel=[x for x in s["visual_comparison"]["items"] if x["image_url"]==str(file)]
          other=[x for x in g["visual_comparison"]["items"] if x["image_url"]==str(file)]
          assert len(panel)==len(other)==1
          assert len(panel[0]["markers"])==2 and panel[0]["scientific_name"]=="Dinebra panicea subsp. mucronata"
          assert all(0<=m[key]<=100 for m in panel[0]["markers"] for key in ("target_x","target_y","label_x","label_y"))
          assert not any("mucro" in m["label"].lower() or "ligule" in m["label"].lower() for m in panel[0]["markers"])
          for panel in s["visual_comparison"]["items"]:
              if "brachiata" in str(panel.get("scientific_name","")):
                  assert panel.get("taxon_comparison_only") is True
          print("PASS exact subspecies/public-domain source, original photo bytes, true ruler annotations, no fictitious mucro or other subspecies substitution")
          PY
      - name: Commit only verified original media, canonical cards and source report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Dinebra/dinebra-panicea-subsp-mucronata/
          git add content/taxa/Poaceae/Dinebra/genus.json
          git add reports/dinebra-mucronata-one-jim-conrad-mm-spikelet-20261023.json
          git add workflow/field-id-publication/2026-10-23-dinebra-mucronata-one-original-mm-spikelet.json
          if git diff --cached --quiet; then echo "ALREADY_PRESENT_NOOP"; exit 0; fi
          git commit -m 'Dinebra: genuine ssp mucronata ruler spikelet with two honest photo arrows [skip ci]'
          for retry in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              sleep 5
          done
          exit 1
