name: Lane 2 archive plains lovegrass habit
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_archive_eragrostis_intermedia.py
      - .github/workflows/lane2-archive-eragrostis-intermedia.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-intermedia-photo
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/lane2_archive_eragrostis_intermedia.py
      - name: Commit archived media and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-intermedia/ reports/lane2-eragrostis-intermedia-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive licensed plains lovegrass habit photograph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
