name: Lane 1 witchgrass anatomy photo archive
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lane1-witchgrass-anatomy-archive.yml'
      - 'scripts/archive_lane1_witchgrass_review.py'
permissions:
  contents: write
concurrency:
  group: lane1-witchgrass-commons-archive
  cancel-in-progress: false
jobs:
  archive-exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - title: 'File:Panicum capillare sl24.jpg'
            slug: 'labeled-spikelet-dissection'
            max_edge: 10000
          - title: 'File:Panicum capillare (3812306805).jpg'
            slug: 'hairy-sheath-and-collar'
            max_edge: 2400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Acquire exact Commons photo with strict license whitelist
        env:
          TITLE: ${{ matrix.title }}
          MAX_EDGE: ${{ matrix.max_edge }}
        run: |
          python scripts/commons_photo_review_import.py --file-title "$TITLE" \
            --taxon 'Panicum capillare' --output review_photo --max-edge "$MAX_EDGE"
      - name: Archive licensed image and update its existing gallery panel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TITLE: ${{ matrix.title }}
        run: python scripts/archive_lane1_witchgrass_review.py
      - name: Save attribution and image-digest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane1-witchgrass-${{ matrix.slug }}-evidence
          path: review_photo/evidence.json
          if-no-files-found: ignore
          retention-days: 30
