name: Lane 4 second pass Smithsonian Lindheimer voucher
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_lindheimeri_smithsonian_voucher.py
      - .github/workflows/lane4-lindheimeri-smithsonian.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-lindheimeri-photo
  cancel-in-progress: false
jobs:
  voucher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane4_lindheimeri_smithsonian_voucher.py
      - name: Commit only verified files and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Dichanthelium/dichanthelium-lindheimeri/ reports/lane4-lindheimeri-smithsonian-voucher.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 4 verify Smithsonian CC0 Lindheimer panicgrass specimen"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
