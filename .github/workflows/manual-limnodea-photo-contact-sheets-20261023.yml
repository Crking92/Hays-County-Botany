name: Review source-licensed Ozarkgrass photo pixels in indexed sheets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-limnodea-photo-contact-sheets-20261023.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-review-index:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download only small source-tagged previews for review
        run: |
          python -m pip install 'Pillow>=10,<12' 'requests>=2.31,<3'
          python scripts/review_limnodea_inat_photo_previews_20261023.py
      - name: Commit review-only JPEG contact sheets, not species/gallery photos
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/limnodea-photo-shortlist-20261023/
          git commit -m 'Stage source-linked Ozarkgrass research photo thumbnails for pixel review [skip ci]'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
