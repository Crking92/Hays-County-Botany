name: Lane 3 archive Lindheimer muhly licensed photo
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane3-lindheimeri-commons-20261023.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane3_lindheimeri_commons_20261023.py
      - name: Commit only verified source output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-lindheimeri-commons-20261023.json content/taxa/Poaceae/Muhlenbergia/muhlenbergia-lindheimeri/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 3 Lindheimer muhly licensed image or source hold"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
