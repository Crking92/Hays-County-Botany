name: Build Chloris diagnostic photo review sheet
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chloris-anatomy-contact-sheet-20261023.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chloris-contact-sheet
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/build_chloris_anatomy_review_sheet_20261023.py
      - name: Commit local-photo review montage and checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/chloris-anatomy-photo-review-20261023.json reports/chloris-anatomy-contact-sheet-20261023.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add actual Chloris gallery contact sheet and physical image QA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
