name: Archive Chloris hybrid historical plate
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_chloris_hybrid_historical_plate.py
      - .github/workflows/archive-chloris-hybrid-historical-plate.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-chloris-hybrid-historical-plate
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_chloris_hybrid_historical_plate.py
      - name: Commit verified plate and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Chloris/chloris-x-subdolichostachya/ reports/chloris-hybrid-historical-plate-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive historical Chloris hybrid comparison plate with figure labels"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
