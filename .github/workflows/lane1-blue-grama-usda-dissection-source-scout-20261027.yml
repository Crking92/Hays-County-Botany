name: Lane1 Blue Grama USDA actual floret source scout
on:
  push:
    branches: [main]
    paths:
      - scripts/lane1_scout_blue_grama_usda_seedimages_20261027.py
      - .github/workflows/lane1-blue-grama-usda-dissection-source-scout-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/lane1_scout_blue_grama_usda_seedimages_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4 Pillow
      - name: Check exact original anatomy size and attributed rights
        run: python scripts/lane1_scout_blue_grama_usda_seedimages_20261027.py
