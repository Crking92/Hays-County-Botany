name: Euphorbia davidii public seed-photo final review
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-davidii-finished-pass-20261020.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: euphorbia-davidii-annotated-review
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify species rights, actual seed image, arrows, and county hold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("content/taxa/Euphorbiaceae/Euphorbia/euphorbia-davidii")
          j=json.loads((base/"species.json").read_text())
          assert j["scientific_name"]=="Euphorbia davidii"
          assert j["project_inclusion"]["target_zone_status"].startswith("AUTHORITY CONFLICT")
          assert j["project_inclusion"]["native_metrics_excluded"] is True
          assert j["field_id_finalization"]["stage"]=="PASS_IN_PROGRESS"
          assert len(j["images"])==5
          assert len(j["visual_comparison"]["items"])==5
          assert len(j["comparisons"]["confused_with"])>=5
          assert len(j["field_photo_quickcheck"]["featured_photo_indices"])==3
          assert sum(len(x["markers"]) for x in j["visual_comparison"]["items"])==9
          assert [x["scientific_name"] for x in j["visual_comparison"]["items"]].count("Euphorbia davidii")==3
          assert [x["scientific_name"] for x in j["visual_comparison"]["items"]].count("Euphorbia dentata")==2
          seed=j["images"][4]
          assert seed["public_reuse"]=="yes"
          assert "SeedImages" in seed["creator"]
          assert seed["original_image_dimensions"]==[1080,720]
          assert seed["original_image_sha256"]
          assert seed["source_page"].startswith("https://idtools.org/seedimages/")
          assert (base/seed["file"]).is_file()
          assert all(x["license"]=="copyrighted / public reuse not granted" for x in j["images"][2:4])
          for item in j["visual_comparison"]["items"]:
            f=Path(item["image_url"])
            assert f.exists() and f.stat().st_size>8000, str(f)
            assert item.get("creator") and item.get("source_page")
            assert "private-study" not in str(f)
            for m in item["markers"]:
              assert len(m["label"])>=5
              assert all(isinstance(m[k], (int,float)) and 0<=m[k]<=100 for k in ("label_x","label_y","target_x","target_y"))
          assert Path("scripts/stage_public_euphorbia_davidii_20261020.py").is_file()
          deploy=Path(".github/workflows/deploy-github-pages-learner.yml").read_text()
          assert "stage_public_euphorbia_davidii_20261020.py --site-dir dist" in deploy
          qa=json.loads(Path("reports/euphorbia-davidii-finished-field-id-20261020.json").read_text())
          assert qa["verified_photo_arrows"]==9 and len(qa["evidence"])==5
          print("PASS: native authority hold preserved, licensed real seed 1080x720, five source-matched panels and nine arrows; two restricted files excluded by public stage.")
          PY
      - name: Trigger final photo-safe GitHub Pages publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Requested David's spurge learner publication with restricted images withheld."
