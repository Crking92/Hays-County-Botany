name: Lane 3 recover licensed nimblewill flowering head
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-nimblewill-head-retry-20261026.yml'
      - 'scripts/lane3_finish_nimblewill_head_20261026.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-nimblewill-head-retry-20261026
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Read latest species record and source license
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json, pathlib
          c=json.loads(pathlib.Path('content/taxa/Poaceae/Muhlenbergia/muhlenbergia-schreberi/species.json').read_text())
          p=[x for x in c['images'] if x.get('inaturalist_photo_id')==92218354]
          assert c['id']=='muhlenbergia-schreberi' and len(p)==1
          assert p[0]['creator']=='Emily Summerbell' and p[0]['license']=='CC BY 4.0'
          print('PASS original identified row, source attribution and license')
          PY
      - name: Download and verify the exact licensed reproductive photograph
        run: python scripts/lane3_finish_nimblewill_head_20261026.py
      - name: Validate bytes and local gallery reference
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          from PIL import Image
          p=pathlib.Path('reports/lane3-nimblewill-head-retry-20261026.json')
          r=json.loads(p.read_text())
          assert r['result']=='PHYSICALLY_ARCHIVED_UNANNOTATED_REPRODUCTIVE_SOURCE_PHOTO'
          f=pathlib.Path(r['local_image'])
          assert f.exists() and hashlib.sha256(f.read_bytes()).hexdigest()==r['sha256']
          with Image.open(f) as im:
            assert im.format=='JPEG' and im.width>=600 and im.height>=600
            assert not im.getexif().get(34853)
            im.verify()
          s=json.loads(pathlib.Path('content/taxa/Poaceae/Muhlenbergia/muhlenbergia-schreberi/species.json').read_text())
          assert any(x.get('image_url')==str(f) and x.get('markers')==[] for x in s['visual_comparison']['items'])
          assert s['curation_status']['visual_finish'].startswith('FIELD_READY_PHOTO_GAPS')
          print('PASS local JPEG, SHA256, license, zero speculative arrows, photo holds retained')
          PY
      - name: Commit guarded one-species upgrade
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-nimblewill-head-retry-20261026.json content/taxa/Poaceae/Muhlenbergia/muhlenbergia-schreberi/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Lane 3 archive exact CC BY nimblewill flowering photo and display in gallery"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo "Commit or branch lease blocked; preserve failure for review" >&2
          exit 1
