name: Install eight licensed first photographs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/empty-photo-install-006.yml
permissions:
  contents: write
concurrency:
  group: glass-root-inat-approved-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pillow
      - name: Validate exact sources and install reviewed first photographs
        run: python3 scripts/empty_photo_install_006.py
      - name: Commit verified canonical files and audit
        shell: bash
        run: |
          git config user.name "hays-botany-automation"
          git config user.email "actions@users.noreply.github.com"
          git add content/taxa reports/empty-photo-install-006.json reports/photo-fast-fill-zero-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "botany(auto): install eight licensed first photos [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
          done
          exit 1
