name: Master Pool multisource first-card batch 010
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/master-pool-multisource-010.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python -m py_compile scripts/master_pool_multisource_first_card_010.py
      - run: python scripts/master_pool_multisource_first_card_010.py
      - name: Save verified first cards and photo-source holds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa data/manifest.json data/project.json reports curation-archive research-drafts/photo-imports/master-pool-multisource-010
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install multisource first learner cards batch 010"
          git pull --rebase origin main
          git push origin HEAD:main
