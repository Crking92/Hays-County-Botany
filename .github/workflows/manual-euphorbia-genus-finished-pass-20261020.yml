name: Euphorbia Genus Verified Field-ID Release
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-genus-finished-pass-20261020.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: manual-euphorbia-genus-finished-pass
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate real image paths, rights, annotations and hold semantics
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          p=Path("content/taxa/Euphorbiaceae/Euphorbia/genus.json")
          g=json.loads(p.read_text())
          v=g["visual_comparison"]
          photos=v["items"]
          assert len(photos)==13
          assert len(g["field_groups"])==4
          assert len(g["comparison_cards"])==4
          assert len(v["rights_hold_reference_items"])==13
          assert len(v["study_only_photo_links"])>=4
          assert g["curation_status"]["genus_audit"].startswith("CREW_READY")
          for item in photos:
            assert re.fullmatch(r"CC BY(?:-SA)?(?:\s+[0-9.]+)?|Public domain",item["license"],flags=re.I), item["license"]
            path=Path(item["image_url"])
            assert path.is_file() and path.stat().st_size>15000, path
            assert item["creator"] and item["source_page"].startswith("https://")
            for m in item.get("markers",[]):
              assert len(m["label"])>3
              assert all(isinstance(m[k], (int,float)) and 0<=m[k]<=100 for k in ("label_x","label_y","target_x","target_y"))
          count=sum(len(x.get("markers",[])) for x in photos)
          assert count==14
          assert sum(bool(x.get("markers")) for x in photos)==10
          assert not any("private-study" in x["image_url"] for x in photos)
          report=json.loads(Path("reports/euphorbia-genus-field-id-20261020.json").read_text())
          assert report["verified_arrows"]==count and report["annotated_photos"]==10
          assert len(report["source_evidence"])==10
          for item in report["source_evidence"]:
            assert Path(item["file"]).is_file()
          assert "rim" in g["comparison_cards"][1]["caution"]
          assert "seed" in g["comparison_cards"][2]["caution"].lower()
          print("PASS: 13 copyright-safe reusable image panels, 10 image-verified annotated sources, 14 arrows, 4 science comparisons; 13 restricted/unverified references held from public comparison panel.")
          PY
      - name: Verify species dentata photo-first closeout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("content/taxa/Euphorbiaceae/Euphorbia/")
          j=json.loads((base/"euphorbia-dentata/species.json").read_text())
          assert j["id"]=="euphorbia-dentata"
          assert j["project_inclusion"]["target_zone_status"]=="PASS"
          assert j["field_id_finalization"]["stage"]=="PASS_IN_PROGRESS"
          assert j["field_photo_quickcheck"]["featured_photo_indices"]==[0,1,2]
          panels=j["visual_comparison"]["items"]
          assert len(panels)==4
          assert len([x for x in panels if x["scientific_name"]=="Euphorbia dentata"])==3
          assert len([x for x in panels if x["scientific_name"]=="Euphorbia davidii"])==1
          assert sum(len(x["markers"]) for x in panels)==8
          for p in panels:
            assert p["license"] in ("CC BY-SA","CC BY 2.0")
            assert Path(p["image_url"]).is_file() and Path(p["image_url"]).stat().st_size>15000
            assert p["source_page"].startswith("https://")
            for m in p["markers"]:
              assert 0<=m["target_x"]<=100 and 0<=m["target_y"]<=100
          assert len(j["images"])==5
          assert sum("public reuse not granted" in x["license"] for x in j["images"])==2
          for p in panels:
            assert "private-study" not in p["image_url"]
          report=json.loads(Path("reports/euphorbia-dentata-field-id-20261020.json").read_text())
          assert report["verified_arrows"]==8 and len(report["all_evidence"])==4
          assert len(report["restricted_existing_photo_holds"])==2
          assert "seed" in j["field_id_finalization"]["field_training_status"].lower()
          print("PASS: E. dentata 3 source-real verified photos + E. davidii lookalike, 8 arrows, 2 restricted sources not used for annotated lesson, seed/hair science holds.")
          PY
      - name: Request current GitHub Pages public build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Euphorbia public learner release requested"

# Rerun 2026-10-20 after revising the E. dentata/davidii seed-photo-gap caution to match field evidence.
