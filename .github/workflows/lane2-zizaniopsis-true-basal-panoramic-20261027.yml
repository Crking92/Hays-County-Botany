name: Lane 2 archive giant cutgrass real Texas crown and flowering branches
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_zizaniopsis_crown_spikelets_20261027.py
      - .github/workflows/lane2-zizaniopsis-true-basal-panoramic-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-zizaniopsis-basal-crown-20261027
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - name: Verify exact Zizaniopsis research grade photos individually licensed and save JPEG bytes
        run: python scripts/lane2_zizaniopsis_crown_spikelets_20261027.py
      - name: Commit real photo bytes with rebased non-force retry under parallel lane updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Zizaniopsis/zizaniopsis-miliacea/ reports/lane2-zizaniopsis-anahuac-crown-dallas-spikelets-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive real Anahuac Zizaniopsis basal crown and Dallas flowering close-up"
            done_push=0
            for attempt in $(seq 1 18); do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then done_push=1; break; fi
              sleep 3
            done
            if [ "${done_push}" != "1" ]; then exit 1; fi
          fi
