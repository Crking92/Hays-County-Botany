name: Lane 1 source-verified Panicum capillare collar and 2 gallery mirrors
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lane1-witchgrass-3-photo-20261027.yml'
      - 'scripts/lane1_panicum_capillare_mirror_two_and_add_collar_20261027.py'
permissions:
  contents: write
concurrency:
  group: lane1-witchgrass-source-mirror-20261027
  cancel-in-progress: false
jobs:
  archive-real-witchgrass-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source and image verifiers
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Verify exact photo licenses, download original anatomical JPEGs, sanitize metadata, and update canonical gallery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/lane1_panicum_capillare_mirror_two_and_add_collar_20261027.py
