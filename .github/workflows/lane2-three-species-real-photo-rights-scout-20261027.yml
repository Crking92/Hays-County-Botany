name: Lane 2 original Texas anatomy photographs CC-license candidate scout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane2-three-species-real-photo-rights-scout-20261027.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-actual-species-photo-rights-scout-20261027
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane2_three_species_open_photo_contact_scout_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Collect CC-only real Texas species original observation thumbnails and provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lane2_three_species_open_photo_contact_scout_20261027.py
