name: Archive actual slim tridens ligule sheath and hairy spikelet photos
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/manual-tridentopsis-mutica-anatomy-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-tridentopsis-mutica-harms-source-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install authentic JPEG verification dependencies
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12"
      - name: Download and install only actual source images of accepted synonym
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/archive_tridentopsis_mutica_harms_20261027.py
          python scripts/archive_tridentopsis_mutica_harms_20261027.py
      - name: Verify physical original JPEGs, rights and source taxon mapping
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          rp=Path('reports/tridentopsis-mutica-harms-original-anatomy-20261027.json')
          if not rp.exists():
              print("No new photographs physically installed")
              raise SystemExit(0)
          r=json.loads(rp.read_text())
          assert r['result']=='EXACT_COPYRIGHTED_SOURCE_JPEGS_ARCHIVED_FOR_EDUCATION'
          assert 1<=r['images_added']<=3
          sp=json.loads(Path('content/taxa/Poaceae/Tridentopsis/tridentopsis-mutica/species.json').read_text())
          gp=json.loads(Path('content/taxa/Poaceae/Tridentopsis/genus.json').read_text())
          assert sp['id']=='tridentopsis-mutica' and 'Tridens muticus' in sp['synonyms']
          for x in r['photos']:
              path=Path(x['file'])
              assert path.is_file() and path.stat().st_size>3000
              assert hashlib.sha256(path.read_bytes()).hexdigest()==x['sha256']
              with Image.open(path) as photo:
                  assert photo.format=='JPEG' and not photo.getexif().get(34853)
                  photo.verify()
              for d in (sp,gp):
                  matches=[i for i in d['visual_comparison']['items'] if i.get('source_photo_id')==x['photo_id']]
                  assert len(matches)==1 and matches[0]['image_url']==str(path)
                  assert matches[0]['source_taxon_name']=='Tridens muticus'
                  assert matches[0]['accepted_taxon_name']=='Tridentopsis mutica'
                  assert matches[0]['markers']==[]
          print('PASS: locally archived actual original photographed organs with verified names and license')
          PY
      - name: Commit only decoded originals and rights-filtered site marker
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Tridentopsis/tridentopsis-mutica/
          git add content/taxa/Poaceae/Tridentopsis/genus.json
          if test -e reports/tridentopsis-mutica-harms-original-anatomy-20261027.json; then
            git add reports/tridentopsis-mutica-harms-original-anatomy-20261027.json
            git add workflow/field-id-publication/2026-10-27-tridentopsis-mutica-harms-anatomy-release.json
          fi
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Archive genuine Harms slim tridens sheath and flowering spikelets with accepted synonym'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
