name: Lane1 cereal rye actual attached flowering ear CC BY SA
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane1_rye_attached_flowering_rasbak_20261027.py
      - .github/workflows/archive-lane1-rye-attached-anthers-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-rye-attached-rigorous-public-photograph
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/archive_lane1_rye_attached_flowering_rasbak_20261027.py
            content/taxa/Poaceae/Secale/secale-cereale/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive source-verified rye flowering head and reconcile true ligule lesson
        run: python scripts/archive_lane1_rye_attached_flowering_rasbak_20261027.py
      - name: Commit true flowering JPEG and photo teaching card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Secale/secale-cereale/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: add real licensed rye flowering ear and public ligule lesson"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
