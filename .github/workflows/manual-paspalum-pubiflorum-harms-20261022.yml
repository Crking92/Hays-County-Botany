name: Archive four real hairyseed paspalum anatomy photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-paspalum-pubiflorum-harms-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-paspalum-pubiflorum-four-20261022
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Refresh latest canonical state
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/archive_paspalum_pubiflorum_harms_20261022.py
      - name: Archive original Bob Harms photos with actual JPEG integrity checks
        run: python scripts/archive_paspalum_pubiflorum_harms_20261022.py
      - name: Verify physical image hashes copyright links and field gap status
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          d=Path('content/taxa/Poaceae/Paspalum')
          s=json.loads((d/'paspalum-pubiflorum/species.json').read_text())
          g=json.loads((d/'genus.json').read_text())
          r=json.loads(Path('reports/paspalum-pubiflorum-harms-original-four-20261022.json').read_text())
          assert r['result']=='FOUR_PHYSICAL_HARMS_PASPALUM_PUBIFLORUM_JPEGS_ARCHIVED'
          assert len(r['files'])==4 and s['curation_status']['photo_files_present']==5
          assert len(s['images'])==5 and len(s['visual_comparison']['items'])==6 and len(g['visual_comparison']['items'])==14
          assert s['field_id_finish_pass']['stage'].startswith('FIELD_READY_PHOTO_GAPS')
          for info in r['files']:
              p=Path(info['path'])
              assert p.is_file() and p.stat().st_size>6000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==info['archived_sha256']
              with Image.open(p) as im:
                  assert im.format=='JPEG' and not im.getexif().get(34853)
                  im.verify()
              i=next(x for x in s['images'] if x['file']=='images/'+p.name)
              assert i['creator']=='Bob Harms'
              assert i['license']=='© Bob Harms — scientific/educational use with attribution (NOT Creative Commons)'
              assert i['source_taxon_name']=='Paspalum pubiflorum'
              assert i['site_specific_public_permission']=='BOB_HARMS_SELECTED_MONOCOTS_EDU_WITH_CREDIT_20261022'
              assert any(x['image_url']==str(p) for x in s['visual_comparison']['items'])
          print('PASS: four physical image files, hashes, no GPS, original rights and scientific holds preserved')
          PY
      - name: Commit only verified target species genus and release evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Paspalum/paspalum-pubiflorum/
          git add content/taxa/Poaceae/Paspalum/genus.json
          git add reports/paspalum-pubiflorum-harms-original-four-20261022.json
          git add workflow/field-id-publication/2026-10-22-paspalum-pubiflorum-four-real-jpegs.json
          if git diff --cached --quiet;then echo 'CANONICAL_ALREADY_DONE';exit 0;fi
          git commit -m 'Archive four authentic credited Harms hairyseed paspalum diagnostic JPEGs [skip ci]'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            sleep 5
          done
          exit 1
