name: Lane 5 inland sea oats CC0 floret photo
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane5_chasmanthium_floret.py
      - .github/workflows/archive-lane5-chasmanthium-floret.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane5-chasmanthium-floret
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_lane5_chasmanthium_floret.py
      - name: Save licensed photo and updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Chasmanthium/chasmanthium-latifolium/ reports/lane5-chasmanthium-cc0-floret-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive CC0 inland sea oats spikelet close-up"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
