name: Lane1 Hall panicgrass Bob Harms real ligule and spikelet dissection
on:
  push:
    branches: [main]
    paths:
      - scripts/lane1_archive_hallii_bob_harms_ligule_spikelets_20261027.py
      - .github/workflows/lane1-archive-hallii-bob-harms-ligule-dissection-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-hallii-bob-harms-educational-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane1_archive_hallii_bob_harms_ligule_spikelets_20261027.py
            content/taxa/Poaceae/Panicum/panicum-hallii/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow beautifulsoup4
      - name: Verify Bob Harms explicit scientific and educational reuse and photo pixels
        run: python scripts/lane1_archive_hallii_bob_harms_ligule_spikelets_20261027.py
      - name: Commit genuine photo archives and fine anatomy learner panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Panicum/panicum-hallii/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: add real Hall panicgrass inner ligule and separated spikelet photos"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              echo "Concurrent push conflict, retry $attempt"
              sleep 3
            done
            exit 1
          fi
