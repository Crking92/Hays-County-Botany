name: Lane 2 verify iNaturalist source observation licenses for two lugens photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane2-lugens-inat-observation-license-20261026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-public-observations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match photo IDs to observation photo-license entries
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          import json
          desired={154012199,154012166}
          for page in range(1,5):
            u='https://api.inaturalist.org/v1/observations?'+urlencode({'taxon_id':162397,'per_page':200,'page':page,'order':'desc','order_by':'created_at'})
            try:
              with urlopen(Request(u,headers={'User-Agent':'Hays-Botany-Learner metadata-only licensed source verification'}),timeout=25) as h: data=json.load(h)
              print('PAGES',page,'total_results',data.get('total_results'), 'count',len(data.get('results',[])))
              for o in data.get('results',[]):
                for pic in o.get('photos',[]):
                  if pic.get('id') in desired:
                    print('MATCH',json.dumps({'photo_id':pic.get('id'),'photo_license':pic.get('license_code'),'photo_attribution':pic.get('attribution'),'photo_url':pic.get('url'),'photo_original':pic.get('original_url'),'observation_id':o.get('id'),'species':o.get('taxon',{}).get('name'),'quality_grade':o.get('quality_grade'),'observed_on':o.get('observed_on'),'place_guess':o.get('place_guess'),'observer':o.get('user',{}).get('login')},ensure_ascii=False))
              if page*200 >= data.get('total_results',0):break
            except Exception as e: print('API_ERROR',page,str(e)[:500]); break
          PY
