name: Lane4 true oligosanthes live foliage and growth-habit licensed photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_oligosanthes_licher_20261027.py
      - .github/workflows/lane4-oligosanthes-max-licher-real-photos-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-dichanthelium-oligosanthes-max-licher-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/lane4_archive_oligosanthes_licher_20261027.py
            content/taxa/Poaceae/Dichanthelium/dichanthelium-oligosanthes
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Confirm individually credited CC BY-SA original photographs and archive EXIF-free media
        run: python scripts/lane4_archive_oligosanthes_licher_20261027.py
      - name: Save real source-verified photos, rights and provisional gallery panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse content/taxa/Poaceae/Dichanthelium/dichanthelium-oligosanthes reports/lane4-oligosanthes-max-licher-photo-archive-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane4 archive Max Licher CC BY-SA real oligosanthes growth and reproductive photos"
            pushed=0
            for i in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 3
            done
            test "$pushed" = 1
          fi
