name: Lane 4 archive Paspalum distichum habit
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_paspalum_distichum_habit_archive.py
      - .github/workflows/lane4-paspalum-distichum-habit.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-paspalum-distichum
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane4_paspalum_distichum_habit_archive.py
      - name: Commit image and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Paspalum/paspalum-distichum/ reports/lane4-paspalum-distichum-habit-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive public-license knotgrass habitat photograph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
