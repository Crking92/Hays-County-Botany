name: Lane 2 publish independently CC BY purple lovegrass external collar hair photo
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_spectabilis_anne_parker_collar_20261026.py
      - .github/workflows/lane2-spectabilis-outer-hairs-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-spectabilis-outer-hairs-20261026
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install Pillow
      - name: Individually verify photo license, download safe actual pixels and preserve exact anatomy limits
        run: python scripts/lane2_spectabilis_anne_parker_collar_20261026.py
      - name: Save source-credited JPEG, one arrow and preserved canonical purple lovegrass gallery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-spectabilis/ reports/lane2-spectabilis-external-collar-hairs-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive credited purple lovegrass long outside collar hairs with true ligule hold"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
