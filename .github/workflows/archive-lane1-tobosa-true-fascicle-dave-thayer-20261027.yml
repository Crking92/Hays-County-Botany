name: Lane1 Tobosa actual single-fascicle macro (Dave Thayer permitted)
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane1_tobosa_dave_thayer_real_fascicle_20261027.py
      - .github/workflows/archive-lane1-tobosa-true-fascicle-dave-thayer-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-tobosa-dave-thayer-real-fascicle
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow beautifulsoup4
      - name: Validate author reuse permission source and install exact Tobosa fascicle image
        run: python scripts/archive_lane1_tobosa_dave_thayer_real_fascicle_20261027.py
      - name: Commit verified JPEG and source provenance without losing parallel edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Hilaria/hilaria-mutica/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: archive photographer-permitted real Tobosa single fascicle"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
