name: Install Bonariensis as Provisional Three-way Learner
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-hydrocotyle-bonariensis-add-20261020.yml"
      - "scripts/manual_hydrocotyle_bonariensis_install_20261020.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-one-species-bonariensis-learner-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Refresh source state before species installation
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Download and validate original CC-licensed image files and add species to manifest
        run: python scripts/manual_hydrocotyle_bonariensis_install_20261020.py
      - name: Verify all six real credited photos and county native HOLD
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('content/taxa/Araliaceae/Hydrocotyle/hydrocotyle-bonariensis')
          c=json.loads((p/'species.json').read_text())
          m=json.loads(Path('data/manifest.json').read_text())
          g=json.loads(Path('content/taxa/Araliaceae/Hydrocotyle/genus.json').read_text())
          assert len([x for x in m['species'] if x['id']=='hydrocotyle-bonariensis'])==1
          assert 'Hydrocotyle bonariensis' in g['species'] and 'three_species_field_key_20261020' in g
          assert len(c['images'])==6 and c['curation_status']['finished_field_id_pass']=='PASS_IN_PROGRESS'
          assert c['project_inclusion']['target_zone_status']=='UNRESOLVED' and c['project_inclusion']['native_metrics_excluded'] is True
          for z in c['images']:
            f=p/z['file']
            assert f.exists() and f.stat().st_size>26000
            assert z['license'] in {'CC BY','CC BY-SA','CC0'} and z['creator'] and z['source_page']
            with Image.open(f) as im:im.verify()
            print('VERIFIED',f,z['creator'],z['license'])
          print('Exact 6 physical photos and provisional science / county hold verified')
          PY
      - name: Commit only new species, manifest, shared Hydrocotyle comparison and install report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Araliaceae/Hydrocotyle/hydrocotyle-bonariensis/ content/taxa/Araliaceae/Hydrocotyle/genus.json data/manifest.json reports/hydrocotyle-bonariensis-photo-install-20261020.json
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "Install 6 CC-licensed bonariensis teaching photos and provisional three-way pennywort learner [skip ci]"
          for attempt in 1 2 3;do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            sleep 4
          done
          exit 1
