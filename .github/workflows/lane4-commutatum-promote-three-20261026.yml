name: Lane 4 promote three reviewed variable panicgrass photos
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_commutatum_promote_three_20261026.py
      - .github/workflows/lane4-commutatum-promote-three-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-commutatum-promotion
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Copy inspected SHA-verified botanical photos into canonical gallery
        run: python scripts/lane4_commutatum_promote_three_20261026.py
      - name: Commit species evidence without overriding concurrent editors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add content/taxa/Poaceae/Dichanthelium/dichanthelium-commutatum/ reports/lane4-commutatum-promote-three-20261026.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Lane 4 publish licensed commutatum live habit flowering and spikelet macros"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/lane4_commutatum_promote_three_20261026.py
          done
          exit 1
