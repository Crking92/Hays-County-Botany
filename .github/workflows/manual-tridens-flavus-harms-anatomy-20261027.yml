name: Archive real purpletop ligule, spikelet and flowering branch JPEGs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/manual-tridens-flavus-harms-anatomy-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-tridens-flavus-real-anatomy-20261027
  cancel-in-progress: false
jobs:
  archive-source-verified-purpletop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JPEG photo inspection dependencies
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12" "requests>=2.31,<3"
      - name: Refresh latest main and fetch only exact Bob Harms source originals
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/archive_tridens_flavus_harms_20261027.py
          python scripts/archive_tridens_flavus_harms_20261027.py
      - name: Check actual stored JPEGs and source rights/provenance
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          rpath=Path('reports/tridens-flavus-harms-three-originals-20261027.json')
          if not rpath.exists():
              print('No new JPEGs, no false publication result')
              raise SystemExit(0)
          r=json.loads(rpath.read_text())
          assert r['result']=='EXACT_REAL_ORIGINAL_PURPLETOP_PHOTOS_ARCHIVED'
          assert 1<=r['number']<=3
          sp=json.loads(Path('content/taxa/Poaceae/Tridens/tridens-flavus/species.json').read_text())
          gn=json.loads(Path('content/taxa/Poaceae/Tridens/genus.json').read_text())
          assert sp['id']=='tridens-flavus' and gn['name']=='Tridens'
          for photo in r['records']:
              path=Path(photo['path'])
              assert path.is_file() and path.stat().st_size>3000
              assert hashlib.sha256(path.read_bytes()).hexdigest()==photo['archived_sha256']
              with Image.open(path) as im:
                  assert im.format=='JPEG' and not im.getexif().get(34853)
                  im.verify()
              for doc in (sp,gn):
                  hits=[x for x in doc['visual_comparison']['items'] if x.get('source_photo_id')==photo['source_photo_id']]
                  assert len(hits)==1 and hits[0]['image_url']==str(path)
                  assert hits[0]['source_taxon_name']=='Tridens flavus'
                  assert hits[0]['creator']=='Bob Harms' and hits[0]['markers']==[]
              matching=[x for x in sp['images'] if x.get('source_photo_id')==photo['source_photo_id']]
              assert len(matching)==1 and matching[0]['site_specific_public_permission']=='BOB_HARMS_SELECTED_MONOCOTS_EDU_WITH_CREDIT_20261022'
              assert matching[0]['license'].endswith('(NOT Creative Commons)')
          print('PASS source-accurate non-GPS JPEGs, every exact author and gallery link, narrow site-specific license')
          PY
      - name: Commit verified source photos and publish only if pixels were stored
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Tridens/tridens-flavus/
          git add content/taxa/Poaceae/Tridens/genus.json
          if test -e reports/tridens-flavus-harms-three-originals-20261027.json; then
            git add reports/tridens-flavus-harms-three-originals-20261027.json
            git add workflow/field-id-publication/2026-10-27-tridens-flavus-real-harms-anatomy.json
          fi
          if test -e reports/tridens-flavus-harms-originals-source-hold-20261027.json; then
            git add reports/tridens-flavus-harms-originals-source-hold-20261027.json
          fi
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Archive original credited Bob Harms Tridens flavus collar and spikelet anatomy'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
