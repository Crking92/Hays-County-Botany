name: Install Glandularia pumila CC BY-SA Photo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-glandularia-pumila-public-face-20261020.yml"
      - "scripts/manual_glandularia_pumila_public_face_20261020.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: one-manual-glandularia-pumila-photo
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Read most recent canonical state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Install one exact-species credited Glandularia pumila photo
        run: python scripts/manual_glandularia_pumila_public_face_20261020.py
      - name: Validate four photos and rights, no false arrow claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base=Path("content/taxa/Verbenaceae/Glandularia/glandularia-pumila")
          j=json.loads((base/"species.json").read_text())
          assert j["scientific_name"]=="Glandularia pumila"
          assert j["project_inclusion"]["target_zone_status"]=="PASS"
          assert len(j["images"])==4
          assert len(j["comparisons"]["confused_with"])>=8
          face=j["images"][0]
          assert face["file"]=="images/plantnet-angela-pumila-face.jpg"
          assert face["license"]=="CC BY-SA 3.0"
          assert face["source_page"].startswith("https://identify.plantnet.org/")
          assert face["creator"].startswith("Angela")
          assert face["original_image_sha256"]
          assert j["images"][1]["license"]=="Owner-authorized private study"
          assert all(x["license"]=="CC BY" for x in j["images"][2:])
          for x in j["images"]:
            file=base/x["file"]
            assert file.exists() and file.stat().st_size>14000
            with Image.open(file) as im: im.verify()
          print("4 valid photos; original license restrictions retained; accepted native status retained")
          PY
      - name: Commit only species photo and review metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Verbenaceae/Glandularia/glandularia-pumila/ reports/glandularia-pumila-public-face-20261020.json
          if git diff --cached --quiet; then echo "Already installed"; exit 0; fi
          git commit -m "Install public CC BY-SA Glandularia pumila exact species image and credit [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
