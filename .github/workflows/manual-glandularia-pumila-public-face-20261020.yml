name: Install Glandularia pumila CC BY-SA Photo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-glandularia-pumila-public-face-20261020.yml"
      - "scripts/manual_glandularia_pumila_public_face_20261020.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: one-manual-glandularia-pumila-photo
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Read most recent canonical state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Install one exact-species credited Glandularia pumila photo
        run: python scripts/manual_glandularia_pumila_public_face_20261020.py
      - name: Validate four photos and rights, no false arrow claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base=Path("content/taxa/Verbenaceae/Glandularia/glandularia-pumila")
          j=json.loads((base/"species.json").read_text())
          assert j["scientific_name"]=="Glandularia pumila"
          assert j["project_inclusion"]["target_zone_status"]=="PASS"
          assert len(j["images"])==4
          assert len(j["comparisons"]["confused_with"])>=8
          face=j["images"][0]
          assert face["file"]=="images/plantnet-angela-pumila-face.jpg"
          assert face["license"]=="CC BY-SA 3.0"
          assert face["source_page"].startswith("https://identify.plantnet.org/")
          assert face["creator"].startswith("Angela")
          assert face["original_image_sha256"]
          assert j["images"][1]["license"]=="Owner-authorized private study"
          assert all(x["license"]=="CC BY" for x in j["images"][2:])
          for x in j["images"]:
            file=base/x["file"]
            assert file.exists() and file.stat().st_size>14000
            with Image.open(file) as im: im.verify()
          print("4 valid photos; original license restrictions retained; accepted native status retained")
          PY
      - name: Commit only species photo and review metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Verbenaceae/Glandularia/glandularia-pumila/ reports/glandularia-pumila-public-face-20261020.json
          if git diff --cached --quiet; then echo "Already installed"; exit 0; fi
          git commit -m "Install public CC BY-SA Glandularia pumila exact species image and credit [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1

      - name: Verify seven photo-specific arrows and revised genus comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("content/taxa/Verbenaceae/Glandularia/")
          j=json.loads((base/"glandularia-pumila/species.json").read_text())
          panel=j["visual_comparison"]["items"]
          assert len(j["images"])==4
          assert len(panel)==3
          assert sum(len(p["markers"]) for p in panel)==7
          assert len(j["field_photo_quickcheck"]["featured_photo_indices"])==3
          assert j["field_id_finalization"]["stage"]=="PASS_IN_PROGRESS"
          for item in panel:
            assert item["scientific_name"]=="Glandularia pumila"
            assert item["image_url"].startswith("content/taxa/Verbenaceae/Glandularia/glandularia-pumila/images/")
            assert Path(item["image_url"]).is_file()
            assert all(all(isinstance(m[k],(int,float)) and 0<=m[k]<=100 for k in
                   ("label_x","label_y","target_x","target_y")) for m in item["markers"])
          genus=json.loads((base/"genus.json").read_text())
          assert "glandularia-pumila/images/plantnet-angela-pumila-face.jpg" in genus["visual_comparison"]["items"][0]["image_url"]
          assert "glandularia-bipinnatifida/images/" in genus["visual_comparison"]["items"][1]["image_url"]
          assert Path("reports/glandularia-pumila-annotation-qa-20261020.json").is_file()
          print("PASS: three source-file-verified annotation views, seven targets, genus side-by-side pairing.")
          PY
      - name: Dispatch verified Glandularia pumila field guide to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Pages build requested for Glandularia pumila annotated species and genus pages."
