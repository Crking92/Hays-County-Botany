name: Lane 2 archive in-ground purple lovegrass crown JPEG
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_install_spectabilis_inground_20261026.py
      - .github/workflows/lane2-spectabilis-inground-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-spectabilis-inground-20261026
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify original Commons license, archive EXIF-free JPEG and update gross-organ lesson
        run: python scripts/lane2_install_spectabilis_inground_20261026.py
      - name: Save actual JPEG plus canonical gallery and audit evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-spectabilis/ reports/lane2-spectabilis-inground-crown-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 add purple lovegrass true in-ground crown photo with two evidence arrows"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
