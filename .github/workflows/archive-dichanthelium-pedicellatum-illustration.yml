name: Archive pedicellatum historical morphology
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_dichanthelium_pedicellatum_illustration.py
      - .github/workflows/archive-dichanthelium-pedicellatum-illustration.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-pedicellatum-historical
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_dichanthelium_pedicellatum_illustration.py
      - name: Commit accepted illustration and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Dichanthelium/dichanthelium-pedicellatum/ reports/dichanthelium-pedicellatum-illustration-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive public-domain rosette-grass botanical anatomy illustration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
