name: Archive actual seep muhly ligule spikelet and habitat originals
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/manual-seep-muhly-harms-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-reverchonii-real-anatomy-20261027
  cancel-in-progress: false
jobs:
  archive-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original source JPEG verification tools
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12"
      - name: Check latest species/head then archive only exact source originals
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/archive_muhlenbergia_reverchonii_harms_20261027.py
          python scripts/archive_muhlenbergia_reverchonii_harms_20261027.py
      - name: Validate authenticated source, JPEG bits, and both teaching galleries
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          rp=Path('reports/muhlenbergia-reverchonii-harms-anatomy-physical-20261027.json')
          if not rp.exists():
              print('NO_SOURCE_BYTES_ADDED; no release')
              raise SystemExit(0)
          r=json.loads(rp.read_text())
          assert r['result']=='EXACT_REAL_SEEP_MUHLY_SOURCE_JPEGS_ARCHIVED'
          assert 1<=r['photo_count_added']<=3
          s=json.loads(Path('content/taxa/Poaceae/Muhlenbergia/muhlenbergia-reverchonii/species.json').read_text())
          g=json.loads(Path('content/taxa/Poaceae/Muhlenbergia/genus.json').read_text())
          assert s['id']=='muhlenbergia-reverchonii'
          for rec in r['records']:
              p=Path(rec['path'])
              assert p.is_file() and p.stat().st_size>3000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['archived_sha256']
              with Image.open(p) as im:
                  assert im.format=='JPEG' and not im.getexif().get(34853)
                  im.verify()
              ids=[x for x in s['images'] if x.get('source_photo_id')==rec['photo_id']]
              assert len(ids)==1 and ids[0]['creator']=='Bob Harms'
              assert ids[0]['site_specific_public_permission']=='BOB_HARMS_SELECTED_MONOCOTS_EDU_WITH_CREDIT_20261022'
              for doc in (s,g):
                  matches=[x for x in doc['visual_comparison']['items'] if x.get('source_photo_id')==rec['photo_id']]
                  assert len(matches)==1 and matches[0]['image_url']==str(p)
                  assert matches[0]['source_taxon_name']=='Muhlenbergia reverchonii'
                  assert matches[0]['markers']==[]
          print('PASS: source-specific real anatomical JPEG bytes, author credit and both galleries')
          PY
      - name: Commit only image verified source photos, rights records and Pages release marker
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Muhlenbergia/muhlenbergia-reverchonii/
          git add content/taxa/Poaceae/Muhlenbergia/genus.json
          if test -e reports/muhlenbergia-reverchonii-harms-anatomy-physical-20261027.json; then
            git add reports/muhlenbergia-reverchonii-harms-anatomy-physical-20261027.json
            git add workflow/field-id-publication/2026-10-27-muhlenbergia-reverchonii-real-anatomy-photos.json
          fi
          if test -e reports/muhlenbergia-reverchonii-harms-photo-source-hold-20261027.json; then
            git add reports/muhlenbergia-reverchonii-harms-photo-source-hold-20261027.json
          fi
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Archive original Bob Harms seep muhly ligule and spikelet physical photographs with credit'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
