name: Archive Phragmites three-lineage photo candidates
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_phragmites_three_lineages_20261026.py
      - .github/workflows/archive-phragmites-three-lineages-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phragmites-three-lineage-photo-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify sources and download approved candidate JPEGs only
        run: python scripts/archive_phragmites_three_lineages_20261026.py
      - name: Commit only audited photo candidate bytes and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Phragmites/phragmites-australis/images/lineage-* reports/phragmites-three-lineage-photo-acquisition-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified Phragmites lineage photo candidates; hold public use for visual review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
