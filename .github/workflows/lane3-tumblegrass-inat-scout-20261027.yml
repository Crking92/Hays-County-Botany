name: Lane 3 Tumblegrass Licensed iNaturalist Anatomy Photo Scout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lane3-tumblegrass-inat-scout-20261027.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-tumblegrass-inat-photo-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Query exact source taxon and individual CC photo licenses
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python scripts/lane3_tumblegrass_inat_anatomy_scout_20261027.py
      - name: Validate source records and EXIF-free contact photo sheet
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          from PIL import Image
          root=pathlib.Path('reports/lane3-tumblegrass-inat-anatomy-scout-20261027')
          j=json.loads((root/'report.json').read_text())
          assert j['canonical_taxon']=='Muhlenbergia paniculata'
          assert j['taxon'] in ('Schedonnardus paniculatus','Muhlenbergia paniculata')
          assert j['contact_photos']>0 and j['no_gallery_update'] and j['no_new_photo_role_certification']
          assert all(x['license'] in ('cc0','cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa') for x in j['selected'])
          p=root/'contact.jpg'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==j['sha256']
          with Image.open(p) as im:
            assert im.format=='JPEG' and im.width>=1200 and not im.getexif().get(34853)
            im.verify()
          print('PASS: source-licensed contact, no anatomy role credited yet')
          PY
      - name: Save only research contact sheet and source IDs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/lane3-tumblegrass-inat-anatomy-scout-20261027/
          git diff --cached --quiet && exit 0
          git commit -m "Lane 3 stage individually source-licensed tumblegrass ligament spikelet contact sheet"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
