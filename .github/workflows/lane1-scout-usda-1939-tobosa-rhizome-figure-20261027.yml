name: Lane1 scout historic USDA Tobosa rhizome figure
on:
  push:
    branches: [main]
    paths:
      - scripts/lane1_scout_usda_canfield_tobosa_rhizome_fig9_20261027.py
      - .github/workflows/lane1-scout-usda-1939-tobosa-rhizome-figure-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/lane1_scout_usda_canfield_tobosa_rhizome_fig9_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyMuPDF
      - name: Check original federal photo plate and bibliographic PDF access; no upload
        run: python scripts/lane1_scout_usda_canfield_tobosa_rhizome_fig9_20261027.py
