name: Archive Chloris virgata ligule and spikelet photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_chloris_virgata_anatomy.py
      - .github/workflows/archive-chloris-virgata-anatomy.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chloris-virgata-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_chloris_virgata_anatomy.py
      - name: Commit verified archived image bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Chloris/chloris-virgata/ reports/chloris-virgata-anatomy-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive actual CC-licensed Chloris virgata ligule and spikelet photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
