name: Lane 2 install CC0 sand lovegrass growing bunch photo
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_archive_trichodes_dresden_bunch_20261026.py
      - .github/workflows/lane2-trichodes-dresden-bunch-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-trichodes-bunch-20261026
  cancel-in-progress: false
jobs:
  archive-and-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - name: Source-specific photo rights and EXIF-free local gallery installer
        run: python scripts/lane2_archive_trichodes_dresden_bunch_20261026.py
      - name: Commit physical photo plus rights and actual diagnostic captions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-trichodes/ reports/lane2-trichodes-in-ground-bunch-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive public-domain sand lovegrass growing bunch and crown arrow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
