name: Lane4 ciliaris habit original pixel preview QA
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_ciliaris_habit_preview_20261027.py
      - .github/workflows/lane4-ciliaris-licensed-habit-visual-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-ciliaris-habit-pixel-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/lane4_ciliaris_habit_preview_20261027.py
            content/taxa/Poaceae/Digitaria/digitaria-ciliaris/images/starr-140909-1746-live-habit-maui.jpg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python scripts/lane4_ciliaris_habit_preview_20261027.py
      - name: Store separate nonpublic image preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse reports/lane4-ciliaris-20261027-habit-qa-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Lane4 ciliaris inspect whole plant photo via non-public low-res QA proxy"
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 3
            done
            test "$pushed" = 1
          fi
