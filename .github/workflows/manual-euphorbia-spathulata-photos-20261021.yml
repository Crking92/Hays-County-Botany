name: Install inspected warty spurge anatomy photos once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-spathulata-photos-20261021.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-euphorbia-spathulata-anatomy-intake
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests
      - name: Read latest canonical species data before photo intake
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Verify rights, exact species and physical photo files
        run: python scripts/manual_euphorbia_spathulata_photos_20261021.py
      - name: Validate downloaded metadata, image bytes and annotation claims
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          base=Path("content/taxa/Euphorbiaceae/Euphorbia/euphorbia-spathulata")
          j=json.loads((base/"species.json").read_text())
          assert j["scientific_name"]=="Euphorbia spathulata"
          ids=set()
          for x in j["images"]:
              fn=x["file"]
              assert fn not in ids
              ids.add(fn)
              p=base/fn
              assert p.exists() and p.stat().st_size>10000
              with Image.open(p) as im: im.verify()
              assert x.get("creator") and x.get("license")
              if "nathan-15653221" in fn:
                  assert x.get("photo_id")==15653221
                  assert x.get("observation_id")==11085572
                  assert x["license_url"].startswith("https://creativecommons.org/")
                  assert x.get("anatomy_arrows")==[]
              if "max-licher-uaz" in fn:
                  assert x.get("license")=="CC BY-SA 4.0"
                  assert x.get("anatomy_arrows")==[]
          print("Physical + rights file QA OK",len(ids))
          PY
      - name: Commit validated source images without overwriting other work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Euphorbiaceae/Euphorbia/euphorbia-spathulata/ reports/euphorbia-spathulata-diagnostic-photo-intake-20261021.json
          if git diff --cached --quiet; then echo "Idempotent—no newly eligible photo"; exit 0; fi
          git commit -m "Install exact-name licensed warty spurge capsule and bract photos"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            sleep 4
          done
          exit 1
