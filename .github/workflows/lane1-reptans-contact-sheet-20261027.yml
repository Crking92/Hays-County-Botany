name: Lane 1 Rungrass reptans seven real-photo anatomy contact sheet
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lane1-reptans-contact-sheet-20261027.yml'
      - 'scripts/lane1_reptans_rungrass_contact_sheet_20261027.py'
permissions:
  contents: read
jobs:
  contact-sheet-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python scripts/lane1_reptans_rungrass_contact_sheet_20261027.py
