name: Lane1 blue grama genuine anthers CC BY-SA macro
on:
  push:
    branches: [main]
    paths:
      - scripts/lane1_archive_blue_grama_actual_anthers_matt_lavin_20261027.py
      - .github/workflows/lane1-blue-grama-actual-flowering-anthers-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-blue-grama-real-anthers-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane1_archive_blue_grama_actual_anthers_matt_lavin_20261027.py
            content/taxa/Poaceae/Bouteloua/bouteloua-gracilis/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive original genuine flower staminal anthers and preserve CC BY-SA source
        run: python scripts/lane1_archive_blue_grama_actual_anthers_matt_lavin_20261027.py
      - name: Publish actual photo and anatomy photo teaching overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Bouteloua/bouteloua-gracilis/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: blue grama original real anthers flowering macro and overlays"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
