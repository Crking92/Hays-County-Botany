name: Archive tumblegrass reproductive photo
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_muhlenbergia_paniculata_synonym.py
      - .github/workflows/archive-muhlenbergia-paniculata-synonym.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-muhlenbergia-paniculata-synonym
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_muhlenbergia_paniculata_synonym.py
      - name: Commit permitted photograph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Muhlenbergia/muhlenbergia-paniculata/ reports/muhlenbergia-paniculata-synonym-photo.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive licensed Muhlenbergia paniculata inflorescence photograph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
