name: Lane 3 audit rice cutgrass leaf margin licensed sources
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lane3-leersia-leafmargin-source-audit-20261024.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/lane3_leersia_leafmargin_source_audit_20261024.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-leersia-leafmargin-source-audit-20261024.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 3 discover exact licensed leaf-edge macro candidates"
            pushed=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 3
            done
            test "$pushed" = "1"
          fi
