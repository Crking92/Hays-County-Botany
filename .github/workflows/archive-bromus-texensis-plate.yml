name: Archive Texas brome illustration
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_bromus_texensis_plate.py
      - .github/workflows/archive-bromus-texensis-plate.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-bromus-texensis-plate
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_bromus_texensis_plate.py
      - name: Commit rights-cleared source plate and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Bromus/bromus-texensis/ reports/bromus-texensis-plate-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Texas brome botanical plate with source credit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
