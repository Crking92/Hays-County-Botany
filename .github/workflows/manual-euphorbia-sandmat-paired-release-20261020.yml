name: Release Euphorbia prostrata versus serpens field ID
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-sandmat-paired-release-20261020.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: one-euphorbia-sandmat-pair-release
  cancel-in-progress: false
jobs:
  qa-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm both real-photo species keys, public licensing, and holds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("content/taxa/Euphorbiaceae/Euphorbia")
          record=json.loads(Path("reports/euphorbia-prostrata-serpens-annotated-qa-20261020.json").read_text())
          assert len(record["species"])==2
          for slug,expected_images in [("euphorbia-prostrata",4),("euphorbia-serpens",5)]:
            j=json.loads((root/slug/"species.json").read_text())
            assert j["scientific_name"]=="Euphorbia "+slug.split("-")[-1]
            assert j["native_metrics_excluded"] is True
            assert j["project_inclusion"]["target_zone_status"]=="PROVISIONAL"
            assert j["field_id_finalization"]["stage"]=="PASS_IN_PROGRESS"
            assert len(j["images"])==expected_images
            assert len(j["visual_comparison"]["items"])==4
            assert len(j["field_photo_quickcheck"]["featured_photo_indices"])==3
            assert len(j["comparisons"]["confused_with"])>=4
            assert sum(len(x["markers"]) for x in j["visual_comparison"]["items"])==8
            for item in j["visual_comparison"]["items"]:
              f=Path(item["image_url"])
              assert f.is_file() and f.stat().st_size>12000,f
              assert item["source_page"] and item["creator"] and item["license"]
              assert item["license"] in ("CC BY 2.0","CC BY-SA 4.0")
              for m in item["markers"]:
                assert m["label"]
                assert all(0<=float(m[k])<=100 for k in ("label_x","label_y","target_x","target_y"))
          p=json.loads((root/"euphorbia-prostrata/species.json").read_text())
          s=json.loads((root/"euphorbia-serpens/species.json").read_text())
          assert len(s["images"][4]["file"]) and s["images"][4]["license"]=="CC BY-NC-SA"
          assert s["images"][4]["public_reuse"]=="no"
          assert "NOT" in s["images"][0]["role"] or "NOT" in s["photo_note"]
          genus=json.loads((root/"genus.json").read_text())
          pair=next(x for x in genus["comparison_cards"] if x["id"]=="euphorbia-sandmat-group")
          assert len(pair["photo_pair_targets"])==4
          panels=[i for i in genus["visual_comparison"]["items"] if i["scientific_name"] in ("Euphorbia prostrata","Euphorbia serpens")]
          assert len(panels)==8
          assert all(Path(x["image_url"]).is_file() for x in panels)
          assert not any(x["image_url"].endswith("/05-node-rooting.jpg") for x in panels)
          script=Path("scripts/stage_public_euphorbia_serpens_20261020.py")
          assert script.is_file()
          pages=Path(".github/workflows/deploy-github-pages-learner.yml").read_text()
          assert "stage_public_euphorbia_serpens_20261020.py --site-dir dist" in pages
          print("PASS: 2 species, 8 verified real photos, 16 arrows; restricted root photo remains source-only, range holds preserved.")
          PY
      - name: Trigger GitHub Pages licensed-only release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
