name: Archive original CC0 Texas tridens ligule and habitat photographs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/manual-tridens-texanus-cc0-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-tridens-texanus-original-cc0-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JPEG verification tools
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3" "Pillow>=10,<12"
      - name: Refresh main and archive exact Commons CC0 source photos
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/archive_tridens_texanus_cc0_20261027.py
          python scripts/archive_tridens_texanus_cc0_20261027.py
      - name: Independently verify physical JPEGs, provenance and genus/gallery links
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          rp=Path('reports/tridens-texanus-commons-cc0-physical-20261027.json')
          if not rp.exists():
              print('No new actual source JPEGs added')
              raise SystemExit(0)
          report=json.loads(rp.read_text())
          assert report['result']=='EXACT_TRIDENS_TEXANUS_CC0_SOURCE_PHOTOS_ARCHIVED'
          assert 1<=report['count']<=2
          s=json.loads(Path('content/taxa/Poaceae/Tridens/tridens-texanus/species.json').read_text())
          g=json.loads(Path('content/taxa/Poaceae/Tridens/genus.json').read_text())
          assert s['id']=='tridens-texanus' and g['name']=='Tridens'
          for entry in report['photos']:
              f=Path(entry['file'])
              assert f.is_file() and f.stat().st_size>2500
              assert hashlib.sha256(f.read_bytes()).hexdigest()==entry['archive_sha256']
              with Image.open(f) as im:
                  assert im.format=='JPEG' and not im.getexif().get(34853)
                  im.verify()
              row=[x for x in s['images'] if x.get('source_page')==entry['source_page']]
              assert len(row)==1 and row[0]['file']=='images/'+f.name
              assert row[0]['creator']=='Gaiacoyote' and row[0]['license']=='CC0 1.0'
              for d in (s,g):
                  panel=[x for x in d['visual_comparison']['items'] if x.get('source_page')==entry['source_page']]
                  assert len(panel)==1 and panel[0]['image_url']==str(f)
                  assert panel[0]['markers']==[]
          print('PASS: two original same-taxon CC0 files, stripped GPS, local gallery and genus references')
          PY
      - name: Commit only verified original photographs and publication marker
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Tridens/tridens-texanus/
          git add content/taxa/Poaceae/Tridens/genus.json
          if test -e reports/tridens-texanus-commons-cc0-physical-20261027.json; then
            git add reports/tridens-texanus-commons-cc0-physical-20261027.json
            git add workflow/field-id-publication/2026-10-27-tridens-texanus-cc0-collar-and-habitat.json
          fi
          if test -e reports/tridens-texanus-commons-cc0-hold-20261027.json; then
            git add reports/tridens-texanus-commons-cc0-hold-20261027.json
          fi
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Archive genuine CC0 Texas tridens leaf collar and habitat photos'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
