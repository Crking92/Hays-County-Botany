name: Euphorbia dentata photo-safe field lesson
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-dentata-finished-pass-20261020.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: dentata-safe-release
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check scientific holds and photo evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("content/taxa/Euphorbiaceae/Euphorbia/euphorbia-dentata")
          j=json.loads((base/"species.json").read_text())
          assert j["scientific_name"]=="Euphorbia dentata"
          assert j["project_inclusion"]["target_zone_status"]=="PASS"
          assert j["field_id_finalization"]["stage"]=="PASS_IN_PROGRESS"
          assert len(j["images"])==5 and len(j["visual_comparison"]["items"])==4
          assert sum(len(x["markers"]) for x in j["visual_comparison"]["items"])==8
          for p in j["visual_comparison"]["items"]:
            assert Path(p["image_url"]).is_file()
            assert p["creator"] and p["source_page"]
            assert p["license"] in ("CC BY-SA","CC BY 2.0")
          assert all("copyrighted" in x["license"] for x in j["images"][3:])
          report=json.loads(Path("reports/euphorbia-dentata-field-id-20261020.json").read_text())
          assert report["verified_arrows"]==8
          assert len(report["restricted_existing_photo_holds"])==2
          assert Path("scripts/stage_public_euphorbia_dentata_20261020.py").is_file()
          print("PASS: source verified 8 arrows, 2 research-only photographs held")
          PY
      - name: Publish verified, licensed public copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
