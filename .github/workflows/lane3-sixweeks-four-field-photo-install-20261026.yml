name: Lane 3 install source-licensed sixweeks fescue living and spikelet photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-sixweeks-four-field-photo-install-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-sixweeks-four-real
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Get latest canonical species and preserve concurrent changes
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Archive four exact source and rights verified photographs
        run: python scripts/lane3_install_festuca_octoflora_four_20261026.py
      - name: Check actual JPEG files gallery local links and science copyright holds
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          a=json.loads(pathlib.Path('reports/lane3-festuca-octoflora-four-installed-20261026.json').read_text())
          d=json.loads(pathlib.Path('content/taxa/Poaceae/Festuca/festuca-octoflora/species.json').read_text())
          assert a['result']=='FOUR_REAL_SIXWEEKS_CC_BY_PHOTOS_INSTALLED'
          assert d['id']=='festuca-octoflora' and len(d['images'])==7
          assert len(d['visual_comparison']['items'])==10 and len(a['photos'])==4
          assert d['images'][0]['license']=='CC BY-NC'
          assert sum(p['creator']=='Bob Harms' for p in d['visual_comparison']['items'])==2
          assert d['curation_status']['visual_finish']=='FIELD_READY_PHOTO_GAPS'
          for x in a['photos']:
            p=pathlib.Path(x['file'])
            assert p.is_file() and p.stat().st_size>25000
            assert hashlib.sha256(p.read_bytes()).hexdigest()==x['archived_sha256']
            with Image.open(p) as im:
              assert im.format=='JPEG' and not im.getexif().get(34853)
              im.verify()
            assert any(z.get('image_url')==str(p) and z.get('markers')==[] and z.get('license')=='CC BY' for z in d['visual_comparison']['items'])
          print('PASS 4 licensed exact-source local JPEGs, file integrity, old NC/SA/Harms rights, no uninspected arrows')
          PY
      - name: Commit source-backed photos and species card; rebase on concurrent workers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-festuca-octoflora-four-installed-20261026.json content/taxa/Poaceae/Festuca/festuca-octoflora/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lane 3 physically archive four licensed sixweeks grass basal and awn photos"
          for n in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
