name: Lane 2 public Canada wildrye closeup
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_install_canada_public_glume_20261024.py
      - .github/workflows/lane2-canada-wildrye-closeup-20261024.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-canada-public-closeup
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/lane2_install_canada_public_glume_20261024.py
      - name: Commit licensed JPEG and local gallery panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Elymus/elymus-canadensis/ reports/lane2-canada-wildrye-public-glume-20261024.json
          if ! git diff --cached --quiet; then
            git commit -m "Install Matt Lavin CC BY-SA Canada wildrye glume closeup in public learner"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
