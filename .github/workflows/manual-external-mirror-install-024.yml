name: Install Historic Muhlenbergia Plate 024
on:
  push:
    paths:
      - .github/workflows/manual-external-mirror-install-024.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-external-mirror-install-024
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Match individual reviewed photo pixels, preserve scientific metadata and CC BY-NC rights
        run: python scripts/manual_external_mirror_install_024.py
      - name: Verify full-size historic plate and multi-species source warning
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          from PIL import Image
          r=json.loads(pathlib.Path("reports/manual-external-mirror-install-024-20261016.json").read_text())
          assert r["science_unchanged"] and not r["living_plant_photo_installed"]
          for a in r["installed"]:
            fp=pathlib.Path(a["photo_file"])
            assert fp.is_file() and hashlib.sha256(fp.read_bytes()).hexdigest()==a["sha256"]
            with Image.open(fp) as im:
              im.verify()
            s=json.loads((fp.parent.parent/"species.json").read_text())
            rec=[x for x in s["images"] if x.get("file")=="images/"+fp.name]
            assert len(rec)==1 and rec[0]["license"]=="Public Domain Mark 1.0"
            assert "MULTI-TAXON" in rec[0]["role"] and "NEEDS_REAL_PHOTOS" in rec[0]["learner_visual_status"]
            print("VERIFIED interim illustration",a["id"])
          PY

      - name: Commit image and original attribution without changing taxon science
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/ reports/manual-external-mirror-install-024-20261016.json reports/photo-coverage-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve licensed Amphiachyris study photo locally [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i*4))
          done
          exit 1
