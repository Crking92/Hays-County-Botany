name: Verify final grass photo gallery sources
on:
  push:
    branches: [main]
    paths:
      - scripts/verify_final_grass_images.py
      - .github/workflows/verify-final-grass-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit all canonical grass images and credits
        run: python scripts/verify_final_grass_images.py
      - name: Save audit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/grass-image-final-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Report current grass image archives and attribution gaps"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
