name: Archive USGS red lovegrass images
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_eragrostis_secundiflora_usgs_20261023.py
      - .github/workflows/archive-eragrostis-secundiflora-usgs.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-eragrostis-secundiflora-usgs
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_eragrostis_secundiflora_usgs_20261023.py
      - name: Commit accepted images and audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-secundiflora/ reports/eragrostis-secundiflora-usgs-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive source-verified USGS red lovegrass photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
