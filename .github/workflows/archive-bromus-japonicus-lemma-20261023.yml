name: Archive Japanese brome lemma close-up
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_bromus_japonicus_lemma_20261023.py
      - .github/workflows/archive-bromus-japonicus-lemma-20261023.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-bromus-japonicus-lemma-20261023
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_bromus_japonicus_lemma_20261023.py
      - name: Commit only when actual photo bytes have been archived
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Bromus/bromus-japonicus/ reports/bromus-japonicus-lemma-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive CC BY-SA Japanese brome lemma close-up or precise hold"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
