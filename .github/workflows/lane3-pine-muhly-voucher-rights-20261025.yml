name: Lane 3 verify pine muhly Smithsonian specimen photo reuse
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lane3-pine-muhly-voucher-rights-20261025.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/lane3_pine_muhly_voucher_rights_20261025.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-pine-muhly-voucher-rights-20261025.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 3 source-voucher and explicit photo rights audit for pine muhly"
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 3
            done
            test "$pushed" = "1"
          fi
