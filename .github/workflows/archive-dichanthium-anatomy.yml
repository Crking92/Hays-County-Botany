name: Archive Dichanthium anatomy
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_dichanthium_anatomy.py
      - .github/workflows/archive-dichanthium-anatomy.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-dichanthium-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_dichanthium_anatomy.py
      - name: Commit credited diagnostic photographs and holds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Dichanthium/ reports/dichanthium-anatomy-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Dichanthium collar, node and spikelet photo macros"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
