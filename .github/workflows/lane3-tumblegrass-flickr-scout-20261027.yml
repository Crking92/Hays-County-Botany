name: Lane 3 Tumblegrass Source Photo License and Anatomy Scout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lane3-tumblegrass-flickr-scout-20261027.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-tumblegrass-source-scout
  cancel-in-progress: false
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Scan genuine licensed source pixels only for diagnostic contact
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python scripts/lane3_tumblegrass_flickr_diagnostic_scout_20261027.py
      - name: Validate contact source photo license IDs and JPEG integrity
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          from PIL import Image
          p=pathlib.Path('reports/lane3-tumblegrass-flickr-scout-20261027')
          a=json.loads((p/'report.json').read_text())
          assert a['status']=='PREPUBLICATION_LICENSED_CONTACT_ONLY_NOT_CANONICAL_EVIDENCE'
          assert a['licensed_photo_sources']>0
          assert all(x['license']=='CC BY-SA 2.0' and x['creator']=='Matt Lavin' and str(x['id']) in x['page'] for x in a['sources'])
          f=p/'contact.jpg'
          assert hashlib.sha256(f.read_bytes()).hexdigest()==a['sha256']
          with Image.open(f) as im:
            assert im.format=='JPEG' and im.width>=1000 and not im.getexif().get(34853)
            im.verify()
          print('PASS: verified licensed source-photo contact, no species card edits')
          PY
      - name: Preserve review evidence, not gallery changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/lane3-tumblegrass-flickr-scout-20261027/
          git diff --cached --quiet && exit 0
          git commit -m "Lane 3 archive tumblegrass licensed macro candidate photo contact sheet"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
