name: Archive Lindheimer rosette grass illustration
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_dichanthelium_lindheimeri_illustration.py
      - .github/workflows/archive-dichanthelium-lindheimeri-illustration.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-lindheimer-rosette-illustration
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_dichanthelium_lindheimeri_illustration.py
      - name: Commit verified archival image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Dichanthelium/dichanthelium-lindheimeri/ reports/dichanthelium-lindheimeri-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive historical Lindheimer rosette-grass morphological reference"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
