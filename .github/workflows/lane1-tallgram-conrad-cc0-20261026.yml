name: Lane 1 Tall Grama Jim Conrad Uvalde CC0 photo finish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lane1-tallgram-conrad-cc0-20261026.yml'
permissions:
  contents: write
concurrency:
  group: lane1-tallgram-uvalde-cc0-archive
  cancel-in-progress: false
jobs:
  archive-habit-and-pointed-raceme:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo decoder
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Validate original CC0 source page and archive exact Uvalde JPEGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/archive_lane1_tallgram_conrad_cc0_20261026.py
