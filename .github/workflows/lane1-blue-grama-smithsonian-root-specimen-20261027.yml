name: Lane1 real blue grama Smithsonian rooted specimen public-domain
on:
  push:
    branches: [main]
    paths:
      - scripts/lane1_archive_blue_grama_smithsonian_roots_20261027.py
      - .github/workflows/lane1-blue-grama-smithsonian-root-specimen-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-blue-grama-smithsonian-roots
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane1_archive_blue_grama_smithsonian_roots_20261027.py
            content/taxa/Poaceae/Bouteloua/bouteloua-gracilis/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow beautifulsoup4
      - name: Verify exact Smithsonian object public domain and real attached plant roots
        run: python scripts/lane1_archive_blue_grama_smithsonian_roots_20261027.py
      - name: Commit real photographed blue grama connected roots with source credit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Bouteloua/bouteloua-gracilis/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: archive real Smithsonian public-domain blue grama rooted specimen"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
