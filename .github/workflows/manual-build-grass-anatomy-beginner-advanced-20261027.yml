name: Create Grass Anatomy Beginner-to-Advanced Crew PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-build-grass-anatomy-beginner-advanced-20261027.yml'
      - 'scripts/build_grass_anatomy_beginner_advanced_20261027.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grass-anatomy-crew-guide-pdf-20261027
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/build_grass_anatomy_beginner_advanced_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and image libraries
        run: python -m pip install --disable-pip-version-check 'reportlab>=4,<5' 'Pillow>=10,<12' 'cairosvg>=2.7,<3'
      - name: Build fully illustrated new crew guide from licensed published diagrams
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_grass_anatomy_beginner_advanced_20261027.py
