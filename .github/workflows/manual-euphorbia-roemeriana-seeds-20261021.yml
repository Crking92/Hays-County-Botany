name: Verify and install Roemer's spurge seed micro photographs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-roemeriana-seeds-20261021.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-roemeriana-nathan-seed-intake
  cancel-in-progress: false
jobs:
  seed-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests
      - name: Refresh current taxon card and photo source state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Verify exact observation and individual CC licenses, save image files
        run: python scripts/manual_euphorbia_roemeriana_nathan_seed_20261021.py
      - name: Validate new files and preserve existing annotations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          base=Path("content/taxa/Euphorbiaceae/Euphorbia/euphorbia-roemeriana")
          d=json.loads((base/"species.json").read_text())
          assert d["scientific_name"]=="Euphorbia roemeriana"
          assert len(d["images"])>=5
          assert len(d["images"][0].get("anatomy_arrows",[]))==3
          for x in d["images"]:
              p=base/x["file"]
              assert p.is_file() and p.stat().st_size>10000
              with Image.open(p) as im: im.verify()
          for x in d["images"]:
              if not x["file"].startswith("images/nathan-roemeriana-seed-"):continue
              assert x["photo_id"] in (34980028,34980021)
              assert x["observation_id"]==22577311
              assert x["creator"] and x["license_url"].startswith("https://creativecommons.org/")
              assert x["public_reuse"]=="yes"
              assert x["anatomy_arrows"]==[]
          report=json.loads(Path("reports/euphorbia-roemeriana-nathan-seed-source-20261021.json").read_text())
          assert report["taxon"]=="Euphorbia roemeriana"
          print("Verified canonical source and up to two individually licensed, real, exact-species seed JPEGs.")
          PY
      - name: Save actual seed photo binaries and source record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Euphorbiaceae/Euphorbia/euphorbia-roemeriana/ reports/euphorbia-roemeriana-nathan-seed-source-20261021.json
          if git diff --cached --quiet; then echo "No new seed images passed source rights QA."; exit 0; fi
          git commit -m "Store photo-licensed Roemer's spurge true seed micro views with source QA"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
