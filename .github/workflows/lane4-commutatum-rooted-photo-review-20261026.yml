name: Lane 4 variable panicgrass root and collar source screen
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_commutatum_rooted_photo_review_20261026.py
      - .github/workflows/lane4-commutatum-rooted-photo-review-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-commutatum-rooted-source-screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify image-level rights, archive candidates for visual review only
        run: python scripts/lane4_commutatum_rooted_photo_review_20261026.py
      - name: Commit source-screen originals safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add workflow/photo-reviews/lane4-commutatum-rooted-20261026/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Lane 4 stage licensed variable panicgrass rooted and collar photo candidates"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/lane4_commutatum_rooted_photo_review_20261026.py
          done
          exit 1
