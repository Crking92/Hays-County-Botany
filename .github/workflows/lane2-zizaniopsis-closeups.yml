name: Lane 2 giant cutgrass close photo review
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_zizaniopsis_review_closeups.py
      - .github/workflows/lane2-zizaniopsis-closeups.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-zizaniopsis-closeups
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/lane2_zizaniopsis_review_closeups.py
      - name: Commit verified-license review candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Zizaniopsis/zizaniopsis-miliacea/ reports/lane2-zizaniopsis-close-detail-photo-review-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive candidate giant cutgrass photos for real anatomy review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
