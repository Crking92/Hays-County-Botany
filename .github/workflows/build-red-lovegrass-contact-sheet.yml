name: Build red lovegrass diagnostic contact sheet
on:
  push:
    branches: [main]
    paths:
      - scripts/build_red_lovegrass_commons_contact_sheet.py
      - .github/workflows/build-red-lovegrass-contact-sheet.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: red-lovegrass-contact-sheet
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/build_red_lovegrass_commons_contact_sheet.py
      - name: Commit review sheet and source audit (not species gallery)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/red-lovegrass-photo-review/
          if ! git diff --cached --quiet; then
            git commit -m "Store credited eight-image red lovegrass review sheet"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
