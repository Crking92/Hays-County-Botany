name: Audit public learner photo gaps (read-only source)

# One-off/on-demand analysis; not a sixth ChatGPT automation and NOT a Pages deployment.
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_public_photo_gaps.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hays-public-photo-gap-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest canonical source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Examine every canonical image record without altering it
        run: python scripts/audit_public_photo_gaps.py
      - name: Verify report exists and contains exact held species
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/public-photo-gaps-latest.json')
          d = json.loads(p.read_text())
          assert d['canonical_species'] >= 1000
          assert d['counts']['cards_without_public_photos'] == len(d['cards_without_public_photos'])
          assert Path('reports/public-photo-gaps-latest.md').is_file()
          print(f"Species checked: {d['canonical_species']}; needs public photo: {len(d['cards_without_public_photos'])}")
          PY
      - name: Commit only audit report, never photo/source edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hays Botany public photo audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/public-photo-gaps-latest.json reports/public-photo-gaps-latest.md
          if git diff --cached --quiet; then
            echo "Report already current"
          else
            git commit -m "Audit: identify canonical species lacking deployable public images [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
