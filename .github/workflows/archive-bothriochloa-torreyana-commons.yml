name: Archive silver bluestem source photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_bothriochloa_torreyana_commons.py
      - .github/workflows/archive-bothriochloa-torreyana-commons.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bothriochloa-torreyana-commons
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_bothriochloa_torreyana_commons.py
      - name: Save verified images and gallery metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Bothriochloa/bothriochloa-torreyana/ reports/bothriochloa-torreyana-anatomy-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive silver bluestem licensed Commons photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
