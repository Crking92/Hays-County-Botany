name: Lane 4 archive Dallisgrass diagnostic photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_paspalum_dilatatum_anatomy_archive.py
      - .github/workflows/lane4-paspalum-dilatatum-anatomy.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-paspalum-dilatatum
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane4_paspalum_dilatatum_anatomy_archive.py
      - name: Commit source-verified media and gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Paspalum/paspalum-dilatatum/ reports/lane4-paspalum-dilatatum-anatomy-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 4 archive licensed Dallisgrass ligule and hairy spikelet views"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
