name: Install Prairie Verbena Public-Safe Diagnostic Photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-glandularia-bipinnatifida-public-photos-20261020.yml"
      - "scripts/manual_glandularia_bipinnatifida_public_photos_20261020.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: one-glandularia-bipinnatifida-public-photo-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests
      - run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Download source-licensed prairie verbena originals
        run: python scripts/manual_glandularia_bipinnatifida_public_photos_20261020.py
      - name: Validate 10-source mixed existing gallery, 5 public photo files, no invented arrows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base=Path("content/taxa/Verbenaceae/Glandularia/glandularia-bipinnatifida")
          j=json.loads((base/"species.json").read_text())
          assert j["scientific_name"]=="Glandularia bipinnatifida"
          assert j["project_inclusion"]["target_zone_status"]=="PASS"
          assert len(j["images"])==10
          assert len(j["comparisons"]["confused_with"])>=7
          assert j["field_id_finalization"]["stage"]=="PASS_IN_PROGRESS"
          subset=[x for x in j["images"] if x["file"].startswith("images/commons-")]
          assert len(subset)==5
          assert len({x["file"] for x in j["images"]})==10
          assert j["curation_status"]["photo_files_present"]>=9
          for item in subset:
            assert item["license"] in ("Public Domain","CC BY","CC BY-SA")
            assert item["creator"] and item["source_page"] and item["license_url"]
            assert item["anatomy_arrows"].startswith("none")
            img=base/item["file"]
            assert img.exists() and img.stat().st_size>19000
            with Image.open(img) as p:p.verify()
          assert len([x for x in j["images"] if x.get("license")=="CC BY-NC"])==3
          assert any(x.get("license")=="Owner-authorized private study" for x in j["images"])
          print("PASS: 5 physically decoded public-safe photos; 7 comparisons; rights retained; no false anatomy arrows")
          PY
      - name: Commit botanical photo files, source citations and review report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Verbenaceae/Glandularia/glandularia-bipinnatifida/ reports/glandularia-bipinnatifida-public-photos-20261020.json
          if git diff --cached --quiet; then echo "Already installed"; exit 0; fi
          git commit -m "Install five verified-source public reusable prairie verbena photos, retain existing photo holds"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Prairie verbena public-source photo gallery installed"
              exit 0
            fi
            sleep 4
          done
          exit 1
      - name: Publish verified updated learner to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Requested public Visual Learner GitHub Pages update."
