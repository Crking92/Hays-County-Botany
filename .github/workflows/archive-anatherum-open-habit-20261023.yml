name: Archive open-license Anatherum historic-name habit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-anatherum-open-habit-20261023.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anatherum-historic-name-photo
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify original licensing and archive exact photo
        run: python scripts/archive_anatherum_tenuispatheum_open_habit_20261023.py
      - name: Commit files with provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Anatherum/anatherum-tenuispatheum/ reports/anatherum-open-habit-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive licensed Anatherum tenuispatheum historical-synonym habit photo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
