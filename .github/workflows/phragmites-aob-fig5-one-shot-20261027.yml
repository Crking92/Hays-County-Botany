name: Phragmites AoB CC BY Fig 5 one-time gallery installation
on:
  push:
    branches: [main]
    paths:
      - "workflow/phragmites-photo-review/20261027-aob-fig5-request.json"
permissions:
  contents: write
concurrency:
  group: phragmites-aob-fig5-one-shot
  cancel-in-progress: false
jobs:
  source-verified-install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF and image validation
        run: python -m pip install 'PyMuPDF>=1.24,<1.27' 'Pillow>=10,<12'
      - name: Archive Figure 5 only if article CC BY and source pixels are verified
        run: python scripts/promote_phragmites_aob_fig5_20261027.py
      - name: Commit actual gallery bytes or rights/source hold receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/phragmites-aob-fig5-archive-20261027.json
          git add content/taxa/Poaceae/Phragmites/phragmites-australis/species.json
          if test -f content/taxa/Poaceae/Phragmites/phragmites-australis/images/aobplants-2012-fig5-hood-gulf-berlandieri-introduced-comparison.jpg; then
            git add content/taxa/Poaceae/Phragmites/phragmites-australis/images/aobplants-2012-fig5-hood-gulf-berlandieri-introduced-comparison.jpg
          fi
          if git diff --cached --quiet; then
            echo 'No change to source state'
            exit 0
          fi
          git commit -m 'Phragmites: archive CC BY Gulf study Figure 5 or source hold'
          git pull --rebase origin main
          git push origin HEAD:main
