name: Scout licensed original Ozarkgrass reproductive closeups
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-limnodea-inat-macro-scout-20261023.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query public iNaturalist taxon 223773 with source and photo licenses
        run: |
          python -m pip install 'requests>=2.31,<3'
          python scripts/scout_limnodea_inat_micro_photos_20261023.py
      - name: Preserve candidate photo URLs and licenses, no public image install
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/limnodea-inat-potential-fine-macro-scout-20261023.json
          git commit -m 'Document license-tagged Ozarkgrass macro candidate source observations [skip ci]'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
