name: Physically archive five original Central Texas Virginia wildrye photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-elymus-virginicus-five-harms-20261023.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-elvi3-five-exact-sources-20261023
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original photo forensic libraries and test source scripts
        run: |
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
          python -m py_compile scripts/archive_elymus_virginicus_five_harms_20261023.py scripts/build_public_pages_snapshot.py scripts/public_photo_rights_preflight.py
      - name: Archive originals, verify species and preserve licensed authorship and pixel dimensions
        run: python scripts/archive_elymus_virginicus_five_harms_20261023.py
      - name: Verify site legal filters and 5 genuine original JPEGs
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,'scripts')
          from build_public_pages_snapshot import rights
          from public_photo_rights_preflight import photo_rights
          p=Path('content/taxa/Poaceae/Elymus/elymus-virginicus/species.json')
          g=Path('content/taxa/Poaceae/Elymus/genus.json')
          rpt=Path('reports/elymus-virginicus-five-harms-central-texas-originals-20261023.json')
          s=json.loads(p.read_text());genus=json.loads(g.read_text());r=json.loads(rpt.read_text())
          assert s['id']=='elymus-virginicus' and r['physical_new']==5
          assert len(s['images'])==7 and s['curation_status']['photo_files_present']==7
          assert len(s['visual_comparison']['items'])==10 and len(genus['visual_comparison']['items'])==19
          assert s['curation_status']['range_reviewed']==False
          assert 'FIELD_READY_PHOTO_GAPS' in s['field_id_finish_pass']['stage']
          for entry in r['photos']:
              q=Path(entry['local_file'])
              assert q.is_file() and q.stat().st_size>4000
              assert hashlib.sha256(q.read_bytes()).hexdigest()==entry['archived_sha256']
              with Image.open(q) as im:
                  assert im.format=='JPEG' and im.mode=='RGB' and im.size==tuple(entry['dimensions']) and not im.getexif().get(34853)
                  im.verify()
              record=next(x for x in s['images'] if x.get('file')=='images/'+q.name)
              assert record['creator']=='Bob Harms' and record['source_taxon_name']=='Elymus virginicus'
              assert rights(record,True)[0],(q,rights(record,True))
              assert photo_rights(record,True) is None,(q,photo_rights(record,True))
              assert len([x for x in s['visual_comparison']['items'] if x.get('image_url')==str(q)])==1
          print('PASS: 5 actual source-matched credited Bob Harms exact Virginia wildrye macro photos, both rights gates',flush=True)
          PY
      - name: Commit only verified bytes and exact canonical teaching evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Elymus/elymus-virginicus/ content/taxa/Poaceae/Elymus/genus.json
          git add reports/elymus-virginicus-five-harms-central-texas-originals-20261023.json
          git add workflow/field-id-publication/2026-10-23-elymus-virginicus-five-harms-real-photos.json
          if git diff --cached --quiet; then echo 'Already present'; exit 0; fi
          git commit -m 'Archive five true source-authenticated Central Texas Virginia wildrye originals [skip ci]'
          for retry in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
