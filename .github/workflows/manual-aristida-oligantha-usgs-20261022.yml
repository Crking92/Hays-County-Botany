name: Install verified USGS Aristida oligantha diagnostic photo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-aristida-oligantha-usgs-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hays-one-time-aristida-usgs-public-photo
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for photo-byte validation
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refresh canonical main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Verify exact USGS source pixels and install physical JPEG
        run: python scripts/install_aristida_oligantha_usgs_20261022.py
      - name: Validate only real photo role, rights and taxonomy preservation
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          base=Path('content/taxa/Poaceae/Aristida')
          s=json.loads((base/'aristida-oligantha/species.json').read_text())
          g=json.loads((base/'genus.json').read_text())
          rep=json.loads(Path('reports/aristida-oligantha-usgs-public-domain-photo-import-20261022.json').read_text())
          f=Path(rep['photo'])
          assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==rep['archived_sha256']
          with Image.open(f) as im:
              assert im.format=='JPEG' and min(im.size)>=400
              assert not im.getexif().get(34853)
              im.verify()
          assert s['id']=='aristida-oligantha'
          assert g['project_scope']['species_count']==2
          assert s['visual_comparison']['items'][0]['image_url']==str(f)
          assert g['visual_comparison']['items'][1]['image_url']==str(f)
          assert len(s['visual_comparison']['items'])==3
          assert len(g['visual_comparison']['items'])==12
          assert sum(len(p.get('markers',[])) for p in s['visual_comparison']['items'])==5
          assert any(x.get('file')=='images/'+f.name and x.get('source_page')=='https://warcapps.usgs.gov/PlantID/Species/Details/2840' for x in s['images'])
          assert all(x.get('creator') and x.get('license') and x.get('source_page') for x in g['visual_comparison']['items'])
          print('PASS: source-image actual JPG, verified pixels, 2 correct gross arrows, existing science and exact license')
          PY
      - name: Commit scoped photo, metadata, build report and publication request
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Aristida/aristida-oligantha/ content/taxa/Poaceae/Aristida/genus.json
          git add reports/aristida-oligantha-usgs-public-domain-photo-import-20261022.json
          git add workflow/field-id-publication/2026-10-22-aristida-oligantha-usgs-awn-photo.json
          if git diff --cached --quiet; then echo 'Previously installed, nothing changed'; exit 0; fi
          git commit -m 'Physically archive USGS oldfield threeawn source-labelled awn photo [skip ci]'
          for n in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Request ordinary public-rights-filtered Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Requested rights-filtered public learner deployment'
