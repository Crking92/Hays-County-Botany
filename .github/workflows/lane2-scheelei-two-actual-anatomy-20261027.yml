name: Lane 2 archive Scheele aboveground sheath and true spikelets photos
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_scheelei_two_actual_anatomy_photos_20261027.py
      - .github/workflows/lane2-scheelei-two-actual-anatomy-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-scheelei-anatomy-20261027
  cancel-in-progress: false
jobs:
  verify-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify original licensed image pixels/species and install two true aboveground field photos
        run: python scripts/lane2_scheelei_two_actual_anatomy_photos_20261027.py
      - name: Publish canonical photo bytes, new gallery and provenance report to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Setaria/setaria-scheelei/ reports/lane2-scheelei-aboveground-photo-pass-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive exact Scheele blade sheath and spikelets photos with 3 arrows"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
