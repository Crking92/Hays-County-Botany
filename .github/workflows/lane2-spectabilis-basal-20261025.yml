name: Lane 2 public-safe purple lovegrass basal foliage
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_spectabilis_basal_photo_20261025.py
      - .github/workflows/lane2-spectabilis-basal-20261025.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-spectabilis-basal-photo
  cancel-in-progress: false
jobs:
  archive-and-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane2_spectabilis_basal_photo_20261025.py
      - name: Commit actual JPEG with record and gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-spectabilis/ reports/lane2-purple-lovegrass-basal-leaves-20261025.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive licensed purple lovegrass basal blades and two visible arrows"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
