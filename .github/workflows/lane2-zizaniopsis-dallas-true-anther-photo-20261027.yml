name: Lane 2 archive photographed genuine Zizaniopsis anther anatomy
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane2-zizaniopsis-dallas-true-anther-photo-20261027.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-cutgrass-original-cc-by-anthers-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane2_zizaniopsis_dallas_staminate_anthers_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Archive source-verified Texas flowering photo and real visible anatomy only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lane2_zizaniopsis_dallas_staminate_anthers_20261027.py
