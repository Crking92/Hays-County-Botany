name: Lane 2 genuine Aristida and giant cutgrass open-license anatomical photo scout
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane2-aristida-cutgrass-cc-photo-scout-20261027.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-threeawns-cutgrass-scout-20261027
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane2_aristida_cutgrass_open_photo_contact_scout_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Review source-exact Texas CC images, store attributed diagnostic contact previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lane2_aristida_cutgrass_open_photo_contact_scout_20261027.py
