name: Manual Dollarweed Photo and Rights Screen
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-hydrocotyle-umbellata-photo-screen-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-dollarweed-contact-sheet-20261020
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow requests
      - run: python scripts/manual_hydrocotyle_umbellata_photo_screen_20261020.py
      - name: Archive review-only media screen, no canonical installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/photo-library/reviews/hydrocotyle-umbellata-20261020/
          if git diff --cached --quiet; then exit 0;fi
          git commit -m "Archive dollarweed licensed contact-sheet candidates and media-rights audit [skip ci]"
          for attempt in 1 2 3;do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0;fi
            sleep 4
          done
          exit 1
