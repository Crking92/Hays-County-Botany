name: Photo Library Mass Collect

# Manual or explicitly requested push-triggered collection. No schedule.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of new sparse-card species (10-60)'
        required: true
        type: number
        default: 40
      per_species:
        description: 'Candidate images per source per species'
        required: true
        type: number
        default: 4
      source:
        description: 'Public sources; direct Pl@ntNet route may be restricted'
        required: true
        type: choice
        options: [public, gbif, plantnet-gbif, both]
        default: public
      species:
        description: 'Optional comma-separated canonical IDs; use blank for next unscanned'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'workflow/photo-library/requests/20261015-collect.json'

permissions:
  contents: write

concurrency:
  group: hays-photo-library-persist-main
  cancel-in-progress: false

jobs:
  harvest-and-preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image preparation library
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Choose manually approved batch settings
        id: config
        env:
          EVENT: ${{ github.event_name }}
          LIMIT_INPUT: ${{ inputs.limit }}
          PER_SPECIES_INPUT: ${{ inputs.per_species }}
          SOURCE_INPUT: ${{ inputs.source }}
          SPECIES_INPUT: ${{ inputs.species }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            echo "limit=40" >> "$GITHUB_OUTPUT"
            echo "per_species=4" >> "$GITHUB_OUTPUT"
            echo "source=public" >> "$GITHUB_OUTPUT"
            echo "species=" >> "$GITHUB_OUTPUT"
          else
            echo "limit=$LIMIT_INPUT" >> "$GITHUB_OUTPUT"
            echo "per_species=$PER_SPECIES_INPUT" >> "$GITHUB_OUTPUT"
            echo "source=$SOURCE_INPUT" >> "$GITHUB_OUTPUT"
            echo "species=$SPECIES_INPUT" >> "$GITHUB_OUTPUT"
          fi
      - name: Search next unscanned sparse-card species and download provisional candidate images
        env:
          PLANTNET_API_KEY: ${{ secrets.PLANTNET_API_KEY }}
          LIMIT: ${{ steps.config.outputs.limit }}
          PER_SPECIES: ${{ steps.config.outputs.per_species }}
          SOURCE: ${{ steps.config.outputs.source }}
          SPECIES: ${{ steps.config.outputs.species }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/bulk_open_photo_harvest.py scripts/photo_library_archive.py
          python scripts/bulk_open_photo_harvest.py --source "$SOURCE" --limit "$LIMIT" --per-species "$PER_SPECIES" --max-local 2 --species "$SPECIES" --skip-library-scanned --download --out "$RUNNER_TEMP/harvest"
      - name: Build archive with image hashes, individual licenses and metadata
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/photo_library_archive.py prepare --input "$RUNNER_TEMP/harvest" --batch-id "mass-$RUN_ID" --archive-dir "$RUNNER_TEMP/archives"
      - name: Save candidate media in non-expiring private GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="hays-photo-library-mass-$RUN_ID"
          asset="$RUNNER_TEMP/archives/mass-$RUN_ID-photos.zip"
          gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Provisional photo candidate library: mass-$RUN_ID" --notes "Unverified botanical photo candidates. Verify original individual-photo rights, identity and attribution before any learner install. See catalog CSV inside; private project storage only."
          python scripts/photo_library_archive.py published --batch-id "mass-$RUN_ID"
          python scripts/photo_library_archive.py rebuild
      - name: Save searchable catalog in canonical GitHub repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/photo-library/batches workflow/photo-library/catalog.csv workflow/photo-library/species-index.json
          git commit -m "Persist mass photo candidate batch $GITHUB_RUN_ID with private release archive"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Permanent photo library catalog and batch successfully saved."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Upload temporary recovery report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: photo-library-mass-harvest-recovery
          path: |
            workflow/photo-library/batches/
            ${{ runner.temp }}/harvest/
          retention-days: 14
          if-no-files-found: ignore
