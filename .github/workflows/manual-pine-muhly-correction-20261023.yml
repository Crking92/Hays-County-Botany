name: Correct pine muhly source name and archive two open photos
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/manual-pine-muhly-correction-20261023.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: correct-pine-muhly-canonical
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive two open-license photographs and perform guarded canonical taxon correction
        run: python scripts/resolve_muhlenbergia_piniflora_20261019.py
      - name: Validate public publication safety
        run: |
          python -m json.tool content/taxa/Poaceae/Muhlenbergia/muhlenbergia-dubia/species.json >/dev/null
          python -m json.tool data/manifest.json >/dev/null
          test -s content/taxa/Poaceae/Muhlenbergia/muhlenbergia-dubia/images/pine-muhly-patrick-alexander-cc0.jpg
          test -s content/taxa/Poaceae/Muhlenbergia/muhlenbergia-dubia/images/pine-muhly-stickpen-public-domain.jpg
      - name: Commit full corrected package with originals and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/taxa/Poaceae/Muhlenbergia/ data/manifest.json research-drafts/muhlenbergia-piniflora/ reports/muhlenbergia-name-repair-20261019.json data/
          if ! git diff --cached --quiet; then
            git commit -m "Install corrected Muhlenbergia dubia card and CC0/PD photograph files"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
