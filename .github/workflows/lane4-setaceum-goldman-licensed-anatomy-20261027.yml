name: Lane4 thin paspalum true ligule and spikelet licensed archive
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_setaceum_goldman_anatomy_20261027.py
      - .github/workflows/lane4-setaceum-goldman-licensed-anatomy-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-goldman-setaceum-anatomy-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/lane4_archive_setaceum_goldman_anatomy_20261027.py
            content/taxa/Poaceae/Paspalum/paspalum-setaceum
            reports/lane4-six-role-photographic-progress-20261027.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify original Commons individual photos and EXIF-strip five licensed exact grass anatomy images
        run: python scripts/lane4_archive_setaceum_goldman_anatomy_20261027.py
      - name: Commit binary originals, visible anatomy arrows and conservative six-role score
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse content/taxa/Poaceae/Paspalum/paspalum-setaceum/ reports/lane4-six-role-photographic-progress-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane4: archive CC BY-SA true thin paspalum ligule and paired spikelet macro photographs"
            pushed=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Concurrent editor touched same species; abort instead of rewriting others"
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then pushed=1; break; fi
              echo "Retry after safe concurrent rebase $attempt"
              sleep 3
            done
            test "$pushed" = 1
          fi
