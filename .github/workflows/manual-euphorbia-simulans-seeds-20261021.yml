name: Scout licensed mimicking sandmat seed source once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-simulans-seeds-20261021.yml"
      - "scripts/manual_euphorbia_simulans_seed_scout_20261021.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-simulans-seed-scout-20261021
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install requests pillow --disable-pip-version-check
      - name: Source and licence scout
        run: python scripts/manual_euphorbia_simulans_seed_scout_20261021.py
      - name: Physical photo checks, do not silently promote into species lesson
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,hashlib
          path=Path("photo-lab/2026-10-21-euphorbia-simulans-seed-scout")
          report=json.loads((path/"manifest.json").read_text())
          pics=[x for x in report["records"] if x.get("file")]
          assert any(x["taxon"]=="Euphorbia simulans" for x in pics)
          for x in pics:
              assert x["license"] in {"cc0","cc-by","cc-by-sa","cc-by-nc"}
              with Image.open(x["file"]) as im:im.verify()
              assert hashlib.sha256(Path(x["file"]).read_bytes()).hexdigest()==x["sha256"]
          print("Saved and decoded",len(pics),"separately licensed source image candidates")
          PY
      - name: Commit only verified source image candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-lab/2026-10-21-euphorbia-simulans-seed-scout/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive photo-licensed simulans and theriaca seed microscopy candidates for review"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
