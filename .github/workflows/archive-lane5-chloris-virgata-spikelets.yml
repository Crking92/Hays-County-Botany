name: Lane 5 archive feather fingergrass spikelet stages
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane5_chloris_virgata_spikelets.py
      - .github/workflows/archive-lane5-chloris-virgata-spikelets.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane5-chloris-virgata-spikelets
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_lane5_chloris_virgata_spikelets.py
      - name: Publish verified local JPEGs and gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Chloris/chloris-virgata/ reports/lane5-chloris-virgata-spikelet-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive feather fingergrass young and mature spikelets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
