name: Manual Croton fruticulosus verified CC0 photo enrichment
on:
  push:
    paths:
      - .github/workflows/manual-croton-fruticulosus-commons-cc0-20261021.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: targeted-croton-fruticulosus-commons-20261021
  cancel-in-progress: false
jobs:
  verify-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Verify source-level CC0 and physically install two Croton images
        run: python scripts/croton_fruticulosus_commons_cc0.py
      - name: Assert physically stored, uncorrupted photos; preserve source taxon concept
        run: |
          python - <<'PY'
          import json,pathlib
          from PIL import Image
          p=pathlib.Path("content/taxa/Euphorbiaceae/Croton/croton-fruticulosus/species.json")
          s=json.loads(p.read_text())
          assert s["id"]=="croton-fruticulosus"
          assert s["project_inclusion"]["target_zone_status"]=="PASS"
          assert s["scientific_name"]=="Croton fruticulosus"
          selected=[x for x in s["images"] if "commons-gaiacoyote-cc0-" in str(x.get("file"))]
          assert len(selected)==2
          assert len(s["visual_comparison"]["items"])>=4
          for x in selected:
              assert x["license"]=="CC0 1.0" and x["creator"]=="Gaiacoyote"
              assert x["public_reuse"]=="yes"
              f=p.parent/x["file"]
              assert f.is_file() and f.stat().st_size>13000
              with Image.open(f) as im: im.verify()
              print("verified real CC0 JPEG",f)
          PY
      - name: Commit media, metadata and scientific-photo gap ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Euphorbiaceae/Croton/croton-fruticulosus/
          if git diff --cached --quiet; then echo "Already installed; nothing to commit"; exit 0; fi
          git commit -m "Install two licensed CC0 shrubby Croton female/leaf macros [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
