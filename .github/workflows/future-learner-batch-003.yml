name: Future learner batch 003 photos and install
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/future-learner-batch-003.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python scripts/stage_future_photo_batch_003.py
      - run: python scripts/install_future_photo_batch_003.py
      - name: Commit installed learner cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa data/manifest.json data/project.json reports curation-archive research-drafts/photo-imports/future-batch-003
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install future learner batch 003 with Joey photos"
          git pull --rebase origin main
          git push origin HEAD:main
