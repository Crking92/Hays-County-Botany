name: Stage Eastern Black Nightshade Photo Sources
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-solanum-emulans-photo-stage-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solanum-emulans-private-photo-review-20261020
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests 'Pillow>=10,<12'
      - name: Download rights-checked exact species candidate photographs (no canonical installation)
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import requests,io,json,hashlib,re
          from PIL import Image,ImageOps
          from pathlib import Path
          root=Path('workflow/photo-library/candidates/solanum-emulans-20261020');root.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({"User-Agent":"HaysBotanyEducationalResearch/1.0 (exact-species CC photo source verification)","Accept":"image/jpeg,image/png,image/*;q=0.8"})
          defs=[
          ('mason-heberling','96687123','Mason Heberling','https://commons.wikimedia.org/wiki/File:Solanum_emulans.jpg','https://www.inaturalist.org/observations/60465060','Pennsylvania, USA'),
          ('alex-abair','555742252','Alex Abair','https://commons.wikimedia.org/wiki/File:Solanum_emulans_555742252.jpg','https://www.inaturalist.org/observations/308062995','Virginia, USA')]
          imgs=[];errors=[];holds=[]
          def attempt(url):
            resp=s.get(url,timeout=24);resp.raise_for_status()
            if len(resp.content)<25000 or len(resp.content)>16000000:raise ValueError("Byte length unsuitable")
            p=Image.open(io.BytesIO(resp.content));p.verify()
            p=Image.open(io.BytesIO(resp.content))
            if min(p.size)<350:raise ValueError("Too small")
            return ImageOps.exif_transpose(p).convert('RGB')
          def save(img,name,record,url):
            img.thumbnail((1800,1800),Image.Resampling.LANCZOS)
            p=root/(name+'.jpg');img.save(p,'JPEG',quality=88,optimize=True,exif=b'')
            with Image.open(p) as verify:verify.verify()
            record.update(file=str(p),source_image_url=url,sha256=hashlib.sha256(p.read_bytes()).hexdigest(),dimensions=list(img.size),status='STAGED_FOR_PIXEL_REVIEW',modifications='Resized/converted JPEG and stripped EXIF. No anatomy arrows assigned until human pixel review.')
            imgs.append(record)
          for name,pid,creator,page,obs,location in defs:
            rec=dict(name=name,creator=creator,license='CC BY 4.0',license_url='https://creativecommons.org/licenses/by/4.0/',source_page=page,observation=obs,source_geography=location,exact_species='Solanum emulans')
            for url in [f'https://inaturalist-open-data.s3.amazonaws.com/photos/{pid}/original.jpg',f'https://inaturalist-open-data.s3.amazonaws.com/photos/{pid}/large.jpg']:
              try:save(attempt(url),name,rec,url);break
              except Exception as e:errors.append({'name':name,'url':url,'error':str(e)[:140]})
            else:holds.append(name)
          # Figure 16 source photo montage by Michael Nee from Knapp et al. 2019.
          # Only an EXACT paper figure is allowed; do not substitute an unrelated figure.
          figure=[
            'https://europepmc.org/articles/PMC6554266/bin/phytokeys-123-001-g016.jpg',
            'https://pmc.ncbi.nlm.nih.gov/articles/instance/6554266/bin/phytokeys-123-001-g016.jpg',
            'https://pmc.ncbi.nlm.nih.gov/articles/PMC6554266/bin/phytokeys-123-001-g016.jpg']
          try:
            r=s.get('https://zenodo.org/api/records/',params={'q':'doi:"10.3897/phytokeys.123.31738.figure16"','size':10},timeout=23)
            if r.ok:
              for z in r.json().get('hits',{}).get('hits',[]):
                title=z.get('metadata',{}).get('title','')
                if 'Figure 16' not in title:continue
                for file in z.get('files',[]):
                  if file.get('key','').lower().endswith(('.jpg','.png','.jpeg')):
                    url=file.get('links',{}).get('self')
                    if url:figure.insert(0,url)
          except Exception as e:errors.append({'name':'zenodo-search','error':str(e)[:140]})
          for url in dict.fromkeys(figure):
            try:
              pic=attempt(url)
              rec=dict(name='figure16-m-nee',creator='Michael Nee (four photos); Knapp et al. 2019 (plate)',license='CC BY 4.0',license_url='https://creativecommons.org/licenses/by/4.0/',source_page='https://pmc.ncbi.nlm.nih.gov/articles/PMC6554266/',source_figure='Figure 16 A–D',figure_doi='https://doi.org/10.3897/phytokeys.123.31738.figure16',exact_species='Solanum emulans',source_geography='Nee 61357 and Nee 61306; not local Hays County photos')
              save(pic,'figure16-m-nee',rec,url);break
            except Exception as e:errors.append({'name':'figure16-m-nee','url':url,'error':str(e)[:140]})
          else:holds.append('figure16-m-nee')
          report=dict(species_id='solanum-emulans',date='2026-10-20',status='STAGED_NOT_CANONICAL' if imgs else 'NO_SOURCES_STAGED',
           images=imgs,holds=holds,errors=errors,anatomy_status='UNREVIEWED: DO NOT ANNOTATE OR INSTALL UNTIL PIXEL INSPECTION')
          out=Path('reports/solanum-emulans-photo-staging-20261020.json');out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('STAGED',[(x['name'],x['dimensions']) for x in imgs],'HELD',holds)
          if not imgs:raise SystemExit("No usable exact-source photographs")
          PY
      - name: Commit review materials only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/photo-library/candidates/solanum-emulans-20261020 reports/solanum-emulans-photo-staging-20261020.json
          git diff --cached --quiet && exit 0
          git commit -m "Stage exact CC BY Solanum emulans photos for manual annotation review [skip ci]"
          for t in 1 2 3 4 5;do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            git rebase --abort || true;sleep 4
          done
          exit 1
