name: Archive Secale cereale spikelets
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_secale_cereale_anatomy.py
      - .github/workflows/archive-secale-cereale-anatomy.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-secale-cereale-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_secale_cereale_anatomy.py
      - name: Commit saved rye spikelet images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Secale/secale-cereale/ reports/secale-cereale-anatomy-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive licensed rye spikelet anatomy photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
