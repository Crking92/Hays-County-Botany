name: Verify four real Hays little-bluestem anatomy sources without rehosting
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-schizachyrium-digflora-four-rights-hold-audit-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-schizachyrium-digflora-four-source-audit-20261022
  cancel-in-progress: false
jobs:
  verify-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Refresh latest canonical and validate audit script
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/verify_schizachyrium_digflora_four_sources_20261022.py
      - name: Download all 4 source JPEGs ephemerally and verify real source dimensions and hashes
        run: python scripts/verify_schizachyrium_digflora_four_sources_20261022.py
      - name: Ensure only metadata published and all 4 photos are real
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/schizachyrium-digflora-four-source-verification-20261022.json').read_text())
          assert r['result']=='FOUR_REAL_NORTH_HAYS_DIGFLORA_SCHIZACHYRIUM_JPEGS_ORIGINALLY_VERIFIED_METADATA_ONLY'
          assert len(r['original_photograph_records'])==4
          assert len(set(x['sha256'] for x in r['original_photograph_records']))==4
          assert all(x['jpeg_bytes']>9000 and x['width_px']>200 and x['height_px']>200 for x in r['original_photograph_records'])
          assert all(x['source_page']=='https://w3.biosci.utexas.edu/prc/DigFlora/KR/SCSC.html' for x in r['original_photograph_records'])
          assert all(x['publication_decision'].startswith('Do not commit the JPEG') for x in r['original_photograph_records'])
          assert r['physical_photo_jpegs_added_to_public_git']==0
          print('PASS four actual source JPEGs verified with SHA and dimensions, zero unlicensed GitHub image files')
          PY
      - name: Commit only source provenance hashes and deep verification report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/schizachyrium-digflora-four-source-verification-20261022.json
          if git diff --cached --quiet;then echo 'Already audited';exit 0;fi
          git commit -m 'Verify 4 real Bob Harms little-bluestem DigFlora images by SHA without republishing copyrighted JPEGs [skip ci]'
          for attempt in 1 2 3 4;do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            sleep 4
          done
          exit 1
