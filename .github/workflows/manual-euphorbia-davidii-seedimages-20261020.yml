name: Install licensed E davidii SeedImages macro
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-davidii-seedimages-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-euphorbia-davidii-seedimages
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow requests
      - run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Install source-licensed exact E davidii seed
        run: python scripts/manual_euphorbia_davidii_seedimages_photo_20261020.py
      - name: Validate source and preserve photo restrictions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base=Path("content/taxa/Euphorbiaceae/Euphorbia/euphorbia-davidii")
          j=json.loads((base/"species.json").read_text())
          assert j["scientific_name"]=="Euphorbia davidii"
          assert j["project_inclusion"]["native_metrics_excluded"] is True
          assert len(j["images"])==5
          assert j["images"][2]["license"]=="copyrighted / public reuse not granted"
          assert j["images"][3]["license"]=="copyrighted / public reuse not granted"
          seed=j["images"][4]
          assert "SeedImages" in seed["creator"]
          assert seed["public_reuse"]=="yes"
          assert seed["original_image_sha256"]
          path=base/seed["file"]
          assert path.is_file()
          with Image.open(path) as im:
            assert im.width>=250 and im.height>=170
            im.verify()
          print("PASS: original two rights-restricted photos preserved; exact labelled seed photo downloaded.")
          PY
      - name: Commit seed JPEG and public source metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Euphorbiaceae/Euphorbia/euphorbia-davidii/ reports/euphorbia-davidii-seedimages-install-20261020.json
          if git diff --cached --quiet; then echo "Already installed"; exit 0; fi
          git commit -m "Archive public-domain E davidii seed photo with CSU USDA credit"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
