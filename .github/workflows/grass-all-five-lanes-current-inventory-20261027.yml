name: Grass five lanes current species photo inventory
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/grass-all-five-lanes-current-inventory-20261027.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Pin manifest and inspect all canonical Poaceae cards and lane rosters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,re,json,collections,time,concurrent.futures,requests
          repo=os.environ['REPO'];ref=os.environ['SHA'];token=os.environ['GITHUB_TOKEN']
          base=f'https://raw.githubusercontent.com/{repo}/{ref}/'
          sess=requests.Session()
          sess.headers.update({'User-Agent':'Hays-Botany-grass-audit/1.0'})
          def get(path):
            url=base+path
            last=None
            for i in range(4):
              try:
                res=requests.get(url,timeout=55,headers={'User-Agent':'Hays-Botany-grass-audit/1.0'})
                res.raise_for_status();return res.text
              except Exception as e:last=e;time.sleep(1+i)
            raise RuntimeError(path+': '+str(last))
          manifest=json.loads(get('data/manifest.json'))
          grasses=[x for x in manifest['species'] if '/Poaceae/' in x['path']]
          print('MANIFEST_COUNTER',json.dumps({'species_total':len(manifest['species']),'poaceae_count':len(grasses),'genera_count':len(set(x['path'].split('/')[3] for x in grasses)),'snapshot_sha':ref}))
          lanes={}
          for i in range(1,6):
            src=get(f'workflow/grass-five-chat-split-20261023/CHAT_{i}.md')
            lanes[i]=re.findall(r'^\|\s*P[0-3]\s*\|\s*`([a-z0-9-]+)`\s*\|',src,flags=re.M)
          wanted={x['id'] for x in grasses}
          assert all(len(ids) in (22,23) for ids in lanes.values()),{i:len(z) for i,z in lanes.items()}
          assert len(set(x for ls in lanes.values() for x in ls))==sum(len(ls) for ls in lanes.values())
          assert set(x for ls in lanes.values() for x in ls)==wanted,{'unassigned':sorted(wanted-set(x for ls in lanes.values() for x in ls)),'unknown':sorted(set(x for ls in lanes.values() for x in ls)-wanted)}
          def item(entry):
            d=json.loads(get(entry['path']))
            ims=d.get('images',[]) or []
            vc=d.get('visual_comparison',{}) or {}
            panels=vc.get('items',[]) or []
            status=str(d.get('field_id_finish_pass',{}).get('stage') or d.get('curation_status',{}).get('visual_finish') or '')
            local=[x for x in ims if str(x.get('file','')).startswith('images/')]
            labels=[str(x.get('role','')).lower() for x in local]
            photos=[x for x,lab in zip(local,labels) if not any(w in lab for w in ('illustration','drawing','historical plate','historical illustration','diagram'))]
            release_holds=sum((('all rights reserved' in str(z.get('license','')).lower()) or
                 str(z.get('public_reuse','')).lower() in ('no','false')) for z in ims)
            score=None
            if isinstance(d.get('silver_six_role_photo_score_20261027'),dict): score=d['silver_six_role_photo_score_20261027'].get('pct')
            return dict(id=entry['id'],scientific=d.get('scientific_name'),common=d.get('common_name'),
              photos=len(photos),image_records=len(ims),local_media_records=len(local),panels=len(panels),
              same_species_panels=sum(z.get('scientific_name')==d.get('scientific_name') for z in panels),
              arrows=sum(len(z.get('markers',[]) or []) for z in panels),
              release_holds=release_holds,status=status,score=score,
              founder=bool(d.get('beginner_learning_path')),id_tiles=len(d.get('field_id_short_tiles',[]) or []))
          results=[];errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
            future={pool.submit(item,x):x['id'] for x in grasses}
            for fut in concurrent.futures.as_completed(future):
              try:results.append(fut.result())
              except Exception as e: errors.append({'species_id':future[fut],'error':str(e)[:200]})
          results.sort(key=lambda x:x['id'])
          print('FILE_ERRORS',json.dumps(errors))
          assert not errors, 'audit must have no inaccessible canonical cards'
          byid={x['id']:x for x in results}
          statuscounts=collections.Counter('FINISHED' if s['status'].strip()=='FINISHED' else
              'PHOTO_GAPS' if 'PHOTO_GAPS' in s['status'] else
              'PROVISIONAL' if 'PROVISIONAL' in s['status'] else
              'OTHER' for s in results)
          summary={'snapshot_sha':ref,'species':len(results),'genera':len(set(x['scientific'].split()[0] for x in results if x['scientific'])),
            'image_records':sum(x['image_records'] for x in results),
            'locally_referenced_media_records':sum(x['local_media_records'] for x in results),
            'photo_type_local_records_heuristic':sum(x['photos'] for x in results),
            'gallery_panels':sum(x['panels'] for x in results),
            'same_species_gallery_panels':sum(x['same_species_panels'] for x in results),
            'photo_arrows':sum(x['arrows'] for x in results),
            'zero_images_species':sum(x['image_records']==0 for x in results),
            'one_image_species':sum(x['image_records']==1 for x in results),
            'zero_or_one_local_photo_type':sum(x['photos']<=1 for x in results),
            'four_plus_photos_heuristic_species':sum(x['photos']>=4 for x in results),
            'eight_plus_photos_heuristic_species':sum(x['photos']>=8 for x in results),
            'species_with_arrows':sum(x['arrows']>0 for x in results),
            'species_with_some_rights_held_legacy_metadata':sum(x['release_holds']>0 for x in results),
            'strict_finished_cards':statuscounts['FINISHED'],
            'stage_counts':dict(statuscounts),
            'beginner_paths':sum(x['founder'] for x in results),
            'field_id_tiles':sum(x['id_tiles'] for x in results)}
          print('AUDIT_MASTER',json.dumps(summary))
          for i,roster in lanes.items():
            subset=[byid[id] for id in roster]
            lane={'lane':i,'assigned':len(subset),'photos_heuristic':sum(x['photos'] for x in subset),
              'image_records':sum(x['image_records'] for x in subset),
              'panels':sum(x['panels'] for x in subset),
              'arrows':sum(x['arrows'] for x in subset),
              'species_with_4plus_photo_types':sum(x['photos']>=4 for x in subset),
              'species_with_8plus_photo_types':sum(x['photos']>=8 for x in subset),
              'species_with_at_least_one_arrow':sum(x['arrows']>0 for x in subset),
              'species_with_0_to_1_photo_type':[(x['id'],x['photos']) for x in subset if x['photos']<=1],
              'strict_finished_count':sum(x['status'].strip()=='FINISHED' for x in subset)}
            print('AUDIT_LANE',json.dumps(lane))
          interest=['bothriochloa-torreyana','bothriochloa-ischaemum','andropogon-gerardi',
            'schizachyrium-scoparium','panicum-virgatum','sorghastrum-nutans',
            'phragmites-australis','arundo-donax','paspalum-floridanum','setaria-scheelei',
            'eragrostis-spectabilis','muhlenbergia-dubia','anatherum-tenuispatheum',
            'chloris-x-subdolichostachya','muhlenbergia-paniculata']
          print('AUDIT_FOCUS',json.dumps([byid[x] for x in interest if x in byid]))
          print('AUDIT_FEWEST',json.dumps(sorted(results,key=lambda x:(x['photos'],x['panels']))[:14]))
          PY
