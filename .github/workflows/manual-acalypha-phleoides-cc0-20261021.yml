name: Acalypha phleoides CC0 verified two reproductive photos
on:
  push:
    paths:
      - .github/workflows/manual-acalypha-phleoides-cc0-20261021.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-acalypha-phleoides-cc0-20261021
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Verify source-licensed photo metadata and install locally
        run: python scripts/acalypha_phleoides_commons_cc0.py
      - name: Validate physical media, species and license
        run: |
          python - <<'PY'
          import pathlib,json
          from PIL import Image
          p=pathlib.Path("content/taxa/Euphorbiaceae/Acalypha/acalypha-phleoides/species.json")
          d=json.loads(p.read_text())
          assert d["id"]=="acalypha-phleoides" and d["scientific_name"]=="Acalypha phleoides"
          assert d["project_inclusion"]["target_zone_status"]=="PASS"
          pics=[x for x in d["images"] if "commons-gaiacoyote-cc0" in str(x.get("file"))]
          assert len(pics)==2
          assert len(d["visual_comparison"]["items"])>=5
          for x in pics:
              assert x["creator"]=="Gaiacoyote" and x["license"]=="CC0 1.0" and x["public_reuse"]=="yes"
              image=p.parent/x["file"]
              assert image.is_file() and image.stat().st_size>12000
              with Image.open(image) as im: im.verify()
              print("Verified actual JPEG:", image)
          PY
      - name: Commit verified physical photos and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Euphorbiaceae/Acalypha/acalypha-phleoides/
          if git diff --cached --quiet; then echo "No-op; already installed"; exit 0; fi
          git commit -m "Install two CC0 Acalypha phleoides bract and mixed-spike photos [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
