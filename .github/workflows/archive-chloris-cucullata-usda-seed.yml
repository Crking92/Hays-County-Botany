name: Archive USDA hooded windmillgrass seed photo
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_chloris_cucullata_usda_seed.py
      - .github/workflows/archive-chloris-cucullata-usda-seed.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chloris-cucullata-usda-seed
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_chloris_cucullata_usda_seed.py
      - name: Commit actual archived bytes and gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Chloris/chloris-cucullata/
          if ! git diff --cached --quiet; then
            git commit -m "Archive USDA hooded windmillgrass measured seed photograph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
