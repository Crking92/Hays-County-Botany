name: Lane 4 install Ozarkgrass source-verified clump and awn macros
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_limnodea_promote_habit_awn_20261026.py
      - .github/workflows/lane4-limnodea-promote-habit-awns-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-limnodea-photo-promotion
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - name: Archive inspected CC0 pixels without altering prior rights
        run: python scripts/lane4_limnodea_promote_habit_awn_20261026.py
      - name: Commit species gallery with race-safe retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git add content/taxa/Poaceae/Limnodea/limnodea-arkansana/ reports/lane4-limnodea-promote-20261026.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Lane 4 publish CC0 Ozarkgrass basal clump and close awned spikelet photos"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
            git fetch origin main
            git reset --hard origin/main
            python scripts/lane4_limnodea_promote_habit_awn_20261026.py
          done
          exit 1
