name: Lane 2 archive Eragrostis lugens live rooted flowering clump
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_archive_lugens_rooted_20261026.py
      - .github/workflows/lane2-lugens-rooted-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-lugens-rooted-20261026
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify and archive photo with anatomy role links
        run: python scripts/lane2_archive_lugens_rooted_20261026.py
      - name: Commit clean JPEG and role-specific arrows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-lugens/ reports/lane2-eragrostis-lugens-rooted-habit-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive live rooted mourning lovegrass crown and flowering panicles"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
