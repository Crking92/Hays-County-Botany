name: Lane 4 ciliaris aboveground anatomy scout
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_ciliaris_ligule_source_scout_20261027.py
      - .github/workflows/lane4-ciliaris-aboveground-scout-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-ciliaris-aboveground-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find independently attributed ligule and hidden-side photos
        run: python scripts/lane4_ciliaris_ligule_source_scout_20261027.py
      - name: Save factual audit, not unapproved candidate photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane4-ciliaris-ligule-source-scout-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 4 source-license scout for true ciliaris ligule and hidden spikelet"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
