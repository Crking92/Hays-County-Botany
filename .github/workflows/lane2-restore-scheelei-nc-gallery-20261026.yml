name: Lane 2 restore image-licensed Scheele bristlegrass NC closeup
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_restore_scheelei_nc_bracts_20261026.py
      - .github/workflows/lane2-restore-scheelei-nc-gallery-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-restore-scheelei-nc-20261026
  cancel-in-progress: false
jobs:
  verify-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Live exact iNaturalist photo-level source, species, photographer, CC-BY-NC check then gallery recovery
        run: python scripts/lane2_restore_scheelei_nc_bracts_20261026.py
      - name: Commit ONLY verified existing-photo gallery restoration and audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Setaria/setaria-scheelei/species.json reports/lane2-scheelei-kyla-nc-gallery-reconciliation-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 restore verified Kyla Miller Scheele bristlegrass CC BY-NC closeup and arrows"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
