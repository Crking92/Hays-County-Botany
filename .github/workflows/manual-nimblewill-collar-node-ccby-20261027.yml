name: Archive CC BY nimblewill collar and branching-stem photographs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/manual-nimblewill-collar-node-ccby-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-nimblewill-collar-branch-real-jpegs-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source verification dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3" "Pillow>=10,<12"
      - name: Refresh main and archive exact real CC BY original JPEGs
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/archive_nimblewill_collar_nodes_ccby_20261027.py
          python scripts/archive_nimblewill_collar_nodes_ccby_20261027.py
      - name: Verify original photo bytes and two canonical teaching galleries
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          rp=Path('reports/lane3-nimblewill-ccby-collar-node-photos-20261027.json')
          if not rp.exists():
              print('NO VERIFIED PHOTOS: source hold is not a success');raise SystemExit(0)
          report=json.loads(rp.read_text())
          assert report['result']=='NIMBLEWILL_REAL_COLLAR_AND_BRANCH_PHOTOS_STORED'
          assert 1<=report['added']<=2
          sp=json.loads(Path('content/taxa/Poaceae/Muhlenbergia/muhlenbergia-schreberi/species.json').read_text())
          gen=json.loads(Path('content/taxa/Poaceae/Muhlenbergia/genus.json').read_text())
          assert sp['id']=='muhlenbergia-schreberi' and gen['name']=='Muhlenbergia'
          for rec in report['records']:
              p=Path(rec['file'])
              assert p.is_file() and p.stat().st_size>20000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['stored_sha256']
              with Image.open(p) as im:
                  assert im.format=='JPEG' and not im.getexif().get(34853);im.verify()
              src=[x for x in sp['images'] if str(x.get('source_photo_id'))==rec['id']]
              assert len(src)==1 and src[0]['creator']=='Emily Summerbell' and src[0]['license']=='CC BY 4.0'
              for d in (sp,gen):
                  pp=[x for x in d['visual_comparison']['items'] if str(x.get('source_photo_id'))==rec['id']]
                  assert len(pp)==1 and pp[0]['image_url']==str(p) and pp[0]['markers']==[]
          print('PASS original JPEGs, SHA, CC BY and correct species/genus galleries')
          PY
      - name: Commit only valid original photo files and publish request
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Muhlenbergia/muhlenbergia-schreberi/
          git add content/taxa/Poaceae/Muhlenbergia/genus.json
          if test -e reports/lane3-nimblewill-ccby-collar-node-photos-20261027.json; then
            git add reports/lane3-nimblewill-ccby-collar-node-photos-20261027.json
            git add workflow/field-id-publication/2026-10-27-nimblewill-ccby-collar-node-photos.json
          fi
          if test -e reports/lane3-nimblewill-ccby-collar-node-source-hold-20261027.json; then
            git add reports/lane3-nimblewill-ccby-collar-node-source-hold-20261027.json
          fi
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Archive real CC BY nimblewill collar and branching stem photo originals'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
