name: Lane 3 archive rice cutgrass anatomy
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane3-leersia-anatomy-20261023.yml, scripts/lane3_leersia_anatomy_20261023.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane3_leersia_anatomy_20261023.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-leersia-anatomy-20261023.json content/taxa/Poaceae/Leersia/leersia-oryzoides/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 3 archive rice cutgrass licensed anatomy or source holds"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
