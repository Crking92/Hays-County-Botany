name: Archive nine original regional green sprangletop anatomy JPEGs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-disakisperma-regional-nine-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-disakisperma-nine-originals-20261022
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image science and original photo utilities
        run: |
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
          python -m py_compile scripts/archive_disakisperma_nine_regional_20261022.py scripts/build_public_pages_snapshot.py scripts/public_photo_rights_preflight.py
      - name: Download original five Bob Harms and four public-domain Uvalde macro photos
        run: python scripts/archive_disakisperma_nine_regional_20261022.py
      - name: Confirm source attribution, real original JPEG integrity and BOTH rights checks
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,'scripts')
          from build_public_pages_snapshot import rights
          from public_photo_rights_preflight import photo_rights
          p=Path('content/taxa/Poaceae/Disakisperma/disakisperma-dubium/species.json')
          g=Path('content/taxa/Poaceae/Disakisperma/genus.json')
          r=Path('reports/green-sprangletop-nine-regional-anatomy-20261022.json')
          s=json.loads(p.read_text()); genus=json.loads(g.read_text()); rpt=json.loads(r.read_text())
          assert s['id']=='disakisperma-dubium' and s['curation_status']['taxonomy_reviewed']==False
          assert len(s['images'])==10 and s['curation_status']['photo_files_present']==10
          assert len(s['visual_comparison']['items'])==13 and len(genus['visual_comparison']['items'])==13
          assert 'FIELD_READY_PHOTO_GAPS' in s['field_id_finish_pass']['stage']
          assert rpt['new_photo_files']==9 and len(rpt['items'])==9
          assert {item['creator'] for item in rpt['items']}=={'Bob Harms','Jim Conrad'}
          for f in rpt['items']:
              q=Path(f['archive_file'])
              assert q.is_file() and q.stat().st_size>4300
              assert hashlib.sha256(q.read_bytes()).hexdigest()==f['sha256']
              with Image.open(q) as im:
                  assert im.mode=='RGB' and im.format=='JPEG' and not im.getexif().get(34853)
                  assert list(im.size)==f['dimensions']
                  im.verify()
              media=next(i for i in s['images'] if i['file']=='images/'+q.name)
              assert media['source_taxon_name'] in ('Leptochloa dubia','Disakisperma dubium')
              assert rights(media,True)[0],(q,rights(media,True))
              assert photo_rights(media,True) is None,(q,photo_rights(media,True))
              assert len([i for i in s['visual_comparison']['items'] if i.get('image_url')==str(q)])==1
          print('PASS: 9 original real photos + correct species, copyright and 13 teaching panels',flush=True)
          PY
      - name: Commit only real validated original image bytes to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Disakisperma/
          git add reports/green-sprangletop-nine-regional-anatomy-20261022.json
          git add workflow/field-id-publication/2026-10-22-disakisperma-nine-real-central-texas.json
          if git diff --cached --quiet; then echo 'Already installed; no duplicate'; exit 0; fi
          git commit -m 'Archive nine real source-vetted regional green sprangletop diagnostic photos [skip ci]'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
