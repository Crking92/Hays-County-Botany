name: Recover European PMC Eastern Black Nightshade Figure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-solanum-emulans-europepmc-figure16-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solanum-emulans-europepmc-figure16
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests 'Pillow>=10,<12'
      - name: Retrieve figure 16 from Europe PMC XML or image archive
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import io,zipfile,json,hashlib,re,xml.etree.ElementTree as ET
          from pathlib import Path
          import requests
          from PIL import Image,ImageOps
          base=Path("workflow/photo-library/candidates/solanum-emulans-20261020");base.mkdir(parents=True,exist_ok=True)
          sess=requests.Session();sess.headers["User-Agent"]="HaysBotanyCrewID/1.0 (science open access image source verifier)"
          errors=[];downloaded=None;hrefs=[]
          def save_image(raw,url):
            global downloaded
            if len(raw)<30000 or len(raw)>17_000_000:raise ValueError("Image byte count outside reasonable range")
            p=Image.open(io.BytesIO(raw));p.verify();p=Image.open(io.BytesIO(raw))
            if min(p.size)<500:raise ValueError("Not enough resolution")
            img=ImageOps.exif_transpose(p).convert("RGB");img.thumbnail((2400,2600),Image.Resampling.LANCZOS)
            file=base/"figure16-nee-source-preview.jpg";img.save(file,"JPEG",quality=90,optimize=True,exif=b"")
            downloaded={"file":str(file),"source_image_url":url,"sha256":hashlib.sha256(file.read_bytes()).hexdigest(),"dimensions":list(img.size),
              "creator":"Michael Nee (original panels); Knapp et al. 2019 (figure)","license":"CC BY 4.0","source_article":"https://doi.org/10.3897/phytokeys.123.31738",
              "source_figure":"Figure 16 (A–D), Solanum emulans",
              "scientific_review_status":"REAL_IMAGE_STAGED_AWAITING_BOTANICAL_PIXEL_REVIEW"}
          try:
            url="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6554266/fullTextXML"
            r=sess.get(url,timeout=30);r.raise_for_status()
            tree=ET.fromstring(r.content)
            for fig in tree.findall(".//fig"):
              label=" ".join(x.text or "" for x in fig.findall("./label"))
              figtext=" ".join(fig.itertext())
              if not re.search(r"\b(?:Figure|Fig\.?)\s*16\b",label,re.I):continue
              if "Solanum emulans" not in figtext:raise ValueError("Figure 16 caption not exact species")
              for node in fig.iter():
                for key,val in node.attrib.items():
                  if key.lower().endswith("href"):hrefs.append(val)
            print("JATS LABEL FIGURE 16 GRAPHIC HREFS",hrefs)
          except Exception as e:errors.append({"route":"Europe PMC full-text XML","error":str(e)[:230]})
          # Europe PMC's supplementary ZIP may hold either article media or standalone supplement.
          try:
            url="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6554266/supplementaryFiles"
            r=sess.get(url,timeout=45);r.raise_for_status()
            if len(r.content)>75_000_000:raise ValueError("Zip too large")
            with zipfile.ZipFile(io.BytesIO(r.content)) as z:
              candidates=[(name,z.getinfo(name).file_size) for name in z.namelist()
                if re.search(r"(?:g0*16|figure0*16|fig0*16)[^/]*\.(?:jpe?g|png|tif|tiff)$",name,re.I)]
              print("ZIP matches",candidates)
              for name,_ in sorted(candidates,key=lambda x:x[1],reverse=True):
                try:save_image(z.read(name),url+"#"+name);break
                except Exception as e:errors.append({"route":"ZIP figure16 image","name":name,"error":str(e)[:180]})
          except Exception as e:errors.append({"route":"Europe PMC supplementary ZIP","error":str(e)[:230]})
          # Use only exact filename named by scholarly JATS Figure 16 element.
          if downloaded is None:
            for href in list(dict.fromkeys(hrefs)):
              cleaned=href.split("/")[-1]
              for suffix in (".jpg",".png",".jpeg",""):
                filename=cleaned if cleaned.lower().endswith((".jpg",".jpeg",".png",".tif",".tiff")) else cleaned+suffix
                for root in ("https://europepmc.org/articles/PMC6554266/bin/","https://pmc.ncbi.nlm.nih.gov/articles/PMC6554266/bin/","https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6554266/bin/"):
                  url=root+filename
                  try:
                    r=sess.get(url,timeout=15);r.raise_for_status()
                    save_image(r.content,url);break
                  except Exception as e:
                    if len(errors)<32:errors.append({"route":"JATS image URL","url":url,"error":str(e)[:105]})
                if downloaded:break
              if downloaded:break
          result={"species":"Solanum emulans","source":"PhytoKeys 123 (2019), Figure 16, Michael Nee",
            "status":"STAGED_FOR_HUMAN_FIGURE16_REVIEW" if downloaded else "FURTHER_SOURCE_NEEDED",
            "jats_graphics":hrefs,"image":downloaded,"errors":errors,
            "safety":"Do not install to species until image has been visually inspected, exact panel D calyx located; figure D shows developing not necessarily fully ripe berries."}
          report=Path("reports/solanum-emulans-europepmc-figure16-review-20261020.json")
          report.write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print("RESULT",result["status"],"source",downloaded and downloaded["source_image_url"])
          PY
      - name: Commit candidate only if present; always keep science hold otherwise
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/solanum-emulans-europepmc-figure16-review-20261020.json
          if test -s workflow/photo-library/candidates/solanum-emulans-20261020/figure16-nee-source-preview.jpg;then
            git add workflow/photo-library/candidates/solanum-emulans-20261020/figure16-nee-source-preview.jpg
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Review original Europe PMC Figure 16 source for eastern black nightshade [skip ci]"
          for k in 1 2 3 4 5;do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            git rebase --abort || true;sleep 4
          done
          exit 1
