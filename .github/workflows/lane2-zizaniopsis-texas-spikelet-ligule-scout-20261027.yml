name: Lane 2 inspect Texas giant cutgrass true reproductive and collar pictures
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane2-zizaniopsis-texas-spikelet-ligule-scout-20261027.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install Pillow
      - name: Screen research-grade Zizaniopsis individually licensed actual Texas photo pixels
        run: |
          python - <<'PY'
          import json,io,base64,math,concurrent.futures
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          from PIL import Image,ImageDraw,ImageOps
          UA={'User-Agent':'HaysBotanyVisualLearner/1.0 exact-Zizaniopsis rights-filtered source review'}
          def get(url,lim=4000000):
           with urlopen(Request(url,headers=UA),timeout=38) as h:return h.read(lim)
          pics=[]
          for page in range(1,5):
           q={'taxon_name':'Zizaniopsis miliacea','quality_grade':'research','place_id':18,'photos':'true','per_page':25,'page':page,'order_by':'created_at','order':'desc'}
           d=json.loads(get('https://api.inaturalist.org/v1/observations?'+urlencode(q),6000000))
           print('PAGE',page,'all',d.get('total_results'),'count',len(d.get('results',[])))
           for o in d.get('results',[]):
            if o.get('taxon',{}).get('name')!='Zizaniopsis miliacea':continue
            for p in (o.get('photos') or [])[:6]:
             if p.get('license_code') in {'cc0','cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa'}:pics.append((o,p))
           if page*25>=d.get('total_results',0):break
          pics=pics[:50]
          def thumb(op):
           p=op[1];url=p['url'].replace('/square.','/medium.').replace('/thumb.','/medium.')
           try:
            with Image.open(io.BytesIO(get(url,950000))) as im:z=ImageOps.exif_transpose(im).convert('RGB')
            z.thumbnail((225,195));return z
           except Exception as e:print('FAIL',p.get('id'),str(e)[:80]);return None
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:imgs=list(pool.map(thumb,pics))
          for block in range(math.ceil(len(pics)/25)):
           sheet=Image.new('RGB',(1250,1180),'white');d=ImageDraw.Draw(sheet)
           for i,(o,p) in enumerate(pics[block*25:(block+1)*25]):
            n=block*25+i;x=i%5*250;y=i//5*236;im=imgs[n]
            if im is not None:sheet.paste(im,(x+(250-im.width)//2,y+5))
            d.text((x+4,y+198),f'#{n} photo {p["id"]}',fill='black')
            d.text((x+4,y+218),f'obs {o["id"]} {p["license_code"]}',fill='black')
            print('CANDIDATE',json.dumps({'i':n,'photo':p['id'],'observation':o['id'],'creator':p.get('attribution'),'license':p['license_code'],'place':o.get('place_guess'),'source':'https://www.inaturalist.org/photos/'+str(p['id'])},ensure_ascii=False))
           data=io.BytesIO();sheet.save(data,'JPEG',quality=77,optimize=True);val=base64.b64encode(data.getvalue()).decode()
           for i,x in enumerate(range(0,len(val),3500)):print('ZIZINAT_'+str(block)+'_'+str(i)+'='+val[x:x+3500])
           print('SHEET_END',block,len(data.getvalue()))
          print('TOTAL_SOURCE_LICENSED',len(pics))
          PY
