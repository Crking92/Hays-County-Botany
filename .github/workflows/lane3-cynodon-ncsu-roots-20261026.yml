name: Lane 3 source-licensed Cynodon genus roots archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-cynodon-ncsu-roots-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-cynodon-ncsu-rooted-shoot-20261026
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<12"
      - run: |
          git fetch origin main
          git checkout -B main origin/main
      - run: python scripts/lane3_cynodon_ncsu_genus_roots_20261026.py
      - name: Validate photo bytes and strict other-taxon panel
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          root=pathlib.Path("content/taxa/Poaceae/Cynodon/cynodon-dactylon")
          r=json.loads(pathlib.Path("reports/lane3-cynodon-ncsu-rooted-turf-reference-20261026.json").read_text())
          assert r["status"]=="ARCHIVED_GENUS_REFERENCE_NOT_EXACT_SPECIES",r["holds"]
          for a in r["added"]:
              p=pathlib.Path(a["local_file"])
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==a["sha256"]
              with Image.open(p) as im:
                  assert im.format=="JPEG" and not im.getexif().get(34853)
                  im.verify()
          d=json.loads((root/"species.json").read_text())
          p=next(x for x in d["visual_comparison"]["items"] if x.get("creator")=="Scott Zona")
          assert p["scientific_name"]!="Cynodon dactylon"
          assert p["license"]=="CC BY-NC 2.0" and p["markers"]==[]
          assert d["field_id_finish_pass"]["stage"].startswith("FIELD_READY_PHOTO_GAPS")
          print("PASS real credited hybrid/unknown Cynodon roots comparison only")
          PY
      - name: Commit and read back latest canonical species
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-cynodon-ncsu-rooted-turf-reference-20261026.json content/taxa/Poaceae/Cynodon/cynodon-dactylon/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lane 3 archive credited Cynodon genus rooted-shoot photo, not exact dactylon"
          for attempt in 1 2 3 4 5 6 7; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
