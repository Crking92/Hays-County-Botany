name: Lane 3 Texas sixweeks fescue licensed photo gap scout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lane3-sixweeks-fescue-texas-photo-scout-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-sixweeks-texas-source-scout-20261026
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Get current canon and preserve credited original photo records
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('content/taxa/Poaceae/Festuca/festuca-octoflora/species.json').read_text())
          assert d['scientific_name']=='Festuca octoflora'
          assert len(d['images'])>=8
          assert any(x.get('license')=='CC BY-NC' for x in d['images'])
          assert any(x.get('creator')=='Matt Lavin' for x in d['images'])
          print('PASS prior photo and sharealike records preserved')
          PY
      - name: Review current Texas research-grade observation photographs and per-photo CC rights
        run: python scripts/lane3_scout_festuca_octoflora_texas_20261026.py
      - name: Archive research report and contact sheet ONLY, no unverified species JPEGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-festuca-octoflora-texas-scout-20261026.json
          if test -f reports/lane3-festuca-octoflora-texas-scout-20261026.jpg; then
            git add -f reports/lane3-festuca-octoflora-texas-scout-20261026.jpg
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lane 3 collect exact licensed Texas sixweeks fescue photo candidates for anatomy review"
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 4
          done
          test "$pushed" = "1"
