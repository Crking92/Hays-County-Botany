name: Install Dollarweed Licensed Teaching Photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-hydrocotyle-umbellata-finished-photos-20261020.yml"
      - "scripts/manual_hydrocotyle_umbellata_finished_photos_20261020.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-dollarweed-finished-photo-install-20261020
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests Pillow
      - name: Refresh and protect latest photo metadata
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Download exact, legally reusable photos and annotate real anatomy
        run: python scripts/manual_hydrocotyle_umbellata_finished_photos_20261020.py
      - name: Validate six physical images, credit and original
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('content/taxa/Araliaceae/Hydrocotyle/hydrocotyle-umbellata')
          j=json.loads((p/'species.json').read_text())
          assert len(j['images'])==6
          assert j['images'][0]['file']=='images/inat-104164500.jpg'
          assert j['images'][1]['file']=='images/library-review047-4d65eaa1eccd134.jpg'
          assert j['images'][1]['license']=='CC BY 4.0'
          for x in j['images']:
            file=p/x['file']
            assert file.is_file() and file.stat().st_size>20000
            with Image.open(file) as im:im.verify()
            print(x['file'],x['creator'],x['license'])
          assert j['curation_status']['finished_field_id_pass']=='PASS_IN_PROGRESS'
          print("Six physical images, rights and provisional anatomy verified")
          PY
      - name: Commit scoped dollarweed source evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Araliaceae/Hydrocotyle/hydrocotyle-umbellata/ reports/hydrocotyle-umbellata-finished-photo-20261020.json
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "Install four licensed dollarweed anatomy teaching images [skip ci]"
          for n in 1 2 3;do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            sleep 4
          done
          exit 1
