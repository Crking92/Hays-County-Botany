name: Desmanthus licensed photo source probe
on:
  push:
    paths:
      - 'scripts/photo_probe_desmanthus.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query public inaturalist and commons metadata
        run: python scripts/photo_probe_desmanthus.py
      - name: Commit verified source metadata (no images installed)
        run: |
          git config user.name hays-botany-automation
          git config user.email actions@users.noreply.github.com
          git add research-drafts/desmanthus-photo-probe-20261013.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "botany(auto): audit two missing Desmanthus photo sources [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
          done
          exit 1
