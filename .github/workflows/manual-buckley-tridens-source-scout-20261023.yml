name: Audit exact Buckley tridens iNaturalist public-license photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-buckley-tridens-source-scout-20261023.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install public exact-photo preview tools
        run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Discover old-name taxon and true original photo individual rights
        run: python scripts/scout_buckley_tridens_cc_original_photos_20261023.py
      - name: Archive research reports and thumbnails only, no canonical species edits
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/buckley-tridens-inat-original-photo-scout-20261023/
          git commit -m 'Index source-identical Buckley tridens CC photo candidates with preview sheets [skip ci]'
          for n in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
