name: Lane 1 Curlymesquite John Kava hairy-node educational photo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lane1-curlymesquite-kava-hairy-node-20261026.yml'
      - 'scripts/archive_lane1_curlymesquite_kava_hairy_node_20261026.py'
permissions:
  contents: write
concurrency:
  group: lane1-curlymesquite-yavapai-hairy-node
  cancel-in-progress: false
jobs:
  source-license-and-image-verified-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation libraries
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Verify exact botanical image and educational credit permission, archive GPS-free JPEG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/archive_lane1_curlymesquite_kava_hairy_node_20261026.py
