name: Lane 1 kleingrass mature spikelet photo closeout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lane1-kleingrass-spikelet-closeout.yml'
permissions:
  contents: write
concurrency:
  group: lane1-kleingrass-spikelets-single
  cancel-in-progress: false
jobs:
  archive-actual-spikelets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Obtain photographer-identified CC BY 2.0 actual spikelet photograph
        run: |
          python scripts/commons_photo_review_import.py \
            --file-title 'File:Panicum coloratum var makarikariense spikelets1 NWP - Flickr - Macleay Grass Man.jpg' \
            --taxon 'Panicum coloratum' --output review_photo --max-edge 2361
      - name: Validate and store in canonical species folder and gallery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TITLE: 'File:Panicum coloratum var makarikariense spikelets1 NWP - Flickr - Macleay Grass Man.jpg'
        run: python scripts/archive_lane1_kleingrass_anatomy.py
      - name: Save image license/attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane1-kleingrass-source-verified-spikelets-evidence
          path: review_photo/evidence.json
          if-no-files-found: ignore
          retention-days: 30
