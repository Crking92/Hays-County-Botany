name: Lane1 exact-species tobosa attached flowering fan photo
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane1_hilaria_mutica_max_licher_20261027.py
      - .github/workflows/archive-lane1-hilaria-mutica-attached-fans-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-hilaria-mutica-licensed-fans
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Source-verified public-license photo archive
        run: python scripts/archive_lane1_hilaria_mutica_max_licher_20261027.py
      - name: Commit source image and gallery metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Hilaria/hilaria-mutica/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: archive actual tobosa attached flowering fan CC BY-SA photograph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
