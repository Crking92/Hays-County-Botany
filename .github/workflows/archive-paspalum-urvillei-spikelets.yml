name: Archive Paspalum urvillei spikelets
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_paspalum_urvillei_spikelets.py
      - .github/workflows/archive-paspalum-urvillei-spikelets.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-paspalum-urvillei-spikelets
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive independently sourced spikelet details
        run: python scripts/archive_paspalum_urvillei_spikelets.py
      - name: Commit sanitized photos and species record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Paspalum/paspalum-urvillei/
          if ! git diff --cached --quiet; then
            git commit -m "Archive detailed Paspalum urvillei spikelet images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
