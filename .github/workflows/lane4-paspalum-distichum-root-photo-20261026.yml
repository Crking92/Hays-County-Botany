name: Lane 4 publish verified knotgrass rhizome photo
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_paspalum_distichum_root_20261026.py
      - .github/workflows/lane4-paspalum-distichum-root-photo-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-paspalum-distichum-root
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Refresh canonical species before photo install
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Fetch, check and archive real root/rhizome photo
        run: python scripts/lane4_paspalum_distichum_root_20261026.py
      - name: Commit one species with conflict-safe rerun
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add content/taxa/Poaceae/Paspalum/paspalum-distichum/ reports/lane4-paspalum-distichum-root-photo-20261026.json
            if git diff --cached --quiet; then
              echo "No new canonical changes; preserve other work"
              exit 0
            fi
            git commit -m "Lane 4 archive real knotgrass rhizome and root-node photograph"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/lane4_paspalum_distichum_root_20261026.py
          done
          echo "Guarded knotgrass publish attempts exhausted"
          exit 1
