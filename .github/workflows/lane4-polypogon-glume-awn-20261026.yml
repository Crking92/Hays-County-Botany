name: Lane 4 annual beardgrass detached awned spikelet photo
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_polypogon_glume_awn_20261026.py
      - .github/workflows/lane4-polypogon-glume-awn-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-polypogon-glume-awn
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - run: python scripts/lane4_polypogon_glume_awn_20261026.py
      - name: Commit proof-checked local JPEG and gallery markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Polypogon/polypogon-monspeliensis/ reports/lane4-polypogon-spikelet-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 4 archive real CC BY-SA detached Polypogon spikelets and awns"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
