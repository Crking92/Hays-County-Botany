name: Lane 4 annual beardgrass detached awned spikelet photo
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_polypogon_glume_awn_20261026.py
      - .github/workflows/lane4-polypogon-glume-awn-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-polypogon-glume-awn
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - name: Refresh main before touching any species record
        run: |
          git fetch origin main
          git reset --hard origin/main
      - run: python scripts/lane4_polypogon_glume_awn_20261026.py
      - name: Commit proof-checked JPEG with conflict-safe main refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add content/taxa/Poaceae/Polypogon/polypogon-monspeliensis/ reports/lane4-polypogon-spikelet-20261026.json
            if git diff --cached --quiet; then
              echo "No new data required; all original science and photos preserved"
              exit 0
            fi
            git commit -m "Lane 4 archive real CC BY-SA detached Polypogon spikelets and awns"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent grass edit detected; re-read main and regenerate from newest record"
            git fetch origin main
            git reset --hard origin/main
            python scripts/lane4_polypogon_glume_awn_20261026.py
          done
          echo "Publication deferred: four guarded attempts exhausted"
          exit 1
