name: Lane 2 archive real purple and oldfield threeawn anatomy photos
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_threeawns_real_texas_anatomy_20261027.py
      - .github/workflows/lane2-threeawns-install-actual-macros-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-threeawns-photo-archive-20261027
  cancel-in-progress: false
jobs:
  source-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify real exact species, original photograph rights and archive five photos
        run: python scripts/lane2_threeawns_real_texas_anatomy_20261027.py
      - name: Commit five photo bytes, original credit, five visible-only anatomy arrows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Aristida/aristida-purpurea/ content/taxa/Poaceae/Aristida/aristida-oligantha/ reports/lane2-threeawns-matched-collar-mature-awns-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive two true TX threeawn outer collars, reproductive macros and oldfield live tuft"
            # Five scheduled automations write to main concurrently; do not fail an otherwise
            # validated and conflict-free archive on one non-fast-forward race.
            done_push=0
            for attempt in $(seq 1 16); do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Threeawn photos landed on main attempt ${attempt}"
                done_push=1
                break
              fi
              echo "Parallel lane updated main during push attempt ${attempt}; rebasing again"
              sleep 3
            done
            if [ "${done_push}" != 1 ]; then
              echo "No force push permitted; retaining original photo rights checks and failing closed"
              exit 1
            fi
          fi
