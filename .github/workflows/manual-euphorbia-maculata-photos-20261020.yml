name: Install licensed spotted spurge macro photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-maculata-photos-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maculata-photo-intake
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests
      - run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Download and verify four public reusable exact species photos
        run: python scripts/manual_euphorbia_maculata_commons_public_20261020.py
      - name: Guard original copyright and new files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          b=Path("content/taxa/Euphorbiaceae/Euphorbia/euphorbia-maculata")
          j=json.loads((b/"species.json").read_text())
          assert j["scientific_name"]=="Euphorbia maculata"
          assert len(j["images"])==5
          assert j["images"][0]["license"]=="CC BY-NC"
          assert all(i["public_reuse"]=="yes" and i["license"] in ("CC BY-SA 4.0","CC BY 2.0") for i in j["images"][1:])
          for x in j["images"][1:]:
            f=b/x["file"]
            assert f.is_file() and f.stat().st_size>14000
            with Image.open(f) as im:
              assert min(im.size)>=600
              im.verify()
          print("PASS: four individually credited reusable photos, legacy research photo unmodified")
          PY
      - name: Commit only source verified photos and citation record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Euphorbiaceae/Euphorbia/euphorbia-maculata/ reports/euphorbia-maculata-commons-install-20261020.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Install four CC licensed Euphorbia maculata photo roles"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
