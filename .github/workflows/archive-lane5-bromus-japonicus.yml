name: Lane 5 Japanese brome anatomical photograph
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane5_bromus_japonicus_spikelets.py
      - .github/workflows/archive-lane5-bromus-japonicus.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane5-bromus-japonicus-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_lane5_bromus_japonicus_spikelets.py
      - name: Commit verified photo and updated species gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Bromus/bromus-japonicus/ reports/lane5-bromus-japonicus-anatomy-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish licensed Japanese brome reproductive close-up"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
