name: Correct Dichondra recurvata Flower Arrow
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-dichondra-recurvata-fix-arrow-20261019.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: targeted-recurvata-one-image-arrow-correction
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow requests
      - run: python scripts/manual_dichondra_recurvata_fix_flower_pointer_20261019.py
      - name: Verify flower license and all seven existing physical images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('content/taxa/Convolvulaceae/Dichondra/dichondra-recurvata')
          s=json.loads((root/'species.json').read_text())
          assert len(s['images'])==7
          ref=next(x for x in s['images'] if x['file'].endswith('research-five-lobed-flower.jpg'))
          assert ref['arrow_corrected_20261019'] and ref['license']=='CC BY'
          for x in s['images']:
            file=root/x['file']
            assert file.stat().st_size>24000
            with Image.open(file) as im:im.verify()
          print('Verified seven intact photos, corrected arrow, public license preserved')
          PY
      - name: Commit corrected species only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Convolvulaceae/Dichondra/dichondra-recurvata/
          if git diff --cached --quiet; then exit 0;fi
          git commit -m "Correct recurvata corolla arrow and qualify unconfirmed hooked organ [skip ci]"
          for n in 1 2 3;do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0;fi
            sleep 4
          done
          exit 1
