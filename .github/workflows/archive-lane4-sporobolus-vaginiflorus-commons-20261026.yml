name: Archive Lane 4 poverty dropseed licensed anatomy
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane4_sporobolus_vaginiflorus_commons_20261026.py
      - .github/workflows/archive-lane4-sporobolus-vaginiflorus-commons-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-lane4-poverty-dropseed-commons
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Validate photo rights, download and sanitize source-specific media
        run: python scripts/archive_lane4_sporobolus_vaginiflorus_commons_20261026.py
      - name: Commit only actual verified image bytes and matching gallery records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Sporobolus/sporobolus-vaginiflorus/
          if ! git diff --staged --quiet; then
            git commit -m "Archive Lane 4 poverty dropseed licensed spikelet anatomy photo evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
