name: External Licensed First-Photo Fast Fill

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum zero-photo taxa to fill, 1-12"
        type: string
        required: true
        default: "8"
      max_attempts:
        description: "Maximum zero-photo taxa searched"
        type: string
        required: true
        default: "22"
  push:
    paths:
      - .github/workflows/zero-photo-external-quick-fill.yml
      - workflow/zero-photo-external-quick-fill/request.json

permissions:
  contents: write

concurrency:
  group: zero-photo-external-quick-fill
  cancel-in-progress: false

jobs:
  first-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Find individual reusable exact-species photo sources and fill true zero cards
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_BATCH: ${{ github.event.inputs.batch_size || '8' }}
          RUN_ATTEMPTS: ${{ github.event.inputs.max_attempts || '22' }}
        run: |
          python - <<'PY'
          import json,os,subprocess,pathlib
          args=json.loads(pathlib.Path("workflow/zero-photo-external-quick-fill/request.json").read_text())
          def v(k,e):
              return os.getenv(e) if os.getenv("RUN_EVENT")=="workflow_dispatch" else str(args[k])
          cmd=["python","scripts/zero_photo_external_quick_fill.py",
               "--batch-size",v("batch_size","RUN_BATCH"),
               "--max-attempts",v("max_attempts","RUN_ATTEMPTS")]
          subprocess.run(cmd,check=True)
          PY
      - name: Verify every source file and license on disk
        run: |
          python - <<'PY'
          import json,pathlib
          from PIL import Image
          report=json.loads(pathlib.Path("reports/external-first-photo-batch-latest.json").read_text())
          for row in report["installed"]:
              file=pathlib.Path(row["file"])
              assert file.is_file() and file.stat().st_size>17000
              with Image.open(file) as im:im.verify()
              doc=json.loads((file.parent.parent/"species.json").read_text())
              photos=[p for p in doc["images"] if str(p.get("photo_id"))==str(row["photo_id"])]
              assert len(photos)==1
              assert photos[0]["license"] in ["CC0 1.0","CC BY 4.0","CC BY-SA 4.0"]
              assert photos[0]["source_page"].startswith("https://www.inaturalist.org/photos/")
              print("VERIFIED",row["id"],row["photo_id"])
          print("Installed photo count:",len(report["installed"]))
          PY
      - name: Commit only vetted source files and updated galleries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/ reports/external-first-photo-batch-latest.json reports/photo-fast-fill-zero-queue.json reports/photo-coverage-latest.json
          if git diff --cached --quiet; then
            echo "No eligible new images"
            exit 0
          fi
          git commit -m "Install provisional licensed first-photo batch [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Saved canonical first-photo coverage"
              exit 0
            fi
            sleep 4
          done
          exit 1
      - name: Keep audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-first-photo-fast-fill-audit
          path: reports/external-first-photo-batch-latest.json
          retention-days: 30
