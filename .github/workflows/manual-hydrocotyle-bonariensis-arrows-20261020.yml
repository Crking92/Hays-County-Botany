name: Annotate Bonariensis Floral Rays and Peltate Petiole
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-hydrocotyle-bonariensis-arrows-20261020.yml"
      - "scripts/manual_hydrocotyle_bonariensis_anatomy_arrows_20261020.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-species-bonariensis-three-anatomy-arrows
  cancel-in-progress: false
jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests Pillow
      - run: python scripts/manual_hydrocotyle_bonariensis_anatomy_arrows_20261020.py
      - name: Validate full six-photo gallery, 3 amended JPEGs, source attribution, and conservation holds
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          p=Path('content/taxa/Araliaceae/Hydrocotyle/hydrocotyle-bonariensis')
          c=json.loads((p/'species.json').read_text())
          assert len(c['images'])==6 and c['project_inclusion']['native_metrics_excluded'] is True
          assert c['project_inclusion']['target_zone_status']=='UNRESOLVED'
          assert c['curation_status']['finished_field_id_pass']=='PASS_IN_PROGRESS'
          labeled=[z for z in c['images'] if z.get('manual_arrow_review')=='2026-10-20-final-pixel-correction']
          assert len(labeled)==3
          for x in c['images']:
            f=p/x['file']
            assert f.is_file() and f.stat().st_size>25000
            assert x['source_page'] and x['creator'] and x['license']=='CC BY'
            with Image.open(f) as image:image.verify()
          print('3 anatomical labels installed and real JPEG bytes verified, taxonomic HOLD untouched.')
          PY
      - name: Commit only one species revised images and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Araliaceae/Hydrocotyle/hydrocotyle-bonariensis/
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "Annotate exact CC bonariensis primary ray/branchpoint and peltate petiole views [skip ci]"
          for attempt in 1 2 3;do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            sleep 4
          done
          exit 1
