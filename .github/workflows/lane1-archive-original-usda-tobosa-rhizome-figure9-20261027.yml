name: Lane1 archive real 1939 USDA Tobosa underground rhizome photo
on:
  push:
    branches: [main]
    paths:
      - scripts/lane1_archive_real_1939_usda_tobosa_rhizomes_20261027.py
      - .github/workflows/lane1-archive-original-usda-tobosa-rhizome-figure9-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-real-tobosa-usda1939-rhizome
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane1_archive_real_1939_usda_tobosa_rhizomes_20261027.py
            content/taxa/Poaceae/Hilaria/hilaria-mutica/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf Pillow
      - name: Verify original public-domain USDA plate, crop source photograph and preserve provenance
        run: python scripts/lane1_archive_real_1939_usda_tobosa_rhizomes_20261027.py
      - name: Commit original photographic plate and accurate metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Hilaria/hilaria-mutica/
          if ! git diff --cached --quiet; then
            git commit -m "Lane1: install actual 1939 USDA photographed Tobosa underground rhizome"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Historic Tobosa photo archived successfully"
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
