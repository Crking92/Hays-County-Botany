name: Archive Catapodium rigidum ligules
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_catapodium_rigidum_ligules.py
      - .github/workflows/archive-catapodium-rigidum-ligules.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-catapodium-rigidum-ligules
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_catapodium_rigidum_ligules.py
      - name: Commit locally archived photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Catapodium/catapodium-rigidum/ reports/catapodium-rigidum-ligule-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Catapodium rigidum ligule close-ups"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
