name: Refresh Photo Coverage Audit
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/refresh-photo-coverage-audit.yml
permissions:
  contents: write
concurrency:
  group: refresh-photo-coverage-audit
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Recount all canonical gallery photos and source-concept holds
        run: python scripts/refresh_photo_coverage_snapshot.py
      - name: Commit coverage audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/photo-coverage-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh verified photo coverage and distinguish taxonomy hold [skip ci]"
          for n in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
