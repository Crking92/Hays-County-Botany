name: Screen Johnsongrass Public Photo Candidates
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-sorghum-halepense-photo-screen-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-sorghum-halepense-screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow requests
      - run: python scripts/manual_sorghum_halepense_photo_screen_20261020.py
      - name: Archive candidate preview contact, not yet canonical
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/photo-library/reviews/sorghum-halepense-20261020/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive source-licensed Johnsongrass anatomy candidates [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
