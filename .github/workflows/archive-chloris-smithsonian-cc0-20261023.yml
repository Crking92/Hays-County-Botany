name: Archive Chloris Smithsonian CC0 specimen
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-chloris-smithsonian-cc0-20261023.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chloris-smithsonian-cc0
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Attempt exact-species CC0 photo archival with verification or hold
        run: python scripts/archive_chloris_smithsonian_cc0_20261023.py
      - name: Commit verified photographs or explicit holds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Chloris/chloris-andropogonoides/ reports/chloris-smithsonian-cc0-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Smithsonian Chloris CC0 archive result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
