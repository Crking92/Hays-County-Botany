name: Install European Black Nightshade Fast Field Card
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-solanum-nigrum-firstcard-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-solanum-nigrum-first-card-20261020
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image decoder and authenticated source HTTP client
        run: python -m pip install --disable-pip-version-check requests 'Pillow>=10,<12'
      - name: Install physically validated exact-species photographs and publish marker
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/manual_solanum_nigrum_firstcard_20261020.py
          python scripts/manual_solanum_nigrum_firstcard_20261020.py
      - name: Check real bytes, per-photo share-alike and introduced status
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path("content/taxa/Solanaceae/Solanum/solanum-nigrum")
          j=json.loads((root/"species.json").read_text())
          m=json.loads(Path("data/manifest.json").read_text())
          genus=json.loads(Path("content/taxa/Solanaceae/Solanum/genus.json").read_text())
          assert j["scientific_name"]=="Solanum nigrum"
          assert j["native_metrics_excluded"] is True
          assert j["project_inclusion"]["target_zone_status"]=="COMPARISON_NONNATIVE"
          assert len([x for x in m["species"] if x["id"]=="solanum-nigrum"])==1
          assert "solanum-nigrum" in genus["project_scope"]["species_ids"]
          assert 1<=len(j["images"])<=3
          assert len(j["visual_comparison"]["items"])==len(j["images"])
          for r in j["images"]:
            assert r["creator"] and r["source_page"].startswith("https://commons.wikimedia.org/wiki/File:")
            assert r["license"]=="CC BY-SA 3.0" and r["license_url"]
            assert "adaptation" in r["derivative_licensing"].lower()
            f=root/r["file"]
            assert f.stat().st_size>20000
            with Image.open(f) as p:p.verify()
            print("VERIFIED PHOTO",r["file"],r["creator"],r["license"])
          marker=json.loads(Path("workflow/field-id-publication/2026-10-20-solanum-nigrum-first-card.json").read_text())
          assert marker["licensed_photo_count"]==len(j["images"])
          print("PASS:",len(j["images"]),"rights-cleared photos installed and new species ready for publication")
          PY
      - name: Publish only verified narrow first-card files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Solanaceae/Solanum/solanum-nigrum/ \
                  content/taxa/Solanaceae/Solanum/genus.json data/manifest.json \
                  workflow/field-id-publication/2026-10-20-solanum-nigrum-first-card.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Install source-verified S nigrum crew field card with explicit nonnative status [skip ci]"
          for k in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Canonical first-card and single publication marker pushed.";exit 0
            fi
            git rebase --abort || true
            sleep 4
          done
          echo "Blocked by concurrent update; never force-push"
          exit 1
