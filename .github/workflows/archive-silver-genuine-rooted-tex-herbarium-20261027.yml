name: Silver bluestem archive two real rooted Texas preserved vouchers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-silver-genuine-rooted-tex-herbarium-20261027.yml
      - scripts/archive_silver_texas_herbarium_rooted_20261027.py
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: silver-bluestem-genuine-rooted-tex-herbarium-20261027
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            content/taxa/Poaceae/Bothriochloa/bothriochloa-torreyana
            reports
            workflow/field-id-publication
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Archive exact local taxon-labelled TEX herbarium images
        run: |
          python -m py_compile scripts/archive_silver_texas_herbarium_rooted_20261027.py
          python scripts/archive_silver_texas_herbarium_rooted_20261027.py
      - name: Verify individual CC rights, image bytes and exact attached root roles
        run: |
          python - <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,"scripts")
          from build_public_pages_snapshot import rights
          from public_photo_rights_preflight import photo_rights
          root=Path("content/taxa/Poaceae/Bothriochloa/bothriochloa-torreyana")
          s=json.loads((root/"species.json").read_text(encoding="utf-8"))
          r=json.loads(Path("reports/silver-torreyana-texas-two-rooted-herbarium-20261027.json").read_text())
          assert s["id"]=="bothriochloa-torreyana" and not s["native_target_zone_calculated"]
          for rec in r["items"]:
            if rec["status"]!="ARCHIVED":continue
            f=Path(rec["file"])
            assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==rec["sha256"]
            with Image.open(f) as im:
              assert im.format=="JPEG" and max(im.size)>=2600 and not im.getexif()
              im.verify()
            x=next(i for i in s["images"] if i.get("source_gbif_key")==rec["key"])
            p=next(p for p in s["visual_comparison"]["items"] if p.get("source_page")=="https://www.gbif.org/occurrence/"+str(rec["key"]))
            for z in (x,p):
              assert z["license"]=="CC BY 4.0"
              assert z["creator"]=="The University of Texas at Austin, TEX Herbarium"
              assert rights(z,True)[0],(rec["key"],rights(z,True))
              assert photo_rights(z,True) is None,(rec["key"],photo_rights(z,True))
            assert len(p["markers"])==2
            for m in p["markers"]:
              assert all(0<=m[k]<=100 for k in ["label_x","label_y","target_x","target_y"])
            assert "rhizome" in p["caption"].lower() or "roots" in p["caption"].lower()
          if 3921136348 in [x["key"] for x in r["items"] if x["status"]=="ARCHIVED"]:
            assert s["silver_six_role_photo_score_20261027"]["total"]==4.5
            assert s["silver_six_role_photo_score_20261027"]["pct"]==75.0
            assert s["silver_six_role_photo_score_20261027"]["roles"][0]["score"]==1
          print("ARCHIVED",r["installed_count"],"real rooted preserved Texas plants; full herbarium-media license and exact photo evidence validated")
          PY
      - name: Commit only validated TEX sheets and synchronized silver learner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Bothriochloa/bothriochloa-torreyana/
          git add reports/silver-torreyana-texas-two-rooted-herbarium-20261027.json
          if test -f workflow/field-id-publication/2026-10-27-silver-genuine-texas-roots-75pct.json; then
            git add workflow/field-id-publication/2026-10-27-silver-genuine-texas-roots-75pct.json
          fi
          if git diff --cached --quiet; then echo NO_VALID_SOURCE_IMAGES_FOUND; exit 0; fi
          git commit -m 'Archive real CC BY rooted Texas silver bluestem TEX herbarium specimens'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
