name: Lane 4 archive Dichanthelium lindheimeri CC photos
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_dichanthelium_lindheimeri_cc.py
      - .github/workflows/lane4-dichanthelium-lindheimeri-cc.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-dichanthelium-lindheimeri
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane4_archive_dichanthelium_lindheimeri_cc.py
      - name: Commit only validated real images and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Dichanthelium/dichanthelium-lindheimeri/ reports/lane4-dichanthelium-lindheimeri-cc-photo-attempt.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 4 archive verified Dichanthelium lindheimeri CC photographs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
