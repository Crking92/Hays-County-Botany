name: Lane 5 cane bluestem paired spikelets
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane5_cane_bluestem_spikelets.py
      - .github/workflows/archive-lane5-cane-bluestem-spikelets.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane5-cane-bluestem-spikelets
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_lane5_cane_bluestem_spikelets.py
      - name: Commit verified local JPEG and revised gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Bothriochloa/bothriochloa-barbinodis/ reports/lane5-bothriochloa-barbinodis-paired-spikelets-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive cane bluestem real paired spikelets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
