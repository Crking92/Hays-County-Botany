name: Lane1 curlymesquite real young heads CC0 photo
on:
  push:
    branches: [main]
    paths:
      - scripts/lane1_archive_curlymesquite_immature_green_heads_cc0_20261027.py
      - .github/workflows/lane1-curlymesquite-early-heads-cc0-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-curlymesquite-real-early-reproductive-heads
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane1_archive_curlymesquite_immature_green_heads_cc0_20261027.py
            content/taxa/Poaceae/Hilaria/hilaria-belangeri/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive original source-checked CC0 young flowering-head photo
        run: python scripts/lane1_archive_curlymesquite_immature_green_heads_cc0_20261027.py
      - name: Commit JPEG and exact species teaching panels, retry concurrent pushes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Hilaria/hilaria-belangeri/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: add actual green purple curlymesquite young flowering CC0 photo"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "photo published"
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
