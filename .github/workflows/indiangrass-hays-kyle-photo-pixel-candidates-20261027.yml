name: Indiangrass Hays Kyle Blanco Austin local exact photo rights and pixel review
on:
  push:
    branches: [main]
    paths: [.github/workflows/indiangrass-hays-kyle-photo-pixel-candidates-20261027.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Review locally relevant original iNaturalist photos without adding repo assets
        run: |
          python - <<'PY'
          import json,io,base64,math
          from urllib.request import urlopen,Request
          from PIL import Image,ImageOps,ImageDraw
          UA={'User-Agent':'HaysBotanyVisualLearner/1.0 source specific photo review'}
          obsids=[390669128,347987760,410532698,330147503,407671121]
          images=[]
          for oid in obsids:
            try:
              with urlopen(Request(f'https://api.inaturalist.org/v1/observations/{oid}',headers=UA),timeout=48) as f:o=json.load(f)['results'][0]
              assert o['taxon']['name']=='Sorghastrum nutans' and o.get('quality_grade')=='research'
              print('LOCAL_SOURCE',json.dumps({'obs':oid,'user':o['user']['login'],'place':o.get('place_guess'),'taxon':o['taxon']['name'],'grade':o['quality_grade'],'photos':len(o['photos'])}))
              for p in o['photos']:
                lic=p.get('license_code')
                if lic not in {'cc0','cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa'}:
                  print('RIGHTS_HOLD',p['id'],lic);continue
                link=str(p.get('url','')).replace('/square.','/large.').replace('/medium.','/large.')
                try:
                  with urlopen(Request(link,headers=UA),timeout=42) as f:raw=f.read(8000001)
                  if len(raw)>8000000:raise ValueError('too large')
                  with Image.open(io.BytesIO(raw)) as orig:
                    im=ImageOps.exif_transpose(orig).convert('RGB');dims=im.size
                  im.thumbnail((570,485))
                  images.append((oid,p['id'],lic,im,dims,p.get('attribution')))
                  print('LOCAL_PHOTO',json.dumps({'obs':oid,'id':p['id'],'license':lic,'creator':p.get('attribution'),'width':dims[0],'height':dims[1],'page':'https://www.inaturalist.org/photos/'+str(p['id'])},ensure_ascii=False))
                except Exception as e:print('PIXEL_HOLD',p['id'],str(e)[:220])
            except Exception as e:print('OBS_HOLD',oid,str(e)[:230])
          print('SOURCE_USABLE_PIXELS',len(images))
          for block in range(math.ceil(len(images)/6)):
            canvas=Image.new('RGB',(1860,1130),'white');draw=ImageDraw.Draw(canvas)
            for q,(oid,pid,lic,im,dims,author) in enumerate(images[block*6:(block+1)*6]):
              x=q%3*620;y=q//3*565
              canvas.paste(im,(x+(620-im.width)//2,y+(495-im.height)//2))
              draw.text((x+8,y+505),f'{oid} photo {pid} {lic}',fill='black')
              draw.text((x+8,y+526),f'{dims[0]}x{dims[1]}',fill='black')
            buff=io.BytesIO();canvas.save(buff,'JPEG',quality=73,optimize=True)
            encoded=base64.b64encode(buff.getvalue()).decode()
            print('INDIAN_LOCAL_SHEET_BEGIN',block,len(buff.getvalue()))
            for index,start in enumerate(range(0,len(encoded),3500)):print(f'INDIAN_LOCAL_SHEET_{block}_{index}='+encoded[start:start+3500])
            print('INDIAN_LOCAL_SHEET_END',block)
          PY
