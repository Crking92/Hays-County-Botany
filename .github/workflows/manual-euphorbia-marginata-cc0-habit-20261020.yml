name: Install E marginata CC0 whole plant photograph
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-marginata-cc0-habit-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-euphorbia-marginata-cc0-habit
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests
      - run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Install original source-labelled public-domain full plant photo
        run: python scripts/manual_euphorbia_marginata_cc0_habit_20261020.py
      - name: Validate source file and preserve existing restricted source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          b=Path("content/taxa/Euphorbiaceae/Euphorbia/euphorbia-marginata")
          j=json.loads((b/"species.json").read_text())
          assert j["project_inclusion"]["target_zone_status"]=="PASS"
          assert len(j["images"])==4
          assert j["images"][2]["license"]=="CC BY-NC 4.0"
          photo=j["images"][3]
          assert photo["license"]=="CC0 1.0" and photo["public_reuse"]=="yes"
          assert photo["source_page"].startswith("https://commons.wikimedia.org/")
          assert photo["original_image_sha256"]
          path=b/photo["file"]
          assert path.is_file() and path.stat().st_size>30000
          with Image.open(path) as img:
            assert img.width>=700 and img.height>=700
            img.verify()
          print("PASS original CC0 source photo installed and CC BY-NC historical research source preserved")
          PY
      - name: Commit only photo, species metadata and source QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Euphorbiaceae/Euphorbia/euphorbia-marginata/ reports/euphorbia-marginata-cc0-habit-install-20261020.json
          if git diff --cached --quiet; then echo "Already installed"; exit 0; fi
          git commit -m "Install CC0 source-labelled whole E marginata image"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
