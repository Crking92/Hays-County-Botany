name: Lane 3 sixweeks fescue living-root and ligule photo scouting
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-sixweeks-photo-source-scout-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-sixweeks-source-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Validate canonical species and synonym hold
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('content/taxa/Poaceae/Festuca/festuca-octoflora/species.json').read_text())
          assert d['id']=='festuca-octoflora'
          assert len(d['images'])>=3
          print('Source uses synonymous Vulpia octoflora but NO new species admission')
          PY
      - name: Exact synonymous species license and visual source-screen
        run: python scripts/lane3_scout_festuca_octoflora_public_20261026.py
      - name: Commit only photo-source evidence not uninspected card
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-festuca-octoflora-photo-scout-20261026.json
          if test -f reports/lane3-festuca-octoflora-photo-scout-20261026.jpg; then
            git add -f reports/lane3-festuca-octoflora-photo-scout-20261026.jpg
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lane 3 screen source-licensed sixweeks fescue anatomical images"
          for n in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
