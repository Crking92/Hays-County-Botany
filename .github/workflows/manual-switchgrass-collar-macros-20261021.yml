name: Manually install switchgrass collar and spikelet diagnostic photos
on:
  push:
    paths:
      - .github/workflows/manual-switchgrass-collar-macros-20261021.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: switchgrass-20261021-collar-and-spikelets
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12"
      - name: Verify author and photo-specific CC BY-SA; physically install photo and anatomy lesson
        run: python scripts/manual_switchgrass_commons_collar_spikelets_20261021.py
      - name: Validate real images, attribution, anatomy arrow coordinates, native science preserved
        run: |
          python - <<'PY'
          import json,pathlib
          from PIL import Image
          p=pathlib.Path("content/taxa/Poaceae/Panicum/panicum-virgatum/species.json")
          gp=pathlib.Path("content/taxa/Poaceae/Panicum/genus.json")
          s=json.loads(p.read_text());g=json.loads(gp.read_text())
          assert s["id"]=="panicum-virgatum" and s["scientific_name"]=="Panicum virgatum"
          assert s["project_inclusion"]["target_zone_status"]=="PASS"
          assert g["name"]=="Panicum"
          q=[x for x in s["images"] if "stefan-lefnaer-cc-by-sa-4-" in str(x.get("file",""))]
          assert len(q)==2
          for x in q:
            assert x["license"]=="CC BY-SA 4.0" and x["creator"]=="Stefan.lefnaer"
            assert x["public_reuse"]=="yes" and x["source_page"].startswith("https://commons.wikimedia.org/wiki/File:")
            img=p.parent/x["file"]
            assert img.is_file() and img.stat().st_size>55000
            with Image.open(img) as im: im.verify()
            print("Image verified",img)
          a=[x for x in s["visual_comparison"]["items"] if "stefan-lefnaer-cc-by-sa-4-" in x.get("image_url","")]
          b=[x for x in g["visual_comparison"]["items"] if "stefan-lefnaer-cc-by-sa-4-" in x.get("image_url","")]
          assert len(a)==len(b)==2 and sum(len(x["markers"]) for x in a)==6
          for panel in a+b:
             assert panel["creator"]=="Stefan.lefnaer"
             assert panel["license"]=="CC BY-SA 4.0"
             for marker in panel["markers"]:
               for k in ("label_x","label_y","target_x","target_y"):
                 assert 0<=marker[k]<=100,(marker,k)
          assert len(g.get("comparison_cards",[]))>=5
          print("Verified public learner 2 macro panels, 6 annotations, 4 Panicums preserved")
          PY
      - name: Commit only Panicum virgatum species media and parent genus lesson
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Panicum/panicum-virgatum/ content/taxa/Poaceae/Panicum/genus.json
          if git diff --cached --quiet; then echo "Already installed, no commit"; exit 0; fi
          git commit -m "Install two public switchgrass collar and spikelet photos with 6 anatomy arrows [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
