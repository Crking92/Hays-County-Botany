name: Lane 5 little barley photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane5_hordeum_pusillum.py
      - .github/workflows/archive-lane5-hordeum-pusillum.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane5-hordeum-pusillum
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_lane5_hordeum_pusillum.py
      - name: Publish locally archived photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Hordeum/hordeum-pusillum/ reports/lane5-hordeum-pusillum-photo-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive little barley reproductive and habitat photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
