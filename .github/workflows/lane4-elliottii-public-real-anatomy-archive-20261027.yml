name: Lane4 Elliott slender indiangrass real CC diagnostic photo archive
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_elliottii_researchgrade_public_anatomy_20261027.py
      - .github/workflows/lane4-elliottii-public-real-anatomy-archive-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-elliottii-public-real-source-photo-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/lane4_archive_elliottii_researchgrade_public_anatomy_20261027.py
            content/taxa/Poaceae/Sorghastrum/sorghastrum-elliottii
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify exact original Sorghastrum taxon, research status and per-image CC license
        run: python scripts/lane4_archive_elliottii_researchgrade_public_anatomy_20261027.py
      - name: Commit EXIF-free actual species source originals without changing scientific hold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse content/taxa/Poaceae/Sorghastrum/sorghastrum-elliottii/ reports/lane4-elliottii-licensed-photo-archive-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane4 archive seven strictly CC source Sorghastrum elliottii real anatomy photos"
            pushed=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 3
            done
            test "$pushed" = 1
          fi
