name: Diagnostic Library Photo Review 032

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/manual-library-photo-review-032.yml

permissions:
  contents: write

concurrency:
  group: manual-library-photo-review-032
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contact-sheet tools
        run: python -m pip install Pillow
      - name: Verify permanent Release archives and make readable image comparison sheets
        run: python scripts/manual_library_photo_contact_032.py
      - name: Publish review-only thumbnails, no canonical changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/manual-library-review-032-20261016/
          git commit -m "Stage visual comparison sheets for library-first photo review 032 [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
