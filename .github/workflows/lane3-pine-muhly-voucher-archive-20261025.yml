name: Lane 3 archive Smithsonian pine muhly reference voucher
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane3-pine-muhly-voucher-archive-20261025.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane3_pine_muhly_smithsonian_voucher_20261025.py
      - name: Commit verified voucher image, safe conflict retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-pine-muhly-voucher-archive-20261025.json content/taxa/Poaceae/Muhlenbergia/muhlenbergia-dubia/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 3 archive Smithsonian CC0 voucher photo for pine muhly"
            pushed=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 3
            done
            test "$pushed" = "1"
          fi
