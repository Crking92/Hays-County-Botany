name: Triodanis licensed-photo audit
on:
  push:
    paths:
      - scripts/triodanis_photo_audit_once.py
      - .github/workflows/triodanis-license-audit-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/triodanis_photo_audit_once.py
      - name: Save evidence
        run: |
          git config user.name hays-botany-automation
          git config user.email actions@users.noreply.github.com
          git add research-drafts/triodanis-photo-evidence-20261013.json
          if ! git diff --cached --quiet; then
            git commit -m "botany(auto): Triodanis photo evidence [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
