name: Archive grass anatomy batch 003
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_grass_anatomy_batch_003.py
      - .github/workflows/archive-grass-anatomy-batch-003.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grass-anatomy-batch-003
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive image-level licensed grass diagnostic photography
        run: python scripts/archive_grass_anatomy_batch_003.py
      - name: Commit photos and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Poa/poa-annua/ content/taxa/Poaceae/Hordeum/hordeum-pusillum/ content/taxa/Poaceae/Festuca/festuca-octoflora/ reports/grass-anatomy-archive-003-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive close grass spikelet awn floret anatomy photographs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
