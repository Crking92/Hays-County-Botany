name: Lane 2 Reverchon original-pixel true flowering tuft source review
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lane2-reverchonii-original-pixel-final-review-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Inspect original exact-species licensed Duval and La Salle plants
        run: |
          python - <<'PY'
          import json,base64,io
          from urllib.request import Request,urlopen
          from PIL import Image,ImageDraw,ImageOps
          UA={'User-Agent':'HaysBotanyVisualLearner/1.0 original exact licensed field plant review'}
          selected=[(681610420,372988761),(681610423,372988761),(659214703,361225055),(659214745,361225055)]
          cache={}
          canvas=Image.new('RGB',(2*900,2*925),'white');d=ImageDraw.Draw(canvas)
          for i,(pid,oid) in enumerate(selected):
              if oid not in cache:
                  with urlopen(Request('https://api.inaturalist.org/v1/observations/'+str(oid),headers=UA),timeout=40) as h:
                      cache[oid]=json.load(h)['results'][0]
              o=cache[oid]; assert o['taxon']['name']=='Setaria reverchonii' and o.get('quality_grade')=='research'
              p=next(p for p in o['photos'] if p['id']==pid)
              assert p.get('license_code') in {'cc0','cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa'}
              with urlopen(Request(f'https://inaturalist-open-data.s3.amazonaws.com/photos/{pid}/original.jpg',headers=UA),timeout=40) as h:raw=h.read(10_000_001)
              assert len(raw)<10_000_001
              with Image.open(io.BytesIO(raw)) as x:
                  im=ImageOps.exif_transpose(x).convert('RGB');dims=im.size
              im.thumbnail((885,870))
              x=(i%2)*900;y=(i//2)*925
              canvas.paste(im,(x+(900-im.width)//2,y+(870-im.height)//2+5))
              d.text((x+15,y+884),f'photo={pid} obs={oid} {p.get("license_code")}',fill='black')
              print('ORIGINAL',json.dumps({'photo':pid,'obs':oid,'size':dims,'bytes':len(raw),'attribution':p.get('attribution'),'license':p.get('license_code'),'source':'https://www.inaturalist.org/photos/'+str(pid)}))
          buff=io.BytesIO();canvas.save(buff,'JPEG',quality=84,optimize=True)
          val=base64.b64encode(buff.getvalue()).decode('ascii')
          for i,k in enumerate(range(0,len(val),3500)):print('ORIGINAL_CONTACT_'+str(i)+'='+val[k:k+3500])
          print('ORIGINAL_CONTACT_DONE',len(buff.getvalue()))
          PY
