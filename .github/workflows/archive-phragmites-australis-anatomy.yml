name: Archive Phragmites australis anatomy
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_phragmites_australis_anatomy.py
      - .github/workflows/archive-phragmites-australis-anatomy.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-phragmites-australis-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_phragmites_australis_anatomy.py
      - name: Commit credited anatomy photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Phragmites/phragmites-australis/ reports/phragmites-australis-anatomy-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Phragmites ligule and spikelet anatomy"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
