name: Build crew Page 3 real-photo growth habit comparison
on:
  push:
    branches: [main]
    paths: [.github/workflows/build-page03-real-growth-habits-20261028.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crew-page3-real-growth-photo-20261028
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/build_page03_real_growth_habits_20261028.py
            content/taxa/Poaceae/Schizachyrium/schizachyrium-scoparium/images/01-field-reference.jpeg
            content/taxa/Poaceae/Cynodon/cynodon-dactylon/images/jimmex-410585094-stolon-leafy-node.jpg
            content/taxa/Poaceae/Sorghum/sorghum-halepense/images/commons-moadeeb-johnsongrass-rhizome.jpg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'reportlab>=4,<5'
      - name: Build printable page 3 and archive credited real photos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_page03_real_growth_habits_20261028.py
