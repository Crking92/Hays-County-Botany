name: Archive Urochloa reptans images
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_urochloa_reptans_photo_recovery.py
      - .github/workflows/archive-urochloa-reptans-recovery.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-urochloa-reptans-recovery
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_urochloa_reptans_photo_recovery.py
      - name: Commit photos and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Urochloa/urochloa-reptans/ reports/urochloa-reptans-one-photo-recovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive eligible Urochloa reptans teaching photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
