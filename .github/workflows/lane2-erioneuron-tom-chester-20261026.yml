name: Lane 2 archive Tom Chester permission-cleared hairy tridens field photos
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_erioneuron_tom_chester_20261026.py
      - .github/workflows/lane2-erioneuron-tom-chester-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-erioneuron-tom-chester-20261026
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - name: Check Tom Chester source copyright exception and archive original JPEGs with six photo-supported annotations
        run: python scripts/lane2_erioneuron_tom_chester_20261026.py
      - name: Commit actual JPEGs, rights report, source credits and canonical photo gallery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Erioneuron/erioneuron-pilosum/ reports/lane2-erioneuron-tom-chester-field-photo-rights-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive three Tom Chester permitted hairy tridens field macros and six justified arrows"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
