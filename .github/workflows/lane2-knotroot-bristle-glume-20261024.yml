name: Lane 2 knotroot bristle and glume macro install
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_archive_setaria_parviflora_bract_macro_20261024.py
      - .github/workflows/lane2-knotroot-bristle-glume-20261024.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-knotroot-bristle-glume
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/lane2_archive_setaria_parviflora_bract_macro_20261024.py
      - name: Save licensed original photo and teaching gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Setaria/setaria-parviflora/ reports/lane2-setaria-parviflora-bristle-glume-20261024.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive measured knotroot bristles and original labelled glumes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
