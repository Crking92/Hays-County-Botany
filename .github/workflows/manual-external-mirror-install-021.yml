name: Install Amphiachyris Reviewed Local Photo 021
on:
  push:
    paths:
      - .github/workflows/manual-external-mirror-install-021.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-external-mirror-install-021
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Match individual reviewed photo pixels, preserve scientific metadata and CC BY-NC rights
        run: python scripts/manual_external_mirror_install_021.py
      - name: Verify saved photo and identity/rights metadata
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          from PIL import Image
          report=json.loads(pathlib.Path("reports/manual-external-mirror-install-021-20261016.json").read_text())
          assert report["science_unchanged"]
          for a in report["installed"]:
            f=pathlib.Path(a["photo_file"])
            assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==a["sha256"]
            with Image.open(f) as im:im.verify()
            species=json.loads((f.parent.parent/"species.json").read_text())
            meta=[i for i in species["images"] if i.get("file")=="images/"+f.name]
            assert len(meta)==1 and meta[0]["license"]=="CC BY-NC" and meta[0]["creator"]=="Ellen Hildebrandt"
            print("VERIFIED",a["id"],f.name)
          PY
      - name: Commit image and original attribution without changing taxon science
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/ reports/manual-external-mirror-install-021-20261016.json reports/photo-coverage-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve licensed Amphiachyris study photo locally [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i*4))
          done
          exit 1
