name: Publish checked Euphorbia ophthalmica macro photos and genus lesson once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-euphorbia-ophthalmica-promote-20261021.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-ophthalmica-reviewed-promotion
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Refresh latest main state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Promote two checked images only and synchronize species + genus
        run: python scripts/manual_euphorbia_ophthalmica_promote_20261021.py
      - name: Verify physically saved images and no invented diagnostic anatomy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path("content/taxa/Euphorbiaceae/Euphorbia/euphorbia-ophthalmica")
          s=json.loads((root/"species.json").read_text())
          g=json.loads(Path("content/taxa/Euphorbiaceae/Euphorbia/genus.json").read_text())
          assert s["scientific_name"]=="Euphorbia ophthalmica"
          assert len(s["images"])==7
          assert sum(len(x.get("anatomy_arrows",[])) for x in s["images"])==17
          for i in s["images"]:
              p=root/i["file"]
              assert p.exists() and p.stat().st_size>15000
              with Image.open(p) as f:f.verify()
              for a in i.get("anatomy_arrows",[]):
                  assert all(0<=t<=1 for t in a["target_fraction"])
          for pid in (103176610,125643782):
              im=next(i for i in s["images"] if i.get("photo_id")==pid)
              assert im["public_reuse"].startswith("yes")
              assert im["license"]=="CC BY-NC 4.0"
              assert not any("capsule hairs" in a["label"].lower() or "true seed" in a["label"].lower() for a in im["anatomy_arrows"])
          pair=next(c for c in g["comparison_cards"] if c["id"]=="euphorbia-ophthalmica-hirta-terminal-glomerules")
          assert pair["photo_review_2026_10_21"]["total_canonical_photos"]==7
          print("PASS: 7 actual source JPEGs, 17 arrows, CC rights, genus lesson, no fabricated seed/capsule claims")
          PY
      - name: Commit exact verified source photos and cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Euphorbiaceae/Euphorbia/euphorbia-ophthalmica/ content/taxa/Euphorbiaceae/Euphorbia/genus.json reports/euphorbia-ophthalmica-source-and-pixel-review-20261021.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Publish ophthalmica seven licensed images and 17 checked arrows with genus pairing"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
