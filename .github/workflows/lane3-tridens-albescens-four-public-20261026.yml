name: Lane 3 install licensed white tridens habit and leaf anatomy photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane3-tridens-albescens-four-public-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-tridens-albescens-four
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refresh current canonical state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Verify each exact source and physically install only accredited photographs
        run: python scripts/lane3_install_tridens_albescens_roles_20261026.py
      - name: Validate image bytes, gallery, credits, holds
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          from PIL import Image
          a=json.loads(pathlib.Path('reports/lane3-tridens-albescens-public-roles-20261026.json').read_text())
          p=pathlib.Path('content/taxa/Poaceae/Tridens/tridens-albescens/species.json')
          d=json.loads(p.read_text())
          assert a['result']=='FOUR_PUBLIC_PHOTOS_ARCHIVED' and len(a['installed'])==4
          assert len(d['images'])==6 and len(d['visual_comparison']['items'])==10
          assert d['id']=='tridens-albescens'
          assert d['curation_status']['provisional'] is True
          for photo in a['installed']:
            p=pathlib.Path(photo['file'])
            assert p.is_file() and p.stat().st_size>30000
            assert hashlib.sha256(p.read_bytes()).hexdigest()==photo['sha256']
            with Image.open(p) as im:
              assert im.format=='JPEG' and not im.getexif().get(34853)
              im.verify()
            assert any(x.get('image_url')==str(p) and x.get('markers')==[] for x in d['visual_comparison']['items'])
          assert all(x['scientific_name']!='Tridens albescens' for x in d['visual_comparison']['items'][6:])
          print('PASS 4 true source photos, real JPEG, CC rights, no false arrows, original different-species lessons and science holds')
          PY
      - name: Guarded one-species source commit and conflict retry
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-tridens-albescens-public-roles-20261026.json content/taxa/Poaceae/Tridens/tridens-albescens/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lane 3 add four authenticated white tridens living tuft and detail photos"
          success=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main
            if git push origin HEAD:main; then success=1; break; fi
            sleep 3
          done
          test "$success" = 1
