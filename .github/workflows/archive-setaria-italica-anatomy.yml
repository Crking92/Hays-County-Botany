name: Archive Setaria italica anatomy
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_setaria_italica_anatomy.py
      - .github/workflows/archive-setaria-italica-anatomy.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-setaria-italica-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_setaria_italica_anatomy.py
      - name: Commit diagnostic image binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Setaria/setaria-italica/ reports/setaria-italica-anatomy-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive foxtail millet real ligule and spikelet photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
