name: Install Plains Black Nightshade Four-View Learner
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-solanum-interius-figure22-firstcard-20261020.yml"
      - "scripts/manual_solanum_interius_figure22_install_20261020.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solanum-interius-four-photo-firstcard
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refresh latest source and syntax check
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/manual_solanum_interius_figure22_install_20261020.py
      - name: Build exact licensed Figure 22 species card and macro arrow panels
        run: python scripts/manual_solanum_interius_figure22_install_20261020.py
      - name: Enforce source rights, four real image files and native audit HOLD
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path("content/taxa/Solanaceae/Solanum/solanum-interius")
          j=json.loads((root/"species.json").read_text())
          m=json.loads(Path("data/manifest.json").read_text())
          g=json.loads(Path("content/taxa/Solanaceae/Solanum/genus.json").read_text())
          assert j["id"]=="solanum-interius" and j["scientific_name"]=="Solanum interius"
          assert j["project_inclusion"]["target_zone_status"]=="PROVISIONAL"
          assert j["native_metrics_excluded"] is True
          assert len(j["images"])==4 and len(j["visual_comparison"]["items"])==6
          assert len([x for x in m["species"] if x["id"]=="solanum-interius"])==1
          assert "solanum-interius" in g["project_scope"]["species_ids"]
          assert sum(len(x["markers"]) for x in j["visual_comparison"]["items"][:4])==11
          assert all(x["scientific_name"]=="Solanum interius" for x in j["visual_comparison"]["items"][:4])
          for item in j["images"]:
            assert item["license"]=="CC BY 4.0" and item["source_figure"].startswith("Figure 22")
            assert item["creator"] in ("Michael Nee","Tiina Särkinen")
            f=root/item["file"]
            assert f.is_file() and f.stat().st_size>22000
            with Image.open(f) as im:im.verify()
            print("VERIFIED",f,item["source_figure"],item["creator"])
          assert j["images"][-1]["role"].startswith("MATURE")
          assert j["images"][2]["role"].startswith("Developing")
          assert j["curation_status"]["field_id_finish_status"]=="PASS_IN_PROGRESS"
          print("PASS: 4 real exact-species photos, 11 actual arrows, 2 labeled DIFFERENT-species comparison panels, county-native HOLD.")
          PY
      - name: Commit verified canonical first-card package and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Solanaceae/Solanum/solanum-interius/ content/taxa/Solanaceae/Solanum/genus.json data/manifest.json reports/solanum-interius-first-card-20261020.json
          if git diff --cached --quiet; then echo "No new changes; existing card preserved"; exit 0; fi
          git commit -m "Install source-verified Solanum interius field-ID card with Figure 22 photos [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo "Verified source photos committed"; exit 0; fi
            git rebase --abort || true
            sleep 4
          done
          exit 1
