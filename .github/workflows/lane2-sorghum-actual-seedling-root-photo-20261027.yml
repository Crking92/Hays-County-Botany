name: Lane 2 archive original Sorghum bicolor adventitious seedling roots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane2-sorghum-actual-seedling-root-photo-20261027.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-sorghum-original-roots-final-20261027
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane2_sorghum_seedling_roots_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Fetch licensed exact species original and archive with atomic GitHub API commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lane2_sorghum_seedling_roots_20261027.py
