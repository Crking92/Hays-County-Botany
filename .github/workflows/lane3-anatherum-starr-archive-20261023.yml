name: Lane 3 Anatherum source-verified Starr photo
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane3-anatherum-starr-archive-20261023.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_lane3_anatherum_starr_20261023.py
      - name: Commit archive only if rights verified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-anatherum-starr-20261023.json content/taxa/Poaceae/Anatherum/anatherum-tenuispatheum/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 3 Anatherum additional rights-verified source photograph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
