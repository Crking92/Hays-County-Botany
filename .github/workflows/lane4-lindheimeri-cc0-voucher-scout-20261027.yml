name: Lane4 Lindheimer panicgrass Smithsonian CC0 real specimen media scout
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_scout_lindheimeri_cc0_herbarium_20261027.py
      - .github/workflows/lane4-lindheimeri-cc0-voucher-scout-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-lindheimeri-smithsonian-cc0-scout
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/lane4_scout_lindheimeri_cc0_herbarium_20261027.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Find individual public-domain Smithsonian specimen media link without publishing
        run: python scripts/lane4_scout_lindheimeri_cc0_herbarium_20261027.py
      - name: Store media link evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse reports/lane4-lindheimeri-smithsonian-cc0-source-scout-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane4 Lindheimer Smithsonian CC0 photographed voucher source rights and media audit"
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 3
            done
            test "$pushed" = 1
          fi
