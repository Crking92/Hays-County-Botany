name: Lane 4 annual beardgrass reproductive photo evidence screen
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_polypogon_repro_review_20261026.py
      - .github/workflows/lane4-polypogon-repro-review-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-polypogon-repro-review
  cancel-in-progress: false
jobs:
  source-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - name: Fetch rights-verified reproductive candidate original JPEGs
        run: python scripts/lane4_polypogon_repro_review_20261026.py
      - name: Commit actual candidate evidence files and rights report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/photo-reviews/lane4-polypogon-reproductive-20261026/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 4 archive source-verified reproductive Polypogon photographs for pixel review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
