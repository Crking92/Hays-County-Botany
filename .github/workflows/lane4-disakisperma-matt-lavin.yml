name: Lane 4 archive Matt Lavin green sprangletop
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_disakisperma_matt_lavin_archive.py
      - .github/workflows/lane4-disakisperma-matt-lavin.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-disakisperma-dubium
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane4_disakisperma_matt_lavin_archive.py
      - name: Commit exact-source image archive and linked gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Disakisperma/disakisperma-dubium reports/lane4-disakisperma-matt-lavin-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive licensed Matt Lavin green sprangletop photos for local gallery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
