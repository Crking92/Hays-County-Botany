name: Archive remaining one-photo Chloris
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_chloris_andropogonoides_final.py
      - .github/workflows/archive-chloris-andropogonoides-final.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-chloris-andropogonoides-final
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_chloris_andropogonoides_final.py
      - name: Commit qualifying local images and rights report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Chloris/chloris-andropogonoides/ reports/chloris-andropogonoides-final-recovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified Chloris andropogonoides photo candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
