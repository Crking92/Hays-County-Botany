name: Archive eight exact composite-dropseed variety photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-sporobolus-compositus-harms-eight-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-onetime-spco-eight-originals-20261022
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and HTTP QA tools
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Compile installer against latest canonical main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m py_compile scripts/archive_sporobolus_compositus_harms_20261022.py
          python -m py_compile scripts/build_public_pages_snapshot.py scripts/public_photo_rights_preflight.py
      - name: Validate eight original JPEGs before making any canonical changes
        run: python scripts/archive_sporobolus_compositus_harms_20261022.py
      - name: Validate actual bytes, source varieties and narrow web rights
        run: |
          python - <<'PY'
          import json, hashlib, sys
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,"scripts")
          from build_public_pages_snapshot import rights
          from public_photo_rights_preflight import photo_rights
          base=Path("content/taxa/Poaceae/Sporobolus")
          sp=json.loads((base/"sporobolus-compositus/species.json").read_text())
          gn=json.loads((base/"genus.json").read_text())
          r=json.loads(Path("reports/sporobolus-compositus-physical-harms-eight-20261022.json").read_text())
          assert r["result"]=="EIGHT_REAL_HARMS_COMPOSITE_DROPSEED_IMAGES_PHYSICALLY_ARCHIVED"
          assert len(r["files"])==8 and sp["curation_status"]["photo_files_present"]==10
          assert len(sp["images"])==10 and len(sp["visual_comparison"]["items"])==12
          assert len(gn["visual_comparison"]["items"])==33
          assert sp["field_id_finish_pass"]["stage"].startswith("FIELD_READY_PHOTO_GAPS")
          for f in r["files"]:
              p=Path(f["image_path"])
              assert p.is_file() and p.stat().st_size>7000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==f["archived_sha256"]
              with Image.open(p) as original:
                  assert original.format=="JPEG" and not original.getexif().get(34853)
                  original.verify()
              x=next(i for i in sp["images"] if i["file"]=="images/"+p.name)
              assert x["creator"]=="Bob Harms" and x["source_taxon"]==f["source_variety"]
              assert x["site_specific_public_permission"]=="BOB_HARMS_SELECTED_MONOCOTS_EDU_WITH_CREDIT_20261022"
              assert rights(x,True)[0] and photo_rights(x,True) is None and not rights(x,False)[0]
              assert sum(i["image_url"]==str(p) for i in sp["visual_comparison"]["items"])==1
              assert sum(i["image_url"]==str(p) for i in gn["visual_comparison"]["items"])==1
          print("PASS 8 real author and variety verified photos, original local CC images preserved, microscope gaps retained")
          PY
      - name: Commit exact-source photos and publication request
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Sporobolus/sporobolus-compositus/
          git add content/taxa/Poaceae/Sporobolus/genus.json
          git add reports/sporobolus-compositus-physical-harms-eight-20261022.json
          git add workflow/field-id-publication/2026-10-22-sporobolus-compositus-eight-archived-harms.json
          if git diff --cached --quiet; then echo ALREADY_ARCHIVED_NOOP; exit 0; fi
          git commit -m 'Archive eight source-verified Harms composite-dropseed original JPEGs [skip ci]'
          for retry in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
