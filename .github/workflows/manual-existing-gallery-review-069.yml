name: Existing Learner Gallery Contact Review 069
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-existing-gallery-review-069.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: existing-gallery-review-069
  cancel-in-progress: false
jobs:
  photo-contact-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Review existing files without editing any canonical galleries
        run: python scripts/manual_existing_gallery_contact_069.py
      - name: Commit comparison sheets only
        run: |
          set -euo pipefail
          git diff --exit-code -- content/taxa/ data/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/diagnostic-role-review-069-20261018/
          git commit -m "Visual photo-role review 069: existing gallery contact sheets [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
