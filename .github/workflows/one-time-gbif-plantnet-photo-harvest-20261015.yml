name: One-time GBIF + PlantNet Photo Candidate Harvest

# Single user-requested manual handoff, triggered only by its dedicated kickoff file.
# Does not modify canonical species cards or alter existing scheduled workflows.
on:
  push:
    branches: [main]
    paths:
      - 'workflow/open-photo-candidates/combined-trigger-20261015.json'

permissions:
  contents: read

jobs:
  harvest-combined:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo preparation dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Harvest GBIF and Pl@ntNet together for 30 sparse species
        env:
          PLANTNET_API_KEY: ${{ secrets.PLANTNET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PLANTNET_API_KEY:-}" ]]; then
            echo "::error::The PLANTNET_API_KEY Actions secret is missing or unavailable."
            exit 2
          fi
          python scripts/bulk_open_photo_harvest.py --source both --limit 30 --per-species 3 --max-local 2 --download --out workflow/open-photo-candidates/combined-20261015
      - name: Upload review artifact (no canonical install)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hays-gbif-plantnet-combined-review
          path: workflow/open-photo-candidates/combined-20261015/
          retention-days: 14
          if-no-files-found: warn
