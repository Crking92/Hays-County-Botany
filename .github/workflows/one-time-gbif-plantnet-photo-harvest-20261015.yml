name: One-time Public Pl@ntNet via GBIF Photo Harvest

# Single user-requested manual handoff, triggered only by its dedicated kickoff file.
# Does not modify canonical species cards or alter existing scheduled workflows.
on:
  push:
    branches: [main]
    paths:
      - 'workflow/open-photo-candidates/combined-trigger-20261015.json'

permissions:
  contents: read

jobs:
  harvest-combined:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo preparation dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Harvest public Pl@ntNet observation photographs from GBIF
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bulk_open_photo_harvest.py --source plantnet-gbif --limit 30 --per-species 3 --max-local 2 --download --out workflow/open-photo-candidates/plantnet-gbif-20261015
      - name: Upload review artifact (no canonical install)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hays-plantnet-gbif-photo-review
          path: workflow/open-photo-candidates/plantnet-gbif-20261015/
          retention-days: 14
          if-no-files-found: warn
