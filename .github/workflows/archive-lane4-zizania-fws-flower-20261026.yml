name: Archive Lane 4 Texas wild-rice USFWS flower plates
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_lane4_zizania_fws_flower_20261026.py
      - .github/workflows/archive-lane4-zizania-fws-flower-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-lane4-zizania-fws-flower
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Inspect federal photo rights, sanitize and archive exact species JPEGs
        run: python scripts/archive_lane4_zizania_fws_flower_20261026.py
      - name: Commit installed image bytes with their species gallery links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Zizania/zizania-texana/
          if ! git diff --staged --quiet; then
            git commit -m "Archive USFWS Texas wild-rice flowering head photo plates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
