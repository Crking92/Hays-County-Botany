name: Archive Hall panicgrass fruit macro
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_panicum_hallii_fruit_20261023.py
      - .github/workflows/archive-panicum-hallii-fruit-20261023.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-panicum-hallii-fruit-20261023
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_panicum_hallii_fruit_20261023.py
      - name: Commit only the species photo and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Panicum/panicum-hallii/ reports/panicum-hallii-glossy-fruit-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive CC0 Panicum hallii glossy fruit anatomy photograph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
