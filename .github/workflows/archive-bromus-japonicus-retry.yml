name: Archive Japanese brome spikelet
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_bromus_japonicus_retry.py
      - .github/workflows/archive-bromus-japonicus-retry.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-bromus-japonicus-retry
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_bromus_japonicus_retry.py
      - name: Commit accepted Japanese brome image and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Bromus/bromus-japonicus/ reports/bromus-japonicus-spikelet-recovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified Bromus japonicus spikelet photo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
