name: Sync learner lesson index

on:
  push:
    branches: [main]
    paths:
      - 'content/taxa/**/family.json'
      - 'content/taxa/**/genus.json'
      - 'scripts/build_lesson_index.py'
      - '.github/workflows/lesson-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lesson-index-main
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build lesson index from installed JSON modules
        run: python scripts/build_lesson_index.py
      - name: Refresh, rebuild and push lesson index with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other review/curation workers write to main frequently. Never
          # overwrite their commits or publish an index built from stale main.
          # Only this generated index is written by this job.
          for attempt in 1 2 3 4 5 6; do
            echo "Lesson index sync attempt ${attempt}/6"
            git fetch --quiet origin main
            git reset --hard origin/main
            python scripts/build_lesson_index.py
            git add data/lesson-index.json
            if git diff --cached --quiet; then
              echo "Lesson index is current on latest main"
              exit 0
            fi
            git commit -m "Sync family and genus lesson index"
            if git push origin HEAD:main; then
              echo "Lesson index pushed successfully"
              exit 0
            fi
            echo "A concurrent write advanced main; rebuilding from the latest commit"
            sleep "$((attempt * 2))"
          done
          echo "Unable to push the lesson index after six fresh rebuilds" >&2
          exit 1
