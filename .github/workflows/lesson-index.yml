name: Sync learner lesson index

on:
  push:
    branches: [main]
    paths:
      - 'content/taxa/**/family.json'
      - 'content/taxa/**/genus.json'
      - 'scripts/build_lesson_index.py'
      - '.github/workflows/lesson-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lesson-index-main
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build lesson index from installed JSON modules
        run: python scripts/build_lesson_index.py
      - name: Commit updated index if changed
        run: |
          if git diff --quiet -- data/lesson-index.json && git ls-files --error-unmatch data/lesson-index.json >/dev/null 2>&1; then
            echo "Lesson index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lesson-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync family and genus lesson index"
          git push
