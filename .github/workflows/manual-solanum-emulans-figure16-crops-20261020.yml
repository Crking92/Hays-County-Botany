name: Prepare Eastern Black Nightshade Figure 16 Diagnostic Crops
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-solanum-emulans-figure16-crops-20261020.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solanum-emulans-figure16-crops
  cancel-in-progress: false
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Crop verified exact scholarly plate as independent teaching views
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image,ImageOps
          base=Path("workflow/photo-library/candidates/solanum-emulans-20261020")
          src=base/"pensoft-figure16-1.jpg"
          assert src.exists(),"Exact Pensoft Plate 16 must already be visually inspected."
          with Image.open(src) as full:
            assert full.size==(1512,1140), "Figure layout changed: stop before cutting wrong panels"
            crops=[
             ("figure16-b-leaf-underside-preview.jpg",(761,0,1512,560),"Figure 16B, lower leaf surface and unbranched flower cluster","Michael Nee, specimen Nee 61306"),
             ("figure16-c-flower-preview.jpg",(0,570,754,1138),"Figure 16C, flowers and buds with short yellow anthers","Michael Nee, specimen Nee 61357"),
             ("figure16-d-green-fruit-calyx-preview.jpg",(761,570,1512,1138),"Figure 16D, GREEN developing fruit with appressed/spreading calyx lobes","Michael Nee, specimen Nee 61357")
            ]
            outputs=[]
            for filename,box,role,credit in crops:
              pic=full.crop(box).convert("RGB")
              out=base/filename;pic.save(out,"JPEG",quality=92,optimize=True,exif=b"")
              with Image.open(out) as check:check.verify()
              outputs.append({"file":str(out),"dimensions":list(pic.size),"role":role,"credit":credit,
                "license":"CC BY 4.0","source_page":"https://phytokeys.pensoft.net/article/31738/element/2/116/",
                "source_image":"https://phytokeys.pensoft.net/article/31738/download/fig/116/",
                "modifications":"Exact figure 16 isolated panel crop; no anatomy drawn onto source image; EXIF stripped.",
                "sha256":hashlib.sha256(out.read_bytes()).hexdigest(),"review_status":"CROPPED_AWAITING_ANATOMICAL_ARROW_QA"})
          r=Path("reports/solanum-emulans-figure16-crops-20261020.json")
          r.write_text(json.dumps({"species":"Solanum emulans","date":"2026-10-20","figure":"Knapp et al 2019 PhytoKeys 123 Figure 16, photos by Michael Nee","outputs":outputs,
            "source_accuracy":"Panel D is green/developing fruit, not a confirmed ripe black berry","canonical_install":False},indent=2)+"\n")
          print("CROPPED",len(outputs),"exact licensed botanical research photo views")
          PY
      - name: Save licensed photo review crops to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/photo-library/candidates/solanum-emulans-20261020/figure16-*-preview.jpg reports/solanum-emulans-figure16-crops-20261020.json
          git diff --cached --quiet && exit 0
          git commit -m "Stage Michael Nee S. emulans leaf flower and calyx photos for precise arrows [skip ci]"
          for i in 1 2 3 4 5;do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            git rebase --abort || true;sleep 3
          done
          exit 1
