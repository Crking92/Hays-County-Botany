name: Archive Bob Harms educational grass images
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_bob_harms_educational_grasses.py
      - .github/workflows/archive-bob-harms-educational-grasses.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-bob-harms-educational-grasses
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive author-permitted educational grass images
        run: python scripts/archive_bob_harms_educational_grasses.py
      - name: Commit confirmed local images and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae reports/bob-harms-grass-education-photo-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Bob Harms educational grass anatomy images with credit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
