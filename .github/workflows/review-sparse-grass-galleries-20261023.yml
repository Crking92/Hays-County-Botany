name: Audit pine muhly and Anatherum source photos
on:
  push:
    branches: [main]
    paths: [.github/workflows/review-sparse-grass-galleries-20261023.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/review_three_sparse_grass_galleries_20261023.py
      - name: Commit verified image inventory and contact sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pine-muhly-review-contact-sheet-20261023.jpg reports/anatherum-tenuispatheum-review-contact-sheet-20261023.jpg reports/sparse-grass-photo-file-qa-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify pine muhly and Anatherum actual archived photo files"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
