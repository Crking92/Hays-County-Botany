name: Lane 3 Festuca BRIT specimen archival
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane3-festuca-brit-photo-20261023.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane3_archive_festuca_brit1072863.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-festuca-brit-photo-20261023.json content/taxa/Poaceae/Festuca/festuca-versuta/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 3 Festuca BRIT specimen photo evidence or source hold"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
