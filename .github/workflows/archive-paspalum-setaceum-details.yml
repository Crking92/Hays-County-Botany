name: Archive Paspalum setaceum details
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_paspalum_setaceum_details.py
      - .github/workflows/archive-paspalum-setaceum-details.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-paspalum-setaceum-details
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive source-licensed photographs
        run: python scripts/archive_paspalum_setaceum_details.py
      - name: Commit sanitized physical images and gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Paspalum/paspalum-setaceum/
          if ! git diff --cached --quiet; then
            git commit -m "Archive two additional Paspalum setaceum photographs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
