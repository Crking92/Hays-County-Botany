name: Lane 2 Scheele bristlegrass exact-species collar-root photo scout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lane2-scheelei-missing-collar-root-scout-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-photo-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Audit exact-species research-grade Texas iNaturalist original source photos and produce review-only contact sheets
        run: |
          python - <<'PY'
          import base64, concurrent.futures, io, json, math
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          from PIL import Image,ImageDraw,ImageOps
          UA={'User-Agent':'HaysBotanyVisualLearner/1.0 (research-grade media exact photo license inspection)'}
          GOOD={'cc0','cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa'}
          def get(url,max_bytes=2000000):
              with urlopen(Request(url,headers=UA),timeout=35) as f:return f.read(max_bytes)
          known=json.loads(get('https://api.inaturalist.org/v1/observations/138856189')).get('results',[])
          out=[]
          for page in [1,2,3]:
              q={'taxon_name':'Setaria scheelei','quality_grade':'research','photos':'true','place_id':18,'per_page':100,'page':page,'order':'desc','order_by':'created_at'}
              obs=json.loads(get('https://api.inaturalist.org/v1/observations?'+urlencode(q),5_000_000))
              print('QUERY',page,'total',obs.get('total_results'),'fetched',len(obs.get('results',[])))
              out+=obs.get('results',[])
              if page*100>=obs.get('total_results',0):break
          allobs={o['id']:o for o in out}
          for o in known: allobs[o['id']]=o
          ranked=sorted(allobs.values(),key=lambda o:(o['id']!=138856189,-len(o.get('photos') or [])))
          photos=[]
          for o in ranked:
              if o.get('taxon',{}).get('name')!='Setaria scheelei':continue
              for p in o.get('photos',[]):
                  if p.get('license_code') not in GOOD:continue
                  photos.append((o,p))
          photos=photos[:105]
          print('ELIGIBLE_STATS',json.dumps({'source_obs':len(allobs),'licensed_exact_photo_count':len(photos),'known_obs_photo_count':len(known[0]['photos']) if known else None}))
          def thumbnail(op):
              o,p=op
              url=p['url'].replace('/square.','/medium.').replace('/small.','/medium.').replace('/thumb.','/medium.')
              try:
                  b=get(url,1_000_000)
                  with Image.open(io.BytesIO(b)) as im:
                      im=ImageOps.exif_transpose(im).convert('RGB')
                  im.thumbnail((280,210))
                  return im
              except Exception as e:
                  print('PHOTO_UNAVAILABLE',p['id'],repr(e)[:140]);return None
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              pictures=list(pool.map(thumbnail,photos))
          for block in range(math.ceil(len(photos)/24)):
              items=photos[block*24:(block+1)*24]
              canvas=Image.new('RGB',(6*295,4*255),'white');d=ImageDraw.Draw(canvas)
              for i,(o,p) in enumerate(items):
                  num=block*24+i
                  im=pictures[num];x=(i%6)*295;y=(i//6)*255
                  if im is not None: canvas.paste(im,(x+(295-im.width)//2,y+8))
                  d.text((x+7,y+223),f'#{num} photo {p["id"]}',fill='black')
                  d.text((x+7,y+236),f'obs {o["id"]} {p["license_code"]}',fill='black')
                  print('SPECIMEN_CANDIDATE',json.dumps({'num':num,'photo':p['id'],'observation':o['id'],'taxon':o['taxon']['name'],'license':p['license_code'],'creator':p.get('attribution'),'observation_date':o.get('observed_on'),'place':o.get('place_guess'),'source':'https://www.inaturalist.org/photos/'+str(p['id'])},ensure_ascii=False))
              buf=io.BytesIO();canvas.save(buf,format='JPEG',quality=74,optimize=True)
              enc=base64.b64encode(buf.getvalue()).decode()
              print('SHEET_BEGIN',block,'bytes',len(buf.getvalue()),'start',block*24,'end',block*24+len(items)-1)
              for part,offset in enumerate(range(0,len(enc),3500)):print('SHEET_'+str(block)+'_'+str(part)+'='+enc[offset:offset+3500])
              print('SHEET_END',block)
          PY
