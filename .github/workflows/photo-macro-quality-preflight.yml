name: Check diagnostic photos before GitHub Pages

# One-time initial QA, then manual re-runs. Does not publish a site.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-macro-quality-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hays-photo-macro-quality-preflight
  cancel-in-progress: true

jobs:
  compare-diagnostic-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install safe pixel comparison dependencies
        run: python -m pip install 'Pillow>=10,<12'
      - name: Build temporary public site
        run: bash scripts/build_cloudflare_site.sh
      - name: Optimize site JPEG copies
        run: |
          mkdir -p photo-visual-quality
          python scripts/optimize_public_photo_copies.py --root dist \
            --threshold-kb 750 --max-edge 2800 --quality 86 \
            --report photo-visual-quality/size-report.json
      - name: Compare botanical visual detail and create inspection sheets
        run: |
          python scripts/audit_public_photo_quality.py \
            --source . --site dist --out photo-visual-quality --max-preview 16
      - name: Verify zero source changes
        run: |
          git diff --exit-code -- content/ data/ assets/ photo-review.html
          test -s photo-visual-quality/quality-report.json
      - name: Save photographic visual QA reports privately (no site deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botany-public-image-detail-qa
          path: photo-visual-quality/
          retention-days: 30
          if-no-files-found: warn
