name: Lane 4 install fall witchgrass rooted crown and blade photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_cognata_rooted_promote_20261026.py
      - .github/workflows/lane4-cognata-rooted-promote-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-cognata-rooted-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - run: python scripts/lane4_cognata_rooted_promote_20261026.py
      - name: Commit real source-verified photo files and gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add content/taxa/Poaceae/Digitaria/digitaria-cognata/ reports/lane4-cognata-rooted-promote-20261026.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Lane 4 archive actual rooted fall witchgrass crown and diagnostic blade"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/lane4_cognata_rooted_promote_20261026.py
          done
          exit 1
