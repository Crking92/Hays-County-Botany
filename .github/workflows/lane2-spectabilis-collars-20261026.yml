name: Lane 2 install exact-source purple lovegrass collar/sheath macros
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_spectabilis_collars_20261026.py
      - .github/workflows/lane2-spectabilis-collars-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-spectabilis-collars
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install Pillow
      - run: python scripts/lane2_spectabilis_collars_20261026.py
      - name: Commit only archived photos and current canonical species evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-spectabilis/ reports/lane2-spectabilis-actual-collar-sheath-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive purple lovegrass collar and sheath photograph pair, preserve true ligule hold"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
