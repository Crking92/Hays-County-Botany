name: Lane 2 archive real Scheele inner ligule Bob Harms photograph
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane2-scheelei-bob-harms-ligule-20261027.yml'
      - 'scripts/lane2_install_scheelei_bob_harms_true_ligule_20261027.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-scheelei-harms-ligule-20261027
  cancel-in-progress: false
jobs:
  archive-real-ligule:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout canonical current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JPEG integrity tooling
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Archive Bob Harms' actual species-specific scaled inner ligule photo
        run: python scripts/lane2_install_scheelei_bob_harms_true_ligule_20261027.py
      - name: Assert physical photo, species gallery, scale and authentic score
        run: |
          python - <<'PY'
          import json,hashlib
          from PIL import Image
          from pathlib import Path
          base=Path("content/taxa/Poaceae/Setaria/setaria-scheelei")
          image=base/"images/bob-harms-scheelei-sesc2-l-scaled-inner-ligule.jpg"
          assert image.exists() and image.stat().st_size>12000
          with Image.open(image) as im:
              assert im.format=="JPEG" and im.width>=680 and im.height>=350
              assert not im.getexif().get(34853)
              im.verify()
          c=json.loads((base/"species.json").read_text())
          s=json.loads(Path("reports/lane2-six-role-photo-score-20261027.json").read_text())
          report=json.loads(Path("reports/lane2-scheelei-harms-scaled-ligule-20261027.json").read_text())
          photo=next(x for x in c["images"] if x["file"]=="images/"+image.name)
          assert photo["creator"]=="Bob Harms" and "NOT Creative Commons" in photo["license"]
          assert photo["image_sha256"]==hashlib.sha256(image.read_bytes()).hexdigest()
          rel="content/taxa/Poaceae/Setaria/setaria-scheelei/images/"+image.name
          panel=next(x for x in c["visual_comparison"]["items"] if x.get("image_url")==rel)
          assert panel["scientific_name"]=="Setaria scheelei" and len(panel["markers"])==2
          score=next(x for x in s["records"] if x["canonical_id"]=="setaria-scheelei")
          assert score["roles"]["true_collar_ligule_sheath"]==1
          assert score["after_total"]==4.5 and score["after_percentage"]==75
          assert s["summary"]["at_or_above_70_count"]==23 and s["summary"]["below_70_count"]==0
          assert report["local_sha256"]==photo["image_sha256"]
          print("PASS: true original scaled ligule, author attribution, physical JPEG, two arrows, honest 75% score")
          PY
      - name: Commit exact canonical image, learner and scoring changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Setaria/setaria-scheelei/ \
            reports/lane2-six-role-photo-score-20261027.json \
            reports/lane2-scheelei-harms-scaled-ligule-20261027.json \
            workflow/field-id-publication/lane2-scheelei-scaled-ligule-20261027.json
          if git diff --cached --quiet; then
            echo "Already installed and verified. No-op."
            exit 0
          fi
          git commit -m "Lane 2: archive true scaled Scheele ligule photo and raise verified role to 75% [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
