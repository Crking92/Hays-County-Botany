name: Lane 4 southern crabgrass three CC0 anatomy plates
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_ciliaris_three_cc0_anatomy_20261027.py
      - .github/workflows/lane4-ciliaris-three-cc0-anatomy-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-ciliaris-three-cc0-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Confirm exact observed taxon and image-level CC0 then archive visible source images
        run: python scripts/lane4_archive_ciliaris_three_cc0_anatomy_20261027.py
      - name: Commit only actually downloaded and validated JPEGs and matching species gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Digitaria/digitaria-ciliaris/
          if ! git diff --cached --quiet; then
            git commit -m "Archive three genuine CC0 southern crabgrass ligule/collar and spikelet photo candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
