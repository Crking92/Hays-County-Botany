name: Stage licensed Bob Harms seep-muhly microdiagnostic study photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-bob-harms-muhly-diagnostics-20261021.yml'
      - 'scripts/recover_bob_harms_seep_macro_20261021.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-hays-muhly-diagnostic-bob-harms
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP and image parsers
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Refresh canonical main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Fetch and verify UT Austin Bob Harms photo-source candidates
        run: python scripts/recover_bob_harms_seep_macro_20261021.py
      - name: Validate source evidence, copyright credit and actual JPEGs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          r=json.loads(Path('reports/muhlenbergia-reverchonii-bob-harms-diagnostics-20261021.json').read_text())
          assert r['species']=='Muhlenbergia reverchonii'
          assert r['creator']=='Bob Harms'
          assert r['gallery_modified'] is False and r['taxonomy_native_range_changed'] is False
          assert len(r['candidates'])==2
          assert {x['role'] for x in r['candidates']}=={'ligule_sheath','spikelet_detail'}
          for role in r['candidates']:
            for f in role['files']:
              path=Path(f['path'])
              assert path.is_file() and path.stat().st_size>=13000
              assert f['creator']=='Bob Harms'
              assert 'Educational/scientific' in f['rights']
              with Image.open(path) as im:
                assert im.format=='JPEG'
                assert not im.getexif().get(34853)
                im.verify()
          print('PASS source review candidate metadata and image bytes: no canonical gallery modifications')
          PY
      - name: Commit only staged source photos and source-rights report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/muhlenbergia-reverchonii-bob-harms-diagnostics-20261021.json
          git add workflow/photo-lab/muhlenbergia-reverchonii/bob-harms-diagnostics/ || true
          if git diff --cached --quiet; then echo 'No new source work'; exit 0; fi
          git commit -m 'Stage Bob Harms exact seep ligule and spikelet reference JPEGs for scientific photo QA [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
