name: Lane 4 Polypogon membranous collar photo archive
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_polypogon_ligule_20261025.py
      - .github/workflows/lane4-polypogon-ligule-20261025.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-polypogon-ligule
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Archive exact public-safe photo originals
        run: python scripts/lane4_archive_polypogon_ligule_20261025.py
      - name: Commit photos only if guard checks pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Polypogon/polypogon-monspeliensis/ reports/lane4-polypogon-ligule-20261025.json
          if ! git diff --staged --quiet; then
            git commit -m "Lane 4 archive verified annual beardgrass membranous collar macros"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
