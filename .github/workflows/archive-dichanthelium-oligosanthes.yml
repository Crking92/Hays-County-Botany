name: Archive Dichanthelium oligosanthes anatomy
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_dichanthelium_oligosanthes_photos.py
      - .github/workflows/archive-dichanthelium-oligosanthes.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-dichanthelium-oligosanthes
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_dichanthelium_oligosanthes_photos.py
      - name: Commit rights-verified images and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Dichanthelium/dichanthelium-oligosanthes/ reports/dichanthelium-oligosanthes-photo-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Dichanthelium oligosanthes anatomical material"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
