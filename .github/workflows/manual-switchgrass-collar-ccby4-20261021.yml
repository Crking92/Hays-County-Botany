name: Verified switchgrass collar diagnostic image and field lesson
on:
  push:
    paths:
      - .github/workflows/manual-switchgrass-collar-ccby4-20261021.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: targeted-panicum-virgatum-ncsu-ccby4-20261021
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'Pillow>=10,<12'
      - name: Individually validate photo rights and install actual switchgrass collar macro
        run: python scripts/manual_switchgrass_ncsu_collar_20261021.py
      - name: Verify licensed image bytes, species, two arrows and genus references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('content/taxa/Poaceae/Panicum')
          p=root/'panicum-virgatum'/'species.json'
          s=json.loads(p.read_text());g=json.loads((root/'genus.json').read_text())
          assert s['id']=='panicum-virgatum'
          assert s['project_inclusion']['target_zone_status']=='PASS'
          assert g['name']=='Panicum'
          target=[q for q in s['images'] if 'ncsu-andrey-zharkikh-ccby4-collar-ligule.jpg' in q['file']]
          assert len(target)==1
          a=target[0];f=p.parent/a['file']
          assert a['license']=='CC BY 4.0' and a['public_reuse']=='yes'
          assert a['creator']=='Andrey Zharkikh'
          assert f.is_file() and f.stat().st_size>12000
          with Image.open(f) as im:im.verify()
          assert len(s['images'])==4
          panels=s['visual_comparison']['items']
          assert len(panels)==4 and len(panels[0]['markers'])==2
          assert 'sheath' in panels[0]['markers'][1]['label'].lower()
          assert any('ncsu-andrey' in z.get('image_url','') for z in g['visual_comparison']['items'])
          print('VALIDATED switchgrass',f,'size',f.stat().st_size,'arrows',len(panels[0]['markers']))
          PY
      - name: Commit source-exact license verified media, two species lessons and genus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Panicum/panicum-virgatum/ content/taxa/Poaceae/Panicum/genus.json
          if git diff --cached --quiet; then echo 'Already installed'; exit 0; fi
          git commit -m 'Install verified switchgrass hairy collar macro and completed field key [skip ci]'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
