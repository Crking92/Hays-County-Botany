name: Install two Festuca species licensed photo lessons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-festuca-two-species-photo-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hays-festuca-two-species-photo-20261022
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Re-fetch latest canonical main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Download strictly licensed photograph bytes and verify all source IDs
        run: python scripts/install_festuca_two_species_licensed_photos_20261022.py
      - name: Validate rights, exact image hashes and science holds
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path('content/taxa/Poaceae/Festuca')
          a=json.loads((root/'festuca-octoflora/species.json').read_text())
          b=json.loads((root/'festuca-versuta/species.json').read_text())
          g=json.loads((root/'genus.json').read_text())
          report=json.loads(Path('reports/festuca-two-cards-physical-photo-archive-20261022.json').read_text())
          assert report['result']=='ARCHIVED_2_SIXWEEKS_ACTUAL_PHOTOS_AND_1_TEXAS_HISTORIC_ILLUSTRATION'
          assert len(report['files'])==3
          assert len(a['images'])==3 and len(b['images'])==2
          assert g['project_scope']['species_count']==2
          assert len(g['visual_comparison']['items'])==5
          assert len(a['visual_comparison']['items'])==3
          assert len(b['visual_comparison']['items'])==2
          for item in report['files']:
              p=Path(item['file'])
              assert p.is_file() and p.stat().st_size>11000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              with Image.open(p) as im:
                  assert im.format=='JPEG' and min(im.size)>=550
                  assert not im.getexif().get(34853)
                  im.verify()
              card=a if 'octoflora' in str(p) else b
              assert any(x.get('file')=='images/'+p.name and x.get('creator')==item['creator'] for x in card['images'])
              assert sum(x.get('image_url')==str(p) for x in card['visual_comparison']['items'])==1
              assert sum(x.get('image_url')==str(p) for x in g['visual_comparison']['items'])==1
          for card in (a,b,g):
              assert all(x.get('source_page') and x.get('license') and x.get('creator') for x in card['visual_comparison']['items'])
          assert 'HISTORIC' in b['visual_comparison']['items'][0]['label']
          print('PASS: 3 physical media files, 2 real species images + 1 historical annotated illustration, photo rights and legacy science guarded')
          PY
      - name: Commit only two scoped species and genus files, physical media and report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Festuca/festuca-octoflora content/taxa/Poaceae/Festuca/festuca-versuta content/taxa/Poaceae/Festuca/genus.json
          git add reports/festuca-two-cards-physical-photo-archive-20261022.json
          git add workflow/field-id-publication/2026-10-22-festuca-two-species-photo-archive.json
          if git diff --cached --quiet; then echo 'Already installed, no duplicate commit'; exit 0; fi
          git commit -m 'Archive Festuca exact species CC photos and historic Texas fescue illustration [skip ci]'
          for x in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Request rights-checked normal GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Asked for normal source-licensed public learner update'
