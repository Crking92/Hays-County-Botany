name: Archive Sorghum bicolor anatomy
on:
  push:
    branches: [main]
    paths:
      - scripts/archive_sorghum_bicolor_anatomy.py
      - .github/workflows/archive-sorghum-bicolor-anatomy.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-sorghum-bicolor-anatomy
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/archive_sorghum_bicolor_anatomy.py
      - name: Commit eligible photographs and holds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Sorghum/sorghum-bicolor/ reports/sorghum-bicolor-anatomy-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Sorghum bicolor ligule and flower close-ups"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
