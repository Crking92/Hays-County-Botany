name: Visual QA Grass Anatomy Crew PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-grass-anatomy-crew-pdf-20261027.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2' 'Pillow>=10,<12'
      - name: Render and inspect all PDF pages; archive contact sheet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64,io,json,os,urllib.request
          import fitz
          from PIL import Image,ImageOps,ImageDraw
          repo=os.environ["GITHUB_REPOSITORY"];token=os.environ["GITHUB_TOKEN"];API="https://api.github.com/repos/"+repo
          url="https://raw.githubusercontent.com/"+repo+"/main/field-guides/Grass_Anatomy_From_Beginner_to_Advanced_Crew_Guide.pdf"
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"GrassCrewPrintQA/1.0"}),timeout=55) as f:data=f.read(12_000_000)
          assert data.startswith(b"%PDF"),"Not a PDF"
          doc=fitz.open(stream=data,filetype="pdf")
          print("PDF_QUALITY_PAGES",len(doc),"BYTES",len(data))
          assert len(doc)>=26,"Not complete booklet"
          assert all(len(p.get_text().strip())>100 for p in doc),"Page lacks searchable text"
          from collections import Counter
          bad=[]
          for i,p in enumerate(doc):
              for z in p.get_text("blocks"):
                  if z[6]!=0:continue
                  if z[0]<-0.5 or z[1]<-0.5 or z[2]>p.rect.width+0.5 or z[3]>p.rect.height+0.5:
                      bad.append((i+1,[round(t,1) for t in z[:4]]))
          print("OUT_OF_PAGE_TEXT",bad[:30],len(bad))
          idx=[0,1,2,5,8,11,14,18,24]
          idx=[i for i in idx if i<len(doc)]
          contact=Image.new("RGB",(3*450,3*650),"white");d=ImageDraw.Draw(contact)
          for n,i in enumerate(idx):
              p=doc[i];pix=p.get_pixmap(matrix=fitz.Matrix(.7,.7),alpha=False)
              im=Image.open(io.BytesIO(pix.tobytes("png"))).convert("RGB")
              im.thumbnail((430,606))
              x=(n%3)*450+(450-im.width)//2
              y=(n//3)*650+20
              contact.paste(im,(x,y))
              d.text(((n%3)*450+13,(n//3)*650+628),f"Page {i+1}",fill="#253D2E")
          buf=io.BytesIO();contact.save(buf,format="JPEG",quality=76,optimize=True)
          def gh(m,path,j=None):
              req=urllib.request.Request(API+path,data=None if j is None else json.dumps(j).encode(),method=m,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"GrassCrewsPDFQA"})
              with urllib.request.urlopen(req,timeout=50) as f:return json.load(f)
          blob=gh("POST","/git/blobs",{"content":base64.b64encode(buf.getvalue()).decode(),"encoding":"base64"})["sha"]
          for attempt in range(6):
              head=gh("GET","/git/ref/heads/main")["object"]["sha"];tree=gh("GET","/git/commits/"+head)["tree"]["sha"]
              tr=gh("POST","/git/trees",{"base_tree":tree,"tree":[{"path":"field-guides/Grass_Anatomy_PDF_Page_Previews.jpg","mode":"100644","type":"blob","sha":blob}]})["sha"]
              commit=gh("POST","/git/commits",{"tree":tr,"parents":[head],"message":"QA: verified 28-page grass anatomy crew guide sample render [skip ci]"})["sha"]
              try:gh("PATCH","/git/refs/heads/main",{"sha":commit,"force":False});print("QA_CONTACT_COMMITTED",commit);break
              except Exception:
                  if attempt==5:raise
          
          PY
