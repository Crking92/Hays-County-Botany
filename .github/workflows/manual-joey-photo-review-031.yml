name: Joey Diagnostic Photo Review 031
on:
  push:
    paths:
      - .github/workflows/manual-joey-photo-review-031.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-joey-photo-review-031
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Preview Joey's individually attributed CC BY-NC photos
        run: python scripts/manual_joey_photo_review_031.py
      - name: Save visual-review-only contact sheets and provenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add reports/manual-joey-review-031/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage Joey photo review with CC BY-NC attribution 031 [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i*4))
          done
          exit 1
