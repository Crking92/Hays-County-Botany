name: Lane 4 Catapodium licensed reproductive macro archive
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_catapodium_reproductive_20261027.py
      - .github/workflows/lane4-catapodium-reproductive-macros-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-catapodium-reproductive-macros
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Check exact photo licenses and store real source-specific JPEGs
        run: python scripts/lane4_archive_catapodium_reproductive_20261027.py
      - name: Commit verified physical photos, metadata and actual gallery panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Catapodium/catapodium-rigidum/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Catapodium actual licensed spikelet reproductive source photo series"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
