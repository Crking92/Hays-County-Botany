name: Lane 2 Aristida purple and oldfield real photographic anatomy scout
on:
  push:
    branches: [main]
    paths: [.github/workflows/lane2-aristida-two-species-photo-scout-20261027.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pixel-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - name: Review two Aristida species individual licensed Texas photographic candidates
        run: |
          python - <<'PY'
          import json,io,base64,concurrent.futures,math
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          from PIL import Image,ImageOps,ImageDraw
          UA={'User-Agent':'HaysBotanyVisualLearner/1.0 species-level licensed anatomical source inspection'}
          def get(u,limit=5000000):
           with urlopen(Request(u,headers=UA),timeout=40) as h:return h.read(limit)
          for species in ('Aristida purpurea','Aristida oligantha'):
           candidates=[]
           for page in (1,2,3):
            u='https://api.inaturalist.org/v1/observations?'+urlencode({'taxon_name':species,'quality_grade':'research','photos':'true','place_id':18,'per_page':30,'page':page,'order_by':'created_at','order':'desc'})
            o=json.loads(get(u)); print('QUERY',species,page,o.get('total_results'),len(o['results']))
            for obs in o['results']:
             if obs.get('taxon',{}).get('name')!=species:continue
             for p in (obs.get('photos') or [])[:6]:
              if p.get('license_code') in {'cc0','cc-by','cc-by-sa','cc-by-nc','cc-by-nc-sa'}:candidates.append((obs,p))
            if page*30>=o.get('total_results',0):break
           candidates=candidates[:50]
           def thumb(op):
            url=op[1]['url'].replace('/square.','/medium.').replace('/thumb.','/medium.')
            try:
             with Image.open(io.BytesIO(get(url,900000))) as im:z=ImageOps.exif_transpose(im).convert('RGB')
             z.thumbnail((230,190));return z
            except Exception as e:
             print('SKIP',op[1].get('id'),str(e)[:80]);return None
           with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:ims=list(pool.map(thumb,candidates))
           for block in range(math.ceil(len(candidates)/25)):
            canvas=Image.new('RGB',(1250,1200),'white');d=ImageDraw.Draw(canvas)
            for i,(o,p) in enumerate(candidates[block*25:(block+1)*25]):
             num=block*25+i;x=i%5*250;y=i//5*240;img=ims[num]
             if img is not None:canvas.paste(img,(x+(250-img.width)//2,y+5))
             d.text((x+4,y+204),f'#{num} photo={p["id"]}',fill='black')
             d.text((x+4,y+222),f'obs={o["id"]} {p["license_code"]}',fill='black')
             print('PICK',json.dumps({'species':species,'i':num,'photo':p['id'],'obs':o['id'],'license':p['license_code'],'creator':p.get('attribution'),'place':o.get('place_guess'),'source':'https://www.inaturalist.org/photos/'+str(p['id'])},ensure_ascii=False))
            data=io.BytesIO();canvas.save(data,'JPEG',quality=78,optimize=True)
            textval=base64.b64encode(data.getvalue()).decode('ascii')
            tag='PURPUREA' if species=='Aristida purpurea' else 'OLIGANTHA'
            for k,j in enumerate(range(0,len(textval),3500)):print(f'{tag}_CONTACT_{block}_{k}='+textval[j:j+3500])
            print('CONTACT_END',tag,block,len(data.getvalue()))
           print('TOTAL',species,len(candidates))
          PY
