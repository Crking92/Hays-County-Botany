name: Archive six original regional Ozarkgrass diagnostic JPEGs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-limnodea-six-originals-20261023.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hays-limnodea-six-source-photos-20261023
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image source utilities and test Python source syntax
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3'
          python -m py_compile scripts/archive_limnodea_six_originals_20261023.py scripts/build_public_pages_snapshot.py scripts/public_photo_rights_preflight.py
      - name: Retrieve six exact source image originals and preserve source license
        run: python scripts/archive_limnodea_six_originals_20261023.py
      - name: Verify every actual JPEG byte, photo license and science hold
        run: |
          python - <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,'scripts')
          from build_public_pages_snapshot import rights
          from public_photo_rights_preflight import photo_rights
          s=json.loads(Path('content/taxa/Poaceae/Limnodea/limnodea-arkansana/species.json').read_text())
          g=json.loads(Path('content/taxa/Poaceae/Limnodea/genus.json').read_text())
          r=json.loads(Path('reports/limnodea-six-source-verified-harms-photos-20261023.json').read_text())
          assert s['scientific_name']=='Limnodea arkansana' and s['curation_status']['taxonomy_reviewed']==False
          assert r['physically_archived_new']==6 and len(r['photos'])==6
          assert len(s['images'])==7 and s['curation_status']['photo_files_present']==7
          assert len(s['visual_comparison']['items'])==10 and len(g['visual_comparison']['items'])==10
          assert 'FIELD_READY_PHOTO_GAPS' in s['field_id_finish_pass']['stage']
          for photo in r['photos']:
              file=Path(photo['physical_file'])
              assert file.is_file() and file.stat().st_size>4500
              assert hashlib.sha256(file.read_bytes()).hexdigest()==photo['archived_sha256']
              with Image.open(file) as im:
                  assert im.format=='JPEG' and im.mode=='RGB' and not im.getexif().get(34853)
                  assert list(im.size)==photo['dimensions']
                  im.verify()
              m=next(x for x in s['images'] if x.get('file')=='images/'+file.name)
              assert m['creator']=='Bob Harms' and m['source_taxon_name']=='Limnodea arkansana'
              assert rights(m,True)[0],(file,rights(m,True))
              assert photo_rights(m,True) is None,(file,photo_rights(m,True))
              assert len([p for p in s['visual_comparison']['items'] if p.get('image_url')==str(file)])==1
          print('PASS 6 source-matched original photos, copyright, pixel integrity, publication gates',flush=True)
          PY
      - name: Commit physically verified images and source report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Limnodea/
          git add reports/limnodea-six-source-verified-harms-photos-20261023.json
          git add workflow/field-id-publication/2026-10-23-limnodea-six-actual-harms-photos.json
          if git diff --cached --quiet; then echo 'No duplicative change'; exit 0; fi
          git commit -m 'Archive six real credited Central Texas Ozarkgrass anatomy photos [skip ci]'
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
