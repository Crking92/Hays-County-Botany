name: Review bigtop lovegrass photo candidates
on:
  push:
    branches: [main]
    paths:
      - scripts/build_eragrostis_hirsuta_contact_sheet.py
      - .github/workflows/review-eragrostis-hirsuta-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/build_eragrostis_hirsuta_contact_sheet.py
      - name: Commit review sheet only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/eragrostis-hirsuta-photo-review/
          if ! git diff --cached --quiet; then
            git commit -m "Record visual screening board for bigtop lovegrass"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
