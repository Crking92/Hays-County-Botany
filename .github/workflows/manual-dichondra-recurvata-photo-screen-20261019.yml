name: Manual Dichondra recurvata Licensed Photo Screen
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-dichondra-recurvata-photo-screen-20261019.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-dichondra-recurvata-photo-screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow requests
      - run: python scripts/manual_dichondra_recurvata_candidate_screen_20261019.py
      - name: Commit only provisional review contact sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/photo-library/reviews/dichondra-recurvata-20261019/
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "Archive provisional exact Dichondra recurvata licensed photo review [skip ci]"
          for n in 1 2 3;do
            if git pull --rebase origin main && git push origin HEAD:main;then exit 0;fi
            sleep 4
          done
          exit 1
