name: Archive public-license pine muhly photographs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-pine-muhly-open-photos-20261023.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pine-muhly-photos
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Download verified Commons originals and validate JPEGs
        run: python scripts/archive_pine_muhly_open_photos_20261023.py
      - name: Preserve only successful physical photographs and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Muhlenbergia/muhlenbergia-dubia/ reports/pine-muhly-photo-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive license-checked pine muhly photos and retain attribution"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
