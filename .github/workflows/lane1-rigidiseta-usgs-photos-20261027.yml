name: Lane 1 exact-USGS Texas grama reproductive photography
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lane1-rigidiseta-usgs-photos-20261027.yml'
      - 'scripts/lane1_rigidiseta_usgs_original_20261027.py'
permissions:
  contents: write
concurrency:
  group: lane1-rigidiseta-usgs-reproductive-photos
  cancel-in-progress: false
jobs:
  archive-real-usgs-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-photo dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Download source-proven Texas grama flowering detail and scrub EXIF/GPS before physical archiving
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/lane1_rigidiseta_usgs_original_20261027.py
