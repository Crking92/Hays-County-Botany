name: Lane 3 Tumblegrass Genuine Spikes and Sheath Photo Installation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lane3-tumblegrass-anatomy-install-20261027.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-tumblegrass-anatomy-install
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Copy vetted source JPEGS and integrate truthful teaching arrows
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python scripts/lane3_tumblegrass_actual_anatomy_install_20261027.py
      - name: Validate physically present photos, licenses, anatomy and markers
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          from PIL import Image
          root=pathlib.Path('content/taxa/Poaceae/Muhlenbergia/muhlenbergia-paniculata')
          r=json.loads(pathlib.Path('reports/lane3-tumblegrass-actual-photo-install-20261027.json').read_text())
          j=json.loads((root/'species.json').read_text())
          assert r['status']=='FOUR_TRUE_SOURCE_PHOTOS_PHYSICALLY_INSTALLED_NO_FALSE_LIGULE'
          assert len(r['new'])==4 and r['new_arrows']==8
          assert len(j['images'])==7 and len(j['visual_comparison']['items'])==7
          assert j['learner_visual_status']['status']=='FIELD_READY_PHOTO_GAPS'
          for p in r['new']:
              f=pathlib.Path(p['path'])
              assert f.exists() and hashlib.sha256(f.read_bytes()).hexdigest()==p['sha256']
              with Image.open(f) as im:
                  assert im.format=='JPEG' and min(im.size)>=1000 and not im.getexif().get(34853)
                  im.verify()
              a=[x for x in j['visual_comparison']['items'] if x['image_url']==str(f)]
              assert len(a)==1 and a[0]['source_photo_id']==p['id']
              assert a[0]['license'] in ('CC BY','CC BY-NC')
              assert len(a[0]['markers'])==p['arrows']
              for m in a[0]['markers']:
                  assert all(0<=m[k]<=100 for k in ('target_x','target_y','label_x','label_y'))
                  assert 'ligule' not in m['label'].lower() or 'not' in m['label'].lower()
          assert r['six_role_after']<4.5
          print('PASS — 4 physical same-species images; 8 visibly positioned arrows; true free ligule and roots unclaimed')
          PY
      - name: Commit species image bytes and canonical gallery without other-lane edits
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Muhlenbergia/muhlenbergia-paniculata/ reports/lane3-tumblegrass-actual-photo-install-20261027.json
          git diff --cached --quiet && exit 0
          git commit -m "Lane 3 archive four verified tumblegrass field sheath and spikelet photographs with honest arrows"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
