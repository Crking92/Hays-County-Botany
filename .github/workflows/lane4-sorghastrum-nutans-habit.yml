name: Lane 4 archive Indiangrass public Commons photos
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_sorghastrum_nutans_habit_archive.py
      - .github/workflows/lane4-sorghastrum-nutans-habit.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-sorghastrum-nutans
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/lane4_sorghastrum_nutans_habit_archive.py
      - name: Commit verified licensed photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Sorghastrum/sorghastrum-nutans/ reports/lane4-sorghastrum-nutans-habit-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 4 archive public-license Indiangrass flowering and habit photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
