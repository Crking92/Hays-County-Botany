name: Recover four verified Commons photos for public learner
# One-off source image recovery; not an hourly automation or generic Pages publisher.
on:
  push:
    branches: [main]
    paths:
      - "scripts/recover_public_gap_commons_four.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hays-public-photo-gap-four-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main, including claims and canonical galleries
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image format checker
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"
      - name: Install only real, exact-species, individually credited Wikimedia images
        run: python scripts/recover_public_gap_commons_four.py
      - name: Check that only targeted galleries and results changed
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/public-gap-commons-recovery-20261020.json')
          j = json.loads(p.read_text())
          print('Saved:', len(j['installed']), 'public photo recoveries; held:', len(j['held']))
          for x in j['installed']:
            file = Path(x['physical_file'])
            assert file.is_file() and file.stat().st_size > 5000
            species = json.loads(Path(x['species_json']).read_text())
            assert any(photo.get('file') == x['relative_image_path'] for photo in species.get('images',[]))
          PY
      - name: Commit recovered exact images and species references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hays Botany photo recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          j = json.loads(Path('reports/public-gap-commons-recovery-20261020.json').read_text())
          paths = ['reports/public-gap-commons-recovery-20261020.json']
          for x in j['installed']:
            paths.extend([x['species_json'], x['physical_file']])
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          if git diff --cached --quiet; then
            echo "No new gallery changes; do not claim installs"
          else
            git commit -m "Photos: recover verified Commons public face for four held cards [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
