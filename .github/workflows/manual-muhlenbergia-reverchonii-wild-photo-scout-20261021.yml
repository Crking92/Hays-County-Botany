name: One-time seep muhly licensed wild macro verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-muhlenbergia-reverchonii-wild-photo-scout-20261021.yml'
      - 'scripts/manual_muhlenbergia_reverchonii_wild_photo_scout_20261021.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-hays-seep-muhly-photo-scout
  cancel-in-progress: false
jobs:
  verify-photo-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and HTTP verification
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'requests>=2.31,<3' 'ImageHash>=4.3,<5'
      - name: Refresh canonical main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Match WildflowerSearch images with the individual CC-licensed iNaturalist originals
        run: python scripts/manual_muhlenbergia_reverchonii_wild_photo_scout_20261021.py
      - name: Verify scientific holds retained and local photos are actual decoded JPEGs
        run: |
          python - <<'PY'
          import json, pathlib
          from PIL import Image
          base=pathlib.Path("workflow/photo-lab/muhlenbergia-reverchonii")
          rep=json.loads(pathlib.Path("reports/muhlenbergia-reverchonii-wild-macro-scout-20261021.json").read_text())
          assert rep["taxon"]=="Muhlenbergia reverchonii"
          assert rep["canonical_species_gallery_modified"] is False
          cards=json.loads(pathlib.Path("content/taxa/Poaceae/Muhlenbergia/muhlenbergia-reverchonii/species.json").read_text())
          assert cards["scientific_name"]=="Muhlenbergia reverchonii"
          assert len(cards["visual_comparison"]["items"])>=4
          for result in rep["candidate_status"]:
              if result["status"]=="STAGED_EXACT_MATCH_FOR_MANUAL_PIXEL_QA":
                  assert result["license_code"] in ("cc0","cc-by","cc-by-sa","cc-by-nc")
                  f=pathlib.Path(result["path"])
                  assert f.is_file() and f.stat().st_size>14000
                  with Image.open(f) as im: im.verify()
          print("PASS",rep["images_staged"],"staged source-exact photographs; all still require human pixel QA")
          PY
      - name: Commit only scored source evidence and licensed staged files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/muhlenbergia-reverchonii-wild-macro-scout-20261021.json
          git add workflow/photo-lab/muhlenbergia-reverchonii/ || true
          if git diff --cached --quiet; then echo "No new files"; exit 0; fi
          git commit -m "Stage verified CC wild seep muhly candidate macros for pixel QA [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
