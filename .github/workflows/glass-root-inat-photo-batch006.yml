name: Glass Root Garden Photo Review Batch 006

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/glass-root-inat-photo-batch006.yml

permissions:
  contents: write

concurrency:
  group: glass-root-inat-photo-review-batch006
  cancel-in-progress: false

jobs:
  gather-owner-photo-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install pillow
      - name: Gather original iNaturalist photo IDs from observer
        run: |
          python3 scripts/glass_root_inat_photo_metadata.py \
            --user calvinking --place-id 18 --taxon-id 47126 \
            --manifest data/manifest.json \
            --out workflow/glass-root-inat/batch-006/metadata
      - name: Select candidate photos and build contact sheets
        run: |
          python3 scripts/glass_root_inat_review_previews_batch006.py \
            --input workflow/glass-root-inat/batch-006/metadata/photo-candidates.csv \
            --out workflow/glass-root-inat/batch-006/previews \
            --per-species 10
      - name: Save review previews only without modifying canonical species cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/glass-root-inat/batch-006/previews workflow/glass-root-inat/batch-006/metadata/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage original owner-photo review sheets for four more botanical taxa"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-root-inat-batch-006-previews
          path: workflow/glass-root-inat/batch-006/
          retention-days: 30
