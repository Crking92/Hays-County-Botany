name: Review licensed Wikimedia grass photo
on:
  workflow_dispatch:
  push:
    paths:
      - 'workflow/photo-review-candidates/chloris-virgata-20261023.json'
      - 'workflow/photo-review-candidates/echinochloa-crus-galli-lane1-20261023.json'
      - 'scripts/commons_photo_review_import.py'
      - 'scripts/archive_lane1_barnyard_review.py'
      - '.github/workflows/grass-commons-photo-review.yml'
permissions:
  contents: write
concurrency:
  group: manual-grass-photo-review
  cancel-in-progress: false
jobs:
  fetch-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: 'File:Chloris virgata habit (6920191675).jpg'
            taxon: 'Chloris virgata'
            slug: 'whole-habit'
          - title: 'File:Chloris virgata spikelets young (6774152342).jpg'
            taxon: 'Chloris virgata'
            slug: 'young-spikelets'
          - title: 'File:Echinochloa crusgalli ligule1 (7120566875).jpg'
            taxon: 'Echinochloa crus-galli'
            slug: 'barnyard-ligule-absent'
          - title: 'File:Echinochloa crusgalli spikelet annotated (7120556227).jpg'
            taxon: 'Echinochloa crus-galli'
            slug: 'barnyard-spikelet-labelled'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Acquire candidate and strip EXIF
        env:
          TITLE: ${{ matrix.title }}
          TAXON: ${{ matrix.taxon }}
        run: python scripts/commons_photo_review_import.py --file-title "$TITLE" --taxon "$TAXON" --output review_photo
      - name: Archive and relink approved barnyardgrass anatomy only
        if: startsWith(matrix.slug, 'barnyard-')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TITLE: ${{ matrix.title }}
        run: python scripts/archive_lane1_barnyard_review.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: grass-photo-review-${{ matrix.slug }}
          path: review_photo/
          retention-days: 30
