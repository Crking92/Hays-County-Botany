name: Review licensed Wikimedia grass photo
on:
  workflow_dispatch:
    inputs:
      commons_file_title:
        description: 'Exact Commons File: title'
        required: true
        type: string
      taxon:
        description: 'Proposed canonical scientific name'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-grass-photo-review
  cancel-in-progress: false
jobs:
  fetch-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Acquire license checked candidate and strip EXIF
        env:
          TITLE: ${{ inputs.commons_file_title }}
          TAXON: ${{ inputs.taxon }}
        run: python scripts/commons_photo_review_import.py --file-title "$TITLE" --taxon "$TAXON" --output review_photo
      - uses: actions/upload-artifact@v4
        with:
          name: grass-photo-review
          path: review_photo/
          retention-days: 30
