name: Review licensed Wikimedia grass photo
on:
  workflow_dispatch:
    inputs:
      commons_file_title:
        description: 'Exact Commons File: title'
        required: true
        type: string
      taxon:
        description: 'Proposed canonical scientific name'
        required: true
        type: string
  push:
    paths:
      - 'workflow/photo-review-candidates/chloris-virgata-20261023.json'
permissions:
  contents: read
concurrency:
  group: manual-grass-photo-review
  cancel-in-progress: false
jobs:
  fetch-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: 'File:Chloris virgata habit (6920191675).jpg'
            taxon: 'Chloris virgata'
            slug: 'whole-habit'
          - title: 'File:Chloris virgata spikelets young (6774152342).jpg'
            taxon: 'Chloris virgata'
            slug: 'young-spikelets'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Acquire candidate and strip EXIF
        env:
          TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.commons_file_title || matrix.title }}
          TAXON: ${{ github.event_name == 'workflow_dispatch' && inputs.taxon || matrix.taxon }}
        run: python scripts/commons_photo_review_import.py --file-title "$TITLE" --taxon "$TAXON" --output review_photo
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: grass-photo-review-${{ matrix.slug }}
          path: review_photo/
          retention-days: 30
