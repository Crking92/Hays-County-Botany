name: Pilot iNaturalist photo retrieval
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_pilot_inat_photos.py'
      - '.github/workflows/pilot-inat-photo-retrieval.yml'
permissions:
  contents: write
jobs:
  retrieve:
    runs-on: ubuntu-latest
    concurrency:
      group: hays-inat-photo-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Download and validate candidate image bytes
        run: python scripts/import_pilot_inat_photos.py
      - name: Commit review-only downloaded photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-drafts/photo-imports/pilot-20261015
          if git diff --cached --quiet; then
            echo "No photo files or report updates"
          else
            git commit -m "Stage physically validated iNaturalist photos for manual visual review"
            git push
          fi
