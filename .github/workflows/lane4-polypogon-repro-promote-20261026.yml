name: Lane 4 promote licensed reproductive cluster photo
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_polypogon_repro_promote_20261026.py
      - .github/workflows/lane4-polypogon-repro-promote-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-polypogon-public-promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - run: python scripts/lane4_polypogon_repro_promote_20261026.py
      - name: Publish verified local macro with original photo credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Polypogon/polypogon-monspeliensis reports/lane4-polypogon-reproductive-promotion-20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 4 publish verified close reproductive Polypogon cluster photo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
