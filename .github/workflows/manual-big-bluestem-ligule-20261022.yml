name: Install licensed big bluestem true ligule close-up
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-big-bluestem-ligule-20261022.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hays-real-big-bluestem-ligule-20261022
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo decoder
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refresh latest canonical main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Verify exact licensed original bytes and archive real membrane photograph
        run: python scripts/install_big_bluestem_lacerate_ligule_20261022.py
      - name: Verify photo bytes/source credit/real ligule panel and untouched holds
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json
          b=Path('content/taxa/Poaceae/Andropogon/andropogon-gerardi')
          s=json.loads((b/'species.json').read_text())
          report=json.loads(Path('reports/big-bluestem-lacerated-ligule-licensed-photo-20261022.json').read_text())
          assert report['status']=='ACTUAL_LIGULE_JPEG_ARCHIVED'
          p=Path(report['path'])
          assert p.is_file() and p.stat().st_size>12000
          assert hashlib.sha256(p.read_bytes()).hexdigest()==report['stored_sha256']
          with Image.open(p) as im:
              assert im.format=='JPEG' and min(im.size)>=700
              assert not im.getexif().get(34853)
              im.verify()
          assert s['id']=='andropogon-gerardi'
          assert len(s['images'])==6
          assert len(s['visual_comparison']['items'])==10
          assert len(s['diagnostic_photo_second_pass_20261022']['photo_sequence'])==11
          m=[x for x in s['images'] if x.get('file')=='images/'+p.name]
          assert len(m)==1 and m[0]['creator']=='Matt Lavin' and m[0]['license']=='CC BY-SA 2.0'
          assert m[0]['source_original_sha1']=='8618950eaffb82bce6c70f058948db2970519471'
          panel=[x for x in s['visual_comparison']['items'] if x.get('source_page')=='https://commons.wikimedia.org/wiki/File:Andropogon_gerardii_-_4055509299.jpg']
          assert len(panel)==1 and panel[0]['image_url']==str(p)
          assert panel[0]['markers']==[]
          assert all(x.get('creator') and x.get('license') and x.get('source_page') for x in s['visual_comparison']['items'])
          assert s['field_id_finish_pass']['stage'].startswith('FIELD_READY_PHOTO_GAPS')
          print('PASS: new physical true ligule image, author credit and verified source checksum, preserved science and gallery')
          PY
      - name: Commit only scoped original rights, image and report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/taxa/Poaceae/Andropogon/andropogon-gerardi/
          git add reports/big-bluestem-lacerated-ligule-licensed-photo-20261022.json
          git add workflow/field-id-publication/2026-10-22-big-bluestem-ligule-real-archived.json
          if git diff --cached --quiet; then echo 'Already installed/no duplicate'; exit 0; fi
          git commit -m 'Archive real CC big bluestem lacerated ligule photo [skip ci]'
          for try_num in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish ordinary rights-filtered Visual Learner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-github-pages-learner.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Requested public rights-checked learner release after real source photo'
