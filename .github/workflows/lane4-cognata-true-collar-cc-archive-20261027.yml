name: Lane4 fall witchgrass true real collar source CC archive
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_archive_cognata_leaf_collars_cc_20261027.py
      - .github/workflows/lane4-cognata-true-collar-cc-archive-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-fall-witchgrass-true-licensed-collar-photos
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/lane4_archive_cognata_leaf_collars_cc_20261027.py
            content/taxa/Poaceae/Digitaria/digitaria-cognata
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify exact research-grade taxon, individual CC source and real EXIF-free JPEG
        run: python scripts/lane4_archive_cognata_leaf_collars_cc_20261027.py
      - name: Commit actual licensed collar photos and source records only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse content/taxa/Poaceae/Digitaria/digitaria-cognata/ reports/lane4-cognata-true-collar-cc-photo-archive-20261027.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane4 archive exact CC fall witchgrass real collar photos"
            pushed=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep 3
            done
            test "$pushed" = 1
          fi
