name: Lane 2 archive red lovegrass CC0 photograph
on:
  push:
    branches: [main]
    paths:
      - scripts/lane2_archive_red_lovegrass_cc0.py
      - .github/workflows/lane2-archive-red-lovegrass-cc0.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane2-red-lovegrass-cc0
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/lane2_archive_red_lovegrass_cc0.py
      - name: Commit only species gallery and rights audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Eragrostis/eragrostis-secundiflora/ reports/lane2-red-lovegrass-cc0-archive-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m "Lane 2 archive licensed red lovegrass species image"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
