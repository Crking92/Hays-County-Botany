name: Lane 3 aparejo exact-source extra anatomy rights scan
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lane3-utilis-two-photo-source-scout-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-utilis-two-photo-scout-20261026
  cancel-in-progress: false
jobs:
  source_scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refresh canonical source safely
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/species.json')
          doc=json.loads(path.read_text())
          assert doc["id"]=="muhlenbergia-utilis"
          assert len(doc["images"])>=6
          PY
      - name: Verify exact original photo rights and make human-review contact sheet
        run: python scripts/lane3_utilis_two_photo_rights_pixels_20261026.py
      - name: Commit evidence only, preserve source photos and scientific holds
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-utilis-two-photo-scout-20261026.json
          if test -f reports/lane3-utilis-two-photo-scout-20261026.jpg; then
            git add -f reports/lane3-utilis-two-photo-scout-20261026.jpg
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lane 3 source-license and pixel evidence for aparejo rhizome and reproductive candidates"
          donepush=0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then donepush=1; break; fi
            sleep 4
          done
          test "$donepush" = "1"
