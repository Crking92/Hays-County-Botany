name: Manual Kew synonym crosswalk photo batch B
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-crosswalk-photo-b.yml"
      - "workflow/manual-crosswalk-photo-b-20261019.json"
permissions:
  contents: write
concurrency:
  group: botany-curation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python -m py_compile scripts/manual_crosswalk_photo_b.py
      - run: python scripts/manual_crosswalk_photo_b.py
      - name: Commit attributed provisional cards and audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa data/manifest.json data/project.json reports curation-archive
          if git diff --cached --quiet; then
            echo "No verified installs to commit"
            exit 0
          fi
          git commit -m "Install Manual Kew crosswalk photo batch B [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
