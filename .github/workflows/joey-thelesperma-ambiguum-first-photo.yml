name: Verify Joey Thelesperma Ambiguum First Photo

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/joey-thelesperma-ambiguum-first-photo.yml

permissions:
  contents: write

concurrency:
  group: joey-thelesperma-ambiguum-first-photo
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Check observation rank, exact taxon, grade, photographer rights and image pixels
        run: python scripts/joey_thelesperma_ambiguum_first_photo.py
      - name: Verify report and any newly installed bytes
        run: |
          python - <<'PY'
          import json,pathlib
          from PIL import Image
          report=json.loads(pathlib.Path("reports/joey-thelesperma-ambiguum-first-photo.json").read_text())
          print(report["status"],report["reason"])
          if report["status"]=="installed_provisional":
              p=pathlib.Path("content/taxa/Asteraceae/Thelesperma/thelesperma-megapotamicum-var-ambiguum/species.json")
              doc=json.loads(p.read_text())
              assert doc["project_inclusion"]["target_zone_status"]=="PROVISIONAL"
              assert len(doc["images"])==1
              im=doc["images"][0]
              assert im["license"]=="CC BY-NC 4.0"
              f=p.parent/im["file"]
              assert f.is_file() and f.stat().st_size>16000
              with Image.open(f) as image:image.verify()
              print("Verified",im["source_page"])
          PY
      - name: Commit exact source and report, not any scientific changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Asteraceae/Thelesperma/thelesperma-megapotamicum-var-ambiguum/ reports/joey-thelesperma-ambiguum-first-photo.json reports/photo-fast-fill-zero-queue.json
          if git diff --cached --quiet; then echo "Already current"; exit 0; fi
          git commit -m "Check or install provisional first Joey photo for Thelesperma ambiguum [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
