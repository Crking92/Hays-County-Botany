name: Lane1 Hall panicgrass Blanco County rooted voucher CC0 archive
on:
  push:
    branches: [main]
    paths:
      - scripts/lane1_archive_hallii_usda_blanco_voucher_20261027.py
      - .github/workflows/lane1-archive-hallii-usda-blanco-root-voucher-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane1-blanco-hallii-cc0-root-voucher
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/lane1_archive_hallii_usda_blanco_voucher_20261027.py
            content/taxa/Poaceae/Panicum/panicum-hallii/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow beautifulsoup4
      - name: Confirm exact government herbarium specimen, rights and full image
        run: python scripts/lane1_archive_hallii_usda_blanco_voucher_20261027.py
      - name: Commit actual photograph and licensed teaching panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae/Panicum/panicum-hallii/
          if ! git diff --cached --quiet; then
            git commit -m "Lane 1: add actual Blanco County Hallii preserved fibrous root specimen"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Successfully published rooted voucher on attempt $attempt"
                exit 0
              fi
              echo "Concurrent writer, rebase and retry $attempt"
              sleep 3
            done
            echo "Couldn't publish after 8 conflict-safe attempts"
            exit 1
          fi
