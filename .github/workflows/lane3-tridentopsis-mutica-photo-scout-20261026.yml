name: Lane 3 slim tridens rights-screened plant base and collar photo scout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lane3-tridentopsis-mutica-photo-scout-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane3-muticascout-20261026
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refresh canonical rights-preserved source
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('content/taxa/Poaceae/Tridentopsis/tridentopsis-mutica/species.json')
          d=json.loads(p.read_text())
          assert d['id']=='tridentopsis-mutica' and len(d['images'])>=3
          assert sum(x.get('license')=='CC BY-NC 4.0' for x in d['images'])>=2
          PY
      - name: Search source exact-taxon photo licensing, inspect contact sheet
        run: python scripts/lane3_scout_tridentopsis_mutica_public_20261026.py
      - name: Commit source evidence only without installing images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lane3-tridentopsis-mutica-photo-scout-20261026.json
          if test -f reports/lane3-tridentopsis-mutica-photo-scout-20261026.jpg; then
            git add -f reports/lane3-tridentopsis-mutica-photo-scout-20261026.jpg
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lane 3 screen exact licensed slim tridens source photographs for anatomy"
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 4
          done
          test "$pushed" = 1
