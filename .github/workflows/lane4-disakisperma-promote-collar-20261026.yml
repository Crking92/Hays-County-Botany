name: Lane 4 green sprangletop verified collar and tillering photos
on:
  push:
    branches: [main]
    paths:
      - scripts/lane4_disakisperma_promote_collar_20261026.py
      - .github/workflows/lane4-disakisperma-promote-collar-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lane4-disakisperma-collar-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - name: Install photo-level rights verified and visually reviewed originals
        run: python scripts/lane4_disakisperma_promote_collar_20261026.py
      - name: Publish canonical JSON and EXIF-free JPEGs safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git add content/taxa/Poaceae/Disakisperma/disakisperma-dubium/ reports/lane4-disakisperma-collar-promotion-20261026.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Lane 4 publish green sprangletop collar views and basal tillers"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
            git fetch origin main
            git reset --hard origin/main
            python scripts/lane4_disakisperma_promote_collar_20261026.py
          done
          exit 1
